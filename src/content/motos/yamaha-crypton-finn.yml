descripcion: >-
  La Yamaha Crypton Finn FI es una moto de concepto utilitario con estética de cub
  clásica: 114 cc, 8,9 HP, inyección electrónica y un consumo de 48 km/l por 9.100.000
  pesos. Es la moto más económica de Yamaha en Colombia y una de las más eficientes en
  combustible de todo el mercado. Es para ti si buscas movilidad urbana simple, con
  respaldo de marca y bajo consumo. No es para ti si necesitas frenos de disco o si haces
  carretera: con tambor en las dos ruedas y 8,9 caballos, sus límites son claros.
uso_diario: >-
  La Crypton está pensada para el uso más básico: trayectos urbanos cortos, un solo
  ocupante, velocidades de 40 a 60 km/h. El motor de 114 cc con inyección arranca al
  primer toque en frío y mantiene el ralentí estable en altura, algo que agradecen quienes
  viven en ciudades por encima de 2.000 metros. Pesa solo 106 kilos, el asiento a 770 mm
  es accesible y la posición es erguida y cómoda. La caja de cuatro marchas es corta: en
  ciudad se maneja entre segunda y tercera, y la cuarta es prácticamente una sobremarcha
  que sirve para mantener 60 km/h con poco esfuerzo. Los frenos son de tambor en las dos
  ruedas, sin ABS: es el punto más criticado de la moto, sobre todo en pavimento mojado.
  El tanque de 10,6 litros con un consumo de 48 km/l da más de 500 km de autonomía, una
  cifra sobresaliente. La suspensión es blanda y absorbe bien el asfalto roto.
