costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Yamaha. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento es de los más económicos del
  catálogo: zapatas en lugar de pastillas, llantas de medida pequeña y un motor sencillo.
  El único costo que llama la atención es el precio de compra, alto para lo que ofrece en
  equipamiento.
comparativa: >-
  Frente a la AKT Flex 125, la Crypton cuesta 3,2 millones más y ofrece inyección y
  respaldo Yamaha, aunque pierde 1,7 caballos y la caja semiautomática no existe aquí.
  Contra la Honda Navi, la Yamaha cuesta 1,4 millones más y ofrece un tanque casi del
  doble de tamaño, aunque pierde la imagen y la practicidad del formato Navi. Y si el
  presupuesto aprieta, la Bajaj CT100 cuesta la mitad y hace el mismo trabajo urbano.
faq:
  - pregunta: "¿Cuánto consume realmente la Crypton Finn FI?"
    respuesta: >-
      El homologado es 48 km/l. En ciudad con tráfico y paradas constantes el registro está
      entre 43 y 46; en tramos planos y largos se acerca a 50. Con 10,6 litros de tanque la
      autonomía práctica es de 450 a 530 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Poco. A 60 km/h va cómoda y a 70 ya va al límite. Las cuatro marchas y los 8,9 caballos
      no están pensados para sostener velocidades de vía rápida, y los frenos de tambor
      tampoco. Es una moto urbana con capacidad de vía secundaria muy corta.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve para pedidos pequeños y trayectos cortos, sobre todo por el consumo y la
      autonomía. Pero cuesta 9,1 millones y no tiene freno de disco: para reparto intenso, una
      125 de trabajo cuesta la mitad y frena mejor.
  - pregunta: "¿Cuánto cuesta el SOAT de la Crypton Finn FI?"
    respuesta: >-
      Con 114 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es la
      misma tarifa de una 125, y sobre una moto de 9,1 millones representa el 3,8 % del valor.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí en lo mecánico: es liviana, baja, con potencia muy contenida y sin reacciones
      bruscas. El problema es la seguridad: sin freno de disco ni ABS, un novato en lluvia
      tiene menos margen que en una moto con frenos modernos por menos dinero.
veredicto: >-
  La Crypton Finn FI es una moto honesta para lo que cuesta operarla: consumo récord,
  inyección y respaldo Yamaha. Su problema es el precio de entrada y la ausencia de freno
  de disco, dos argumentos que en 2026 pesan mucho frente a la competencia.
