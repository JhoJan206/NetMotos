costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es contenido, con intervalos de aceite de
  4.000 km gracias a la inyección. El riesgo, otra vez, es la disponibilidad de repuestos:
  conviene confirmar que hay concesionario o taller con inventario cerca antes de comprar.
comparativa: >-
  Frente a la Hero Hunk 125R, la 160R cuesta 900.000 pesos más y ofrece 4,2 caballos
  adicionales, inyección y ABS: es un salto enorme por muy poco dinero. Contra la Bajaj
  Pulsar N160 Pro, la Hero cuesta 5,5 millones menos y pierde ABS de doble canal,
  suspensión invertida y conectividad, aunque gana 0,8 caballos en ficha. Y si el
  presupuesto llega a nueve millones, la Pulsar P150 ofrece un paquete más equilibrado y
  una red de servicio mucho mayor.
faq:
  - pregunta: "¿Cuánto consume realmente la Hunk 160R?"
    respuesta: >-
      El homologado es 44 km/l. En ciudad con tráfico denso baja a 38-41; en carretera a 85
      km/h sube a 46-48. Con 10 litros de tanque la autonomía práctica va de 390 a 480 km,
      algo corta frente a rivales con tanque de 12 litros.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura: mantiene 95 km/h sin esfuerzo y llega a 110 en plano. Es una 160 con
      capacidad real de vía rápida. El tanque de 10 litros obliga a planear las paradas cada
      400 km aproximadamente.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, con la misma advertencia que su hermana 125: la red de servicio. Mecánicamente es
      una buena herramienta, con consumo razonable y repuestos baratos. Pero si trabajas con
      la moto todos los días, un repuesto que no llega es dinero perdido.
  - pregunta: "¿Cuánto cuesta el SOAT de la Hunk 160R?"
    respuesta: >-
      Con 163 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es la
      misma tarifa de una 125, y sobre una moto de 5,49 millones representa el 6,3 % del
      valor: una de las proporciones más altas del segmento.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, con criterio. La inyección y la entrega progresiva la hacen fácil de manejar, y el
      ABS delantero cubre el error más común del novato. Los 15,2 caballos invitan a acelerar
      más de lo prudente, así que conviene respetar los primeros meses.
veredicto: >-
  En ficha técnica, la Hunk 160R es casi imbatible: 15,2 caballos, inyección, ABS y doble
  disco por 5,49 millones. En la vida real, la compra depende de una sola pregunta: ¿hay
  taller Hero cerca de donde vives o trabajas?
