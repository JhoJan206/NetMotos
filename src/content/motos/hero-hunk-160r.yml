descripcion: >-
  La Hero Hunk 160R es una 160 con inyección electrónica, ABS delantero, 15,2 HP y doble
  disco por 5.490.000 pesos. En ficha técnica es una de las propuestas más agresivas del
  segmento en relación precio-equipo. Es para ti si quieres salir de la 125 con
  prestaciones reales sin gastar diez millones. No es para ti si valoras la red de
  servicio por encima de todo: Hero tiene menos puntos de atención en el país y eso pesa
  en el día a día.
uso_diario: >-
  Los 15,2 HP del motor de 163 cc con inyección entregan una respuesta notablemente más
  viva que cualquier 125: permite mantener 90-95 km/h en carretera sin esfuerzo y llegar a
  110 en plano. La inyección resuelve el arranque en frío y estabiliza el ralentí en
  altura. Pesa 129 kilos, lo que la hace ágil en ciudad y fácil de maniobrar. El asiento a
  795 mm es accesible y la posición erguida, cómoda para trayectos de una hora. El ABS
  delantero sobre disco de 276 mm da margen en frenadas de emergencia, y el disco trasero
  de 220 mm completa un equipo serio. El tanque de 10 litros es el punto débil: con 44
  km/l da unos 440 km, pero obliga a tanquear más seguido que rivales con 12 o 13 litros.
  La suspensión es firme y estable en curva, algo seca en vías rotas.
