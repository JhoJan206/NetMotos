costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Honda. El SOAT
  y la técnico-mecánica van aparte. Es la ficha más cara de mantener de todo el catálogo,
  y no por capricho: aceite de 195.000 pesos cada 6.000 km, llantas de medida grande por
  encima de 500.000 pesos y un bicilíndrico que exige insumos de moto grande. Quien compra
  una 500 debe asumir que el mantenimiento anual equivale a una moto de trabajo completa.
comparativa: >-
  Frente a la Honda XRE 300, la NX500 cuesta 21,4 millones más y ofrece 21,5 caballos
  adicionales, un motor bicilíndrico, ABS de doble canal y autonomía muy superior: es un
  salto de categoría, no una versión mejorada. Contra la Yamaha Ténéré 700, la Honda
  cuesta unos 20 millones menos y pierde 25 caballos y capacidad de trocha real, aunque
  gana en peso y en facilidad de uso diario. Y si el uso es más de trail ligero y el
  presupuesto aprieta, la Kawasaki Versys-X 300 hace el 70 % del trabajo por la mitad.
faq:
  - pregunta: "¿Cuánto consume realmente la NX500?"
    respuesta: >-
      El homologado es 24 km/l. En carretera a 110 km/h el registro real está entre 22 y 25;
      en ciudad con tráfico baja a 18-20. Con 17,7 litros de tanque la autonomía práctica va
      de 320 a 440 km, con la ventaja de que en viaje se acerca al extremo alto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno natural. Mantiene 130 km/h con el motor relajado y tiene reserva hasta
      170. El bicilíndrico no vibra, el asiento es amplio y la protección aerodinámica es
      suficiente para trayectos de 400 km por día. Es una turística con capacidad de trocha
      liviana.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Cuesta 54,9 millones, pesa 196 kilos, consume 20 km/l en ciudad y su mantenimiento
      supera los dos millones al año. Es una moto de viaje y disfrute. Para trabajo, una 125 o
      150 cuesta cinco veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la NX500?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 250, lo que significa que el SOAT no escala
      con el cilindraje por encima de ese umbral.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No como primera moto. Pesa 196 kilos, tiene 47,5 caballos y una altura de asiento de 830
      mm. Es una moto para quien ya tiene experiencia en 250 o 300 y quiere dar el salto a
      viajar. La suavidad del motor ayuda, pero el peso en maniobras lentas no perdona.
veredicto: >-
  La NX500 es la adventure que hace todo bien y nada extremo: motor suave, autonomía real
  y comodidad de carretera con capacidad de trocha liviana. Su problema es el precio: 54,9
  millones la ponen fuera del alcance de la mayoría, y a ese nivel la competencia es
  feroz.
