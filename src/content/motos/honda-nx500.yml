descripcion: >-
  La Honda NX500 es la adventure de media cilindraje de Honda: motor bicilíndrico de 471
  cc, 47,5 HP, 43 Nm, ABS de doble canal y un tanque de 17,7 litros por 54.900.000 pesos.
  Es la moto con la que Honda quiere cubrir el hueco entre una 300 y una 700, con un
  enfoque de trail asfáltico: capacidad de trocha liviana, pero comodidad y prestaciones
  de carretera. Es para ti si quieres viajar por el país con parrillero y equipaje, con un
  motor suave y autonomía real. No es para ti si tu presupuesto está por debajo de los 50
  millones o si esperas una moto de enduro: 196 kilos y 190 mm al piso no son una trail
  dura.
uso_diario: >-
  El bicilíndrico de 471 cc es la razón de ser de esta moto: entrega 47,5 HP de forma muy
  suave, sin vibraciones molestas a 120 km/h, y con un torque de 43 Nm que permite
  adelantar en sexta sin bajar dos marchas. Es un motor que se siente refinado en
  cualquier régimen, y eso en trayectos de 400 km marca una diferencia enorme frente a un
  monocilíndrico. Los 17,7 litros de tanque, con un consumo de 24 km/l, dan más de 420 km
  de autonomía real, suficiente para cruzar tramos largos sin preocuparse. La posición es
  erguida, con manubrio ancho y estriberas centradas, cómoda para dos horas seguidas. El
  asiento a 830 mm es accesible para estaturas medias. El ABS de doble canal funciona
  sobre disco doble de 296 mm adelante, con una frenada potente y bien modulada. En
  ciudad, los 196 kilos y el ancho del manubrio complican filtrar entre carros; es una
  moto que se disfruta en carretera, no en el tráfico. La suspensión absorbe bien el
  asfalto roto, aunque en destapado serio se queda corta de recorrido.
