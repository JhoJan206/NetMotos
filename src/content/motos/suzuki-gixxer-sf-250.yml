descripcion: >-
  La Suzuki Gixxer SF 250 es la deportiva carenada de 250 cc de Suzuki: 26,1 HP, 22 Nm,
  ABS de doble canal y un carenado completo por 17.130.000 pesos. Es la alternativa
  racional a las deportivas de 300 y 400, con un motor refrigerado por aceite que prioriza
  durabilidad sobre cifras de ficha. Es para ti si quieres una deportiva carenada para
  carretera, con posición tolerable y mantenimiento contenido. No es para ti si buscas
  prestaciones puras o si haces mucha ciudad: 161 kilos y una postura inclinada cobran
  factura en tráfico.
uso_diario: >-
  El motor de 249 cc entrega 26,1 HP con una linealidad que se agradece: no hay un pico
  violento, la potencia sube de forma progresiva hasta las 9.000 rpm y la caja de seis
  marchas permite mantenerlo en la zona buena sin esfuerzo. La refrigeración por aceite es
  una solución poco común en 250 y ayuda en tráfico lento, donde un motor líquido
  trabajaría más. En carretera el carenado protege bien hasta 120 km/h y la moto se siente
  estable en curva gracias a un chasis rígido. La posición es deportiva pero no extrema:
  el torso va inclinado y las estriberas algo retrasadas, tolerables durante una hora. El
  asiento a 800 mm es accesible. El ABS de doble canal con disco de 300 mm adelante da una
  frenada contundente y bien modulada. Pesa 161 kilos, que se notan en maniobras de
  parqueadero. El consumo de 30 km/l con 12 litros da unos 360 km de autonomía, algo corta
  para una deportiva de turismo.
