costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Suzuki. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento es el de una 250: llantas de 17
  pulgadas, pastillas en las dos ruedas y aceite sintético. A eso hay que sumar el costo
  de los plásticos en caso de caída, que en una carenada nunca es menor de 500.000 pesos
  por lateral.
comparativa: >-
  Frente a la Yamaha FZ25, la Gixxer SF cuesta 500.000 pesos más y ofrece carenado
  completo, ABS de doble canal y 4,6 caballos adicionales: para carretera es claramente
  superior. Contra la Kawasaki Ninja 400, la Suzuki cuesta 12,8 millones menos y pierde
  19,4 caballos y un motor bicilíndrico, aunque gana en costo de mantenimiento y en
  consumo. Y si el objetivo es una deportiva de 250 con mejor red de servicio, la Yamaha
  R15 ofrece menos cilindraje pero mucha más posventa.
faq:
  - pregunta: "¿Cuánto consume realmente la Gixxer SF 250?"
    respuesta: >-
      El homologado es 30 km/l. En ciudad con tráfico el registro está entre 25 y 28; en
      carretera a 100 km/h sube a 32-34. Con 12 litros de tanque la autonomía práctica va de
      300 y 410 km, algo corta para una moto con vocación de carretera.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 120 km/h y capacidad de llegar a 140. El carenado protege del
      viento y el chasis es estable en curva. La posición deportiva cansa después de dos
      horas, pero la moto en sí está hecha para trayectos de 200 a 300 km.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es lo más eficiente: consume 26 km/l en ciudad, el mantenimiento supera el millón y
      medio anual y una caída implica reparar plásticos. Para reparto intenso, una moto con
      cadena y sin carenado cuesta mucho menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Gixxer SF 250?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Son 418.000 pesos más que una 200, y hay que sumarlos a un
      mantenimiento que ya ronda el millón y medio.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No como primera moto. La posición deportiva, los 161 kilos y una entrega de potencia que
      invita a subir de vueltas exigen experiencia. El ABS de doble canal ayuda, pero es una
      moto para después de un año en 150 o 200.
veredicto: >-
  La Gixxer SF 250 es la deportiva carenada más equilibrada del segmento: suficiente
  potencia para viajar, posición tolerable para el día a día y un motor que prioriza
  durar. Su limitación es el tanque y la red de servicio, no la mecánica.
