costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Los repuestos de la familia Discover comparten cadena de
  distribución con otras Bajaj, así que se consiguen con facilidad y a precios contenidos.
  El intervalo de aceite de 3.500 km es más largo que el de una 125 carburada, lo que
  reduce las visitas al taller.
comparativa: >-
  Frente a la Bajaj Pulsar N125 FI, la Discover ofrece 0,16 caballos más y cuesta 1,1
  millones menos, aunque pierde el sistema Start-Stop, el tablero con conectividad y la
  distancia al piso de 198 mm. Contra la Honda CB125F, la Bajaj gana 1,2 caballos y cuesta
  1,8 millones menos, y pierde en acabado y en red de servicio. Y si el presupuesto lo
  permite, la Bajaj Pulsar N160 Pro ofrece 4 caballos más y ABS de doble canal por 4
  millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Discover 125 Sport?"
    respuesta: >-
      El homologado es 42 km/l. En ciudad con tráfico el registro está entre 37 y 40; en
      carretera a 80 km/h sube a 45. Con 11 litros de tanque la autonomía práctica es de 410 a
      500 km, suficiente para una semana de uso mixto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, mejor que la mayoría de 125: mantiene 85-90 km/h con comodidad y llega a 100 en
      plano. Para trayectos de 100 a 120 km es una moto válida. Por encima de eso, el asiento
      y la ausencia de protección aerodinámica terminan cansando.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, por consumo contenido, precio accesible y repuestos baratos. Su ventaja frente a la
      N125 FI es el precio de entrada; su desventaja es un tanque un litro menor y menos
      protección contra el agua. Para reparto urbano es una opción sensata.
  - pregunta: "¿Cuánto cuesta el SOAT de la Discover 125 Sport?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es el
      4,9 % del precio de la moto, una proporción menor que la de una 125 de cinco millones y
      superior a la de una moto de trabajo.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, con algo de criterio. La entrega es progresiva y el peso es contenido, pero 12
      caballos en una moto de 118 kilos invitan a acelerar más de lo prudente en los primeros
      meses. El tambor trasero exige aprender a frenar con el delantero como eje.
veredicto: >-
  La Discover 125 Sport es una 125 con más músculo del habitual a precio razonable. Su
  tarea pendiente es la reputación: el nombre carga con la historia de versiones
  anteriores y eso afecta la reventa. Mecánicamente, está a la altura de la mejor
  competencia india.
