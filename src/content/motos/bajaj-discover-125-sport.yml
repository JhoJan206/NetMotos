descripcion: >-
  La Bajaj Discover 125 Sport regresó al mercado colombiano con una propuesta clara: 12
  HP, inyección electrónica, freno de disco delantero y diseño deportivo por 6.999.000
  pesos. Es la 125 más potente de Bajaj y una de las más potentes del segmento, con 1,5
  caballos por encima de la Pulsar N125 FI y 1,2 por encima de la Honda CB125F. Es para ti
  si quieres una 125 con carácter, algo de equipo y precio contenido. No es para ti si te
  preocupa la reventa: el nombre Discover arrastra el recuerdo de generaciones anteriores
  con reputación irregular, y eso pesa en el mercado de usados.
uso_diario: >-
  El motor de 124,6 cc con inyección entrega 12 HP a 8.000 rpm, con una respuesta más viva
  que la media del segmento. En ciudad se siente ágil y en carretera permite cruceros de
  85-90 km/h sin que el motor parezca sufrir, algo poco habitual en una 125. La inyección
  resuelve el arranque en frío y estabiliza el ralentí en altura. Pesa 118 kilos, lo que
  la mantiene ágil entre carros. El asiento a 780 mm y la posición ligeramente deportiva
  son cómodos para trayectos de 40 minutos. El freno de disco delantero de 240 mm funciona
  bien; el tambor trasero de 130 mm es el punto débil, igual que en casi toda la
  competencia. La suspensión es firme y transmite más los huecos que la de una Honda,
  aunque gana en estabilidad en curva. El consumo de 42 km/l con 11 litros de tanque da
  unos 440 km de autonomía, una cifra correcta.
