descripcion: >-
  La Hero Xpulse 200 4V es una doble propósito de 199 cc con enfoque trail: 19,1 HP, 220
  mm de distancia al piso, 158 kilos y un tanque de 13 litros por 15.999.000 pesos. Es una
  moto pensada para quien quiere una adventure ligera de verdad, con capacidad de trocha y
  postura de pie sobre las estriberas. Es para ti si haces caminos destapados largos y
  quieres una moto con recorrido de suspensión real. No es para ti si haces carretera
  abierta: 19 caballos y una aerodinámica desfavorable la limitan a 110 km/h.
uso_diario: >-
  La Xpulse es, de las doble propósito de este catálogo, la que tiene el enfoque más
  trail. Los 220 mm al piso y la suspensión de largo recorrido permiten pasar terreno roto
  con una soltura que una XR150L o una TTR 200 no alcanzan. El motor de 199 cc con
  inyección entrega 19,1 HP con un torque que aparece temprano y permite subir en segunda
  por caminos empinados sin exigir el embrague. La postura es erguida, con estriberas
  anchas que permiten ponerse de pie, y el asiento a 825 mm exige cierta estatura. En
  carretera mantiene 100-110 km/h, con vibración perceptible a revoluciones altas. Pesa
  158 kilos, bastante para el cilindraje, y eso se nota en trocha técnica. El doble disco
  con ABS en ambas ruedas es un equipo serio. El consumo de 32 km/l con 13 litros da unos
  400 km de autonomía.
