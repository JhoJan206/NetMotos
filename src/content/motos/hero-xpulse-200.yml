costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. Las llantas de doble propósito y el kit de arrastre son
  los rubros que más pesan, porque el polvo y el barro aceleran el desgaste. El motor de
  199 cc mantiene el SOAT en la categoría intermedia, un alivio frente a una 250.
comparativa: >-
  Frente a la Honda XRE 300, la Xpulse cuesta 17,5 millones menos y ofrece 6,9 caballos
  menos, aunque la diferencia de precio es de otra categoría. Contra la AKT TT200 ABS, la
  Hero gana 2,3 caballos, ABS en las dos ruedas y 10 mm más de altura al piso, por 6,2
  millones adicionales. Y si el uso es más de trabajo rural que de trail, la Honda XR150L
  o la Bajaj Boxer 150X cuestan una fracción y cumplen.
faq:
  - pregunta: "¿Cuánto consume realmente la Xpulse 200?"
    respuesta: >-
      El homologado es 32 km/l. En trocha con pendientes baja a 26-28; en carretera a 90 km/h
      sube a 35. Con 13 litros de tanque la autonomía práctica va de 340 a 460 km, suficiente
      para una ruta de un día sin recargar.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, hasta 110 km/h, con vibración a revoluciones altas. Es una moto de trail con
      capacidad de enlace por asfalto, no una turística. Para trayectos de 150 km mixtos es
      competente; para 400 km de autopista, incómoda.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zonas rurales con caminos rotos, sí, y con ventaja sobre motos de calle. En ciudad
      pavimentada no tiene sentido: gastas llantas de tacos, pesas 158 kilos y pagas 16
      millones por capacidad que no usas.
  - pregunta: "¿Cuánto cuesta el SOAT de la Xpulse 200?"
    respuesta: >-
      Con 199 cc se queda por debajo de los 200, así que paga la categoría de 100 a 200 cc:
      alrededor de 343.000 pesos al año. Es una ventaja de 418.000 pesos frente a una 250, y
      una de las razones por las que este cilindraje es tan popular.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha sí, porque la suspensión larga y el ABS perdonan mucho. En ciudad y en
      carretera es exigente por la altura del asiento y el peso. Un principiante que solo
      ruede en asfalto debería empezar en una moto de calle.
veredicto: >-
  La Xpulse 200 es la trail ligera más completa del mercado por debajo de los veinte
  millones: 220 mm al piso, ABS doble y postura de pie. Su limitación es la potencia en
  carretera y su red de servicio, no su capacidad fuera del asfalto.
