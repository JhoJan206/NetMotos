costo_anual_cop: 950000
costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. Es más costosa de mantener que una 125 de calle por las
  llantas de doble propósito, que se gastan antes, y por el kit de arrastre, que sufre con
  polvo y barro. A cambio, la disponibilidad de repuestos Honda en el país es la mejor del
  mercado.
comparativa: >-
  Frente a la AKT TTR 125, la XR150L ofrece 1,4 caballos más, ABS delantero y una red de
  servicio mucho más amplia, a cambio de unos 3,6 millones adicionales. Contra la Yamaha
  XTZ150, la Honda gana en fama de indestructible y en reventa, y pierde en precio por
  unos cuatro millones. Y si el uso va a ser más de carretera que de trocha, la Honda XRE
  300 o la Yamaha XTZ250 son el siguiente escalón lógico.
faq:
  - pregunta: "¿Cuánto consume realmente la XR150L?"
    respuesta: >-
      El dato de ficha es 42 km/l. En trocha, con primera y segunda constantes, baja a 33-36;
      en asfalto a 70 km/h sube a 45. Con 12 litros de tanque la autonomía práctica va de 400
      a 520 km según el terreno.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos de 100 a 150 km a 75 km/h, sí. Es una moto de trabajo, no de viaje: por encima de
      80 el motor vibra y el asiento largo cansa. Para trayectos interurbanos largos hay
      opciones más adecuadas en el mismo rango de precio.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zonas rurales, es la referencia. Aguanta peso, maltrato, caminos en mal estado y
      arranca a pedal si algo falla. En ciudad pavimentada no tiene sentido: gastas llantas de
      tacos, pierdes agilidad y pagas un precio alto por capacidad que no usas.
  - pregunta: "¿Cuánto cuesta el SOAT de la XR150L?"
    respuesta: >-
      Con 149,15 cc entra en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año,
      más la revisión técnico-mecánica. Es el mismo valor de cualquier 150, aunque el precio
      de la moto sea casi el doble que el de una 125 económica.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Depende del terreno. En trocha perdona mucho y el motor es muy dócil. En ciudad es
      exigente por la altura del asiento de 825 mm y el peso del manubrio. Para un
      principiante urbano, una 125 de calle es una mejor escuela.
veredicto: >-
  La XR150L no es la moto más moderna ni la más equipada: es la que sigue funcionando
  cuando las demás piden taller. En un país con la mitad de las vías sin pavimentar, ese
  atributo vale más que cualquier ficha técnica.
