descripcion: >-
  La Honda XR150L 2.0 ABS es la doble propósito que sostiene el trabajo rural colombiano
  desde hace más de dos décadas. Motor de 149 cc, 11,7 HP, 195 mm de distancia al piso y
  la posibilidad de arrancar a pedal cuando la batería falla: tres cosas que explican por
  qué se ve en cada vereda del país. Es para ti si vives o trabajas fuera del asfalto, si
  necesitas una moto que aguante maltrato y si valoras encontrar repuestos en cualquier
  municipio. No es para ti si solo ruedas en ciudad, si buscas prestaciones o si tu
  presupuesto no llega a once millones: en asfalto puro estarías pagando por capacidades
  que no usas.
uso_diario: >-
  La XR150L no pretende ser cómoda ni rápida: pretende no romperse. La suspensión de
  recorrido largo y las llantas de 19 y 17 pulgadas con tacos moderados absorben piedra
  suelta, rieles y barro liviano sin transmitir el golpe al chasis. La altura al piso de
  195 mm es suficiente para pasar corrientes de agua y troncos bajos, y el asiento a 825
  mm obliga a los pilotos bajos a estirarse al detenerse. El motor de 107 cc de carrera
  larga entrega 11,7 HP con un torque utilísimo a bajas vueltas: en trocha se maneja casi
  solo en segunda, sin necesidad de embrague constante. En carretera sostiene 75-80 km/h,
  con vibración perceptible y sin resto para adelantar. Los frenos son el punto más
  criticado: disco delantero con ABS, tambor trasero. El ABS funciona, pero el tambor
  trasero se queda corto en bajadas largas con carga. El detalle del doble arranque es
  puro sentido práctico rural.
