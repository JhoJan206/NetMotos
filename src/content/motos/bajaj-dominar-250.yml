costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Aquí hay tres saltos de costo frente a una 200: SOAT de
  categoría alta, llantas de 17 pulgadas más anchas y aceite sintético con intervalos de
  5.000 km. Es el costo real de viajar cómodo y con dos personas.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la Dominar 250 cuesta 2,6 millones más y ofrece 2,5
  caballos, ABS de doble canal y una posición claramente más turística: el salto tiene
  sentido si el uso incluye carretera. Contra la Suzuki V-Strom 250, la Dominar cuesta 8,1
  millones menos y gana 2,6 caballos, aunque pierde el motor bicilíndrico y la capacidad
  de trocha liviana. Y si el presupuesto alcanza, la Dominar 400 ofrece 24,5 HP, horquilla
  invertida y más presencia por 3,6 millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Dominar 250?"
    respuesta: >-
      El homologado es 30 km/l. En ciudad con tráfico denso baja a 25-27; en carretera a 100
      km/h sube a 33-35. Con 13 litros de tanque la autonomía práctica va de 330 a 450 km,
      suficiente para un viaje de un día sin recargar.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno natural. Mantiene 120 km/h sin esfuerzo y tiene reserva hasta 145. La
      posición erguida, el asiento amplio y el ABS de doble canal la hacen una turística de
      acceso muy competente para trayectos de 300 km.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Pesa 164 kilos, consume 26 km/l en ciudad y su mantenimiento es de moto grande. Es
      una moto de disfrute y de viaje, no una herramienta de reparto. Para trabajo, una 125
      cuesta menos de la mitad de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Dominar 250?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, y hay que sumarlo a un
      mantenimiento que ya supera el millón de pesos anuales.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No como primera moto. Los 26,6 caballos y los 164 kilos exigen experiencia, sobre todo
      en maniobras lentas y en frenadas de emergencia. Es una excelente segunda moto para
      quien ya lleva un año en 150 o 200.
veredicto: >-
  La Dominar 250 es la forma más económica de entrar al turismo deportivo con ABS de doble
  canal y suspensión invertida. No es ágil en ciudad ni barata de mantener, pero para
  viajar con parrillero por el país no hay nada mejor por menos de dieciséis millones.
