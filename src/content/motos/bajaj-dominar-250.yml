descripcion: >-
  La Bajaj Dominar 250 es la hermana menor de la Dominar 400: 248,8 cc, 26,6 HP, 21,5 Nm,
  ABS de doble canal y suspensión invertida por 15.799.000 pesos. Está pensada como
  turismo deportivo de acceso: potencia suficiente para viajar, comodidad para dos
  personas y equipo completo. Es para ti si quieres una 250 para carretera con parrillero
  y equipaje, sin pagar el precio de una japonesa. No es para ti si tu uso es 100 % urbano
  o si buscas una moto ligera: 164 kilos se sienten en cada maniobra lenta.
uso_diario: >-
  Las 26,6 caballos mueven 164 kilos con soltura, y lo más valioso es el torque de 21,5 Nm
  que llega a 6.500 rpm: permite adelantar en sexta sin bajar dos marchas, algo que en
  carretera colombiana con tractomulas se agradece. La posición de manejo es erguida con
  estriberas centradas, cómoda para dos horas, exigente en tráfico denso por el peso. La
  suspensión invertida delantera le da una precisión en curva muy superior a la de una
  naked convencional. El ABS de doble canal funciona bien y es un argumento serio en una
  moto que puede rodar a 140 km/h. En ciudad, el peso y el radio de giro obligan a
  maniobras más amplias; el motor calienta y el ventilador entra seguido. El consumo de 30
  km/l con 13 litros de tanque da unos 390 km de autonomía, correcto para el cilindraje.
