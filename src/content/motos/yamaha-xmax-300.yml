costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Yamaha. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento del CVT —correa y rodillos— es
  el rubro que no existe en una moto con cadena, y en un scooter de 300 pesa más que en
  uno de 125. A eso se suman llantas de 13 y 14 pulgadas y SOAT de categoría alta.
comparativa: >-
  Frente a la Yamaha NMAX 155, la XMAX cuesta 17,9 millones más y ofrece 12,6 caballos
  adicionales, un baúl para dos cascos y estabilidad de carretera: es otro vehículo.
  Contra la AKT Jet Evo, la XMAX cuesta 22,1 millones más y ofrece 13,6 caballos
  adicionales y capacidad de carga muy superior. Y si el uso es exclusivamente urbano, la
  NMAX hace el 80 % del trabajo por la mitad del dinero.
faq:
  - pregunta: "¿Cuánto consume realmente la XMAX 300?"
    respuesta: >-
      El homologado es 26 km/l. En ciudad con tráfico el registro está entre 22 y 24; en
      carretera a 110 km/h sube a 28-30. Con 13 litros de tanque la autonomía práctica va de
      290 a 390 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es el scooter que mejor lo hace: mantiene 120 km/h sin esfuerzo y llega a 140. La
      posición erguida, el parabrisas y el peso contenido permiten trayectos de 250 km con
      comodidad. Es un scooter con capacidad real de vía rápida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, sobre todo por el baúl para dos cascos y la comodidad en trayectos largos. Pero
      cuesta 34,7 millones y su mantenimiento supera los dos millones al año: para reparto
      intenso, una 125 con cadena es mucho más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la XMAX 300?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es más del doble de lo que paga una 150, un salto que conviene
      considerar antes de subir de cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con cuidado. No hay embrague ni cambios, lo que facilita el aprendizaje, y el ABS y el
      control de tracción cubren errores. Pero pesa 181 kilos y tiene 27 caballos: no es un
      juguete. Es una buena primera moto para alguien con criterio y contextura.
veredicto: >-
  La XMAX 300 es el scooter que reemplaza un carro para trayectos urbanos largos: 27
  caballos, baúl para dos cascos y estabilidad de moto grande. Su precio y su
  mantenimiento son de vehículo premium, y ahí está su límite.
