descripcion: >-
  La Yamaha XMAX 300 es el scooter de gama alta de Yamaha para Colombia: 292 cc, 27,6 HP,
  29 Nm, ABS de doble canal, control de tracción y un baúl con espacio para dos cascos
  integrales por 34.700.000 pesos. Es la alternativa a un carro pequeño para quien hace
  trayectos urbanos largos y quiere comodidad sin renunciar a prestaciones. Es para ti si
  haces vías rápidas y necesitas capacidad de carga. No es para ti si tu presupuesto es
  limitado o si tu recorrido es de menos de 10 km diarios.
uso_diario: >-
  El motor de 292 cc entrega 27,6 HP y 29 Nm con una suavidad que es la marca de la casa:
  la transmisión CVT no tiene tirones y la respuesta es inmediata en cualquier rango de
  velocidad. Con 27 caballos, la XMAX mantiene 120 km/h sin esfuerzo y adelanta con
  autoridad, algo que ningún scooter de 150 puede hacer. El baúl bajo el asiento, con
  espacio para dos cascos integrales, es el argumento práctico más fuerte: convierte el
  scooter en un vehículo de carga ligera. La posición es erguida, con las piernas
  adelantadas y el torso protegido por un parabrisas que funciona de verdad. Pesa 181
  kilos, que se sienten al maniobrarlo parqueado, aunque en movimiento es muy estable. El
  ABS de doble canal y el control de tracción son equipamiento de moto grande. El consumo
  de 26 km/l con 13 litros da unos 340 km de autonomía.
