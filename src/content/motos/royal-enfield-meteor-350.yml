costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Royal Enfield.
  El SOAT y la técnico-mecánica van aparte. El costo es similar al de la Classic y
  superior al de una moto india de 200 cc: llantas de medida grande, aceite sintético y
  SOAT de categoría alta. El tanque de 15 litros, en cambio, reduce las paradas en viaje y
  eso también es una forma de ahorro.
comparativa: >-
  Frente a la Classic 350, la Meteor cuesta 2 millones menos y ofrece dos litros más de
  tanque, una posición más cómoda para viajar y 4 kilos menos de peso: para carretera es
  la mejor de las dos. Contra la Hunter 350, la Meteor cuesta 2 millones más y pierde
  agilidad urbana, aunque gana en confort y autonomía. Y si el objetivo es una crucero de
  mayor cilindraje, no hay nada en el mercado colombiano por debajo de los 30 millones.
faq:
  - pregunta: "¿Cuánto consume realmente la Meteor 350?"
    respuesta: >-
      El homologado es 32 km/l. En ciudad con tráfico el registro está entre 27 y 30; en
      carretera a 90 km/h sube a 35-37. Con 15 litros de tanque la autonomía práctica es de
      400 a 530 km, la mejor de la familia 350.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno natural. La posición de crucero y el quinto desarrollo largo permiten
      trayectos de 250 km sin fatiga. Mantiene 100 km/h con comodidad y llega a 115 en plano.
      Por encima de 110 el motor vibra, pero la moto no se siente insegura.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Pesa 191 kilos, cuesta 18 millones y su mantenimiento ronda el millón y medio al
      año. Es una moto de disfrute y viaje. Para trabajo, una 125 o 150 cuesta entre cuatro y
      cinco veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Meteor 350?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor de la Classic y la Hunter, porque el criterio es el
      cilindraje y no el tipo de moto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es amable por el asiento bajo de 765 mm y el motor de torque bajo, pero los 191 kilos
      son mucho para alguien sin experiencia en maniobras lentas. Es una buena primera moto
      para quien tenga contextura y aprenda a manejar el peso desde el primer día.
veredicto: >-
  La Meteor 350 es la forma más cómoda y económica de viajar con carácter clásico en
  Colombia: 15 litros de tanque, posición de crucero y un motor que no exige nada. Le
  falta potencia para dos personas con equipaje, pero para rodar a 90 km/h por el país
  sobra.
