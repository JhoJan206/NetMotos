descripcion: >-
  La Royal Enfield Meteor 350 es la crucero de entrada de la marca: 349 cc, 20,2 HP, 27 Nm
  y una posición de manejo relajada con el manubrio alto y las estriberas adelantadas, por
  17.990.000 pesos. Es la moto que compra quien quiere viajar sin prisa, con un tanque de
  15 litros y un asiento a 765 mm, el más bajo de la familia. Es para ti si haces
  trayectos largos a velocidad moderada y valoras comodidad por encima de prestaciones. No
  es para ti si tu ruta incluye trocha, si necesitas adelantar con frecuencia o si el peso
  de 191 kilos te parece excesivo para ciudad.
uso_diario: >-
  La Meteor es la más cómoda de las tres Royal de 350 para trayectos largos. La posición
  de crucero, con las piernas hacia adelante y el torso erguido, reparte el peso de forma
  distinta a la Classic y permite pasar dos horas en el asiento sin que la espalda
  proteste. El motor es el mismo de 349 cc con 27 Nm a 4.000 rpm, con un quinto desarrollo
  largo que permite cruceros de 100 km/h a bajas revoluciones, y el sonido de escape sigue
  siendo el gran argumento emocional. El tanque de 15 litros, con un consumo de 32 km/l,
  da casi 480 km de autonomía teórica, la mejor de la familia: en la práctica ronda los
  400. Los frenos con ABS de doble canal cumplen, y la suspensión trasera es algo más
  suave que la de la Hunter, aunque sigue siendo de recorrido corto. El peso de 191 kilos
  se siente en maniobras lentas y en parqueadero, no en movimiento.
