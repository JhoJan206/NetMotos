descripcion: >-
  La Honda XRE 300 Sahara es la única enduro de 300 cc que se vende nueva en Colombia, y
  eso explica buena parte de su precio: 33.500.000 pesos por una moto de 291 cc. Con 26
  HP, 259 mm de distancia al piso y un asiento a 855 mm, está hecha para quien de verdad
  necesita salir del asfalto y no quiere una moto de 250 con suspensión corta. Es para ti
  si vives en zona rural, haces trocha de verdad o quieres una moto de aventura ligera con
  respaldo Honda. No es para ti si mides menos de 1,75 m, si tu uso es urbano o si esperas
  una relación precio-potencia racional: por la mitad del dinero hay opciones que hacen el
  80 % del trabajo.
uso_diario: >-
  Los 259 mm al piso son el dato que define esta moto: permiten pasar troncos, zanjas y
  piedra suelta sin golpear el cárter, algo que ninguna otra moto de su cilindraje en
  Colombia ofrece. La suspensión de recorrido largo absorbe el terreno roto y el motor de
  291 cc con inyección PGM-FI entrega 27 Nm a 6.500 rpm, suficiente para subir en segunda
  por caminos empinados con carga. La caja de seis marchas permite además cruceros cómodos
  en carretera: mantiene 110 km/h sin esfuerzo. Los frenos son disco de 256 mm adelante y
  220 mm atrás, ambos con ABS de doble canal, un equipo serio para trocha donde el bloqueo
  de la rueda delantera es la causa más común de caída. El asiento a 855 mm es el punto de
  fricción para pilotos de estatura media: al detenerse en un semáforo hay que estirarse.
  Pesa 163 kilos, que se sienten en maniobras lentas pero no en movimiento. En carretera
  sostenida por encima de 110 km/h aparece una vibración perceptible que cansa en
  trayectos largos.
