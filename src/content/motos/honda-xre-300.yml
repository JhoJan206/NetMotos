costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra de taller autorizado
  Honda. El SOAT y la técnico-mecánica van aparte. Es la ficha más costosa de mantener de
  las doble propósito: llantas de doble propósito que se gastan rápido, cadena que sufre
  con el polvo y SOAT de categoría alta. Quien viene de una 150 debe presupuestar entre
  500.000 y 600.000 pesos más al año, sin contar gasolina.
comparativa: >-
  Frente a la Honda XR150L 2.0 ABS, la XRE 300 cuesta 22,5 millones más y ofrece 14,3
  caballos adicionales, ABS de doble canal y una capacidad de trocha que la 150 no tiene.
  Contra la Yamaha XTZ250, la Honda gana 0,6 caballos y 15 mm de altura al piso, y pierde
  en precio por unos cuatro millones. Y si el uso es más de trail ligero que de trabajo
  rural, la Hero Xpulse 200 ofrece ABS doble y 220 mm al piso por la mitad del dinero,
  aunque con 6,9 caballos menos.
faq:
  - pregunta: "¿Cuánto consume realmente la XRE 300?"
    respuesta: >-
      El homologado es 30 km/l. En trocha con primera y segunda constantes baja a 24-26; en
      carretera a 100 km/h sube a 32-34. Con 13 litros de tanque la autonomía práctica va de
      310 a 440 km, suficiente para una ruta rural de un día sin recargar.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 110 km/h. La sexta marcha y el motor de 291 cc permiten
      trayectos de 200 km sin fatiga. Por encima de 120 aparece vibración y el consumo sube,
      pero la moto no se siente insegura. Es una doble propósito con capacidad real de enlace.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zona rural con vías destapadas, sí, y es de las mejores herramientas del mercado. En
      ciudad pavimentada no tiene sentido: 855 mm de asiento, 163 kilos y llantas de tacos son
      una desventaja diaria. Para reparto urbano, una 125 cuesta un tercio de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la XRE 300?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Son 418.000 pesos más que una 200 cc, un costo fijo que conviene sumar
      antes de decidir el salto de cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha es tolerante; en ciudad es exigente. El asiento de 855 mm y los 163 kilos
      hacen que un novato de estatura media se sienta inseguro al detenerse. Como primera moto
      rural tiene sentido; como primera moto urbana, no.
veredicto: >-
  La XRE 300 no compite por precio ni por ficha técnica: compite por ser la única moto
  nueva que hace lo que hace. Si tu vida ocurre fuera del asfalto y puedes pagar 33
  millones, no hay alternativa directa; si tu vida ocurre en la ciudad, es un gasto
  difícil de justificar.
