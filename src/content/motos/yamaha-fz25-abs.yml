costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Yamaha. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento es el de una 250 japonesa:
  aceite sintético, llantas de 17 pulgadas y pastillas en las dos ruedas. Es predecible y
  no da sorpresas, pero cuesta casi el doble que el de una 150 india.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la FZ25 cuesta 2,1 millones más y ofrece 3,2 caballos
  menos y una marcha menos, aunque gana en acabado, suavidad y red de servicio. Contra la
  Yamaha MT-03, la FZ25 cuesta 16,6 millones menos y pierde 21 caballos y un motor
  bicilíndrico: son motos de categorías distintas. Y si el objetivo es una 250 con ABS y
  precio contenido, la Bajaj Dominar 250 ofrece 5,7 caballos más por 500.000 pesos
  adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la FZ25?"
    respuesta: >-
      El homologado es 33 km/l. En ciudad con tráfico el registro está entre 28 y 31; en
      carretera a 100 km/h sube a 35-37. Con 14 litros de tanque la autonomía práctica va de
      390 a 520 km, suficiente para una semana larga de uso mixto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 110 km/h y capacidad de llegar a 130 en plano. El motor no
      vibra, el asiento es amplio y el ABS de doble canal da confianza. Es una 250 que sirve
      para trayectos de 250 km sin drama.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve si el trabajo incluye recorridos largos, pero no es lo más rentable: consume 29
      km/l en ciudad y el mantenimiento ronda el millón y medio anual. Para reparto urbano
      intenso, una 125 cuesta la mitad de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la FZ25?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Son 418.000 pesos más que una 200, un salto que conviene tener claro
      al comparar ambas categorías.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las mejores 250 para empezar: entrega lineal, asiento accesible, peso
      contenido y ABS de doble canal. Los 20,9 caballos son suficientes para aprender sin
      sustos y para no aburrirse en dos años.
veredicto: >-
  La FZ25 no gana ningún comparativo de ficha técnica y aun así es una de las 250 más
  recomendables: motor suave, ABS doble, respaldo Yamaha y un comportamiento que no da
  sorpresas. Para quien compra moto cada cinco años, eso vale más que 3 caballos.
