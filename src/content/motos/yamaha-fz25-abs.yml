descripcion: >-
  La Yamaha FZ25 ABS es la naked de 250 de Yamaha para el mercado colombiano: motor Blue
  Core de 249 cc, 20,9 HP, 20,1 Nm, ABS de doble canal y un tanque de 14 litros por
  15.300.000 pesos. Es una moto de concepto conservador y ejecución muy sólida: no
  sorprende en ningún apartado, pero tampoco falla en ninguno. Es para ti si quieres una
  250 para uso diario y carretera, con respaldo de marca y mantenimiento previsible. No es
  para ti si buscas prestaciones: por el mismo dinero, una Bajaj NS200 entrega 3,2
  caballos más.
uso_diario: >-
  El motor Blue Core de 249 cc entrega 20,9 HP de forma muy lineal, con un torque de 20,1
  Nm a 6.000 rpm que permite rodar en cuarta por ciudad sin tirones y mantener 110 km/h en
  carretera con reserva. Es un motor que se siente más grande de lo que es: suave, sin
  vibraciones molestas y con una respuesta predecible en cualquier régimen. La caja de
  cinco marchas es la limitación frente a rivales de seis, y la quinta es larga, lo que
  deja un hueco entre cuarta y quinta que se nota en ascensos con carga. La posición es
  erguida y cómoda, con el asiento a 795 mm accesible para casi cualquier estatura. El
  doble disco con ABS de doble canal es un equipo poco común en el segmento y frena con
  autoridad. Pesa 148 kilos, un peso contenido que la hace ágil en tráfico. El consumo de
  33 km/l con 14 litros da unos 460 km de autonomía.
