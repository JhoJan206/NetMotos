costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Con 197,6 cc se queda por debajo del umbral de 200, así que
  paga la categoría intermedia del SOAT: 343.000 pesos en lugar de 761.000. Esa es una
  ventaja real de las "casi 200" que conviene tener presente.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la CR4 200 Pro cuesta 4,6 millones menos y entrega 7,3
  caballos menos, además de perder el ABS y la sexta marcha: la diferencia de precio se
  explica sola. Contra la Honda CB190R 2.0, la AKT gana 0,2 caballos y pierde ABS, acabado
  y red de servicio, aunque cuesta 4,3 millones menos. Y si el presupuesto aprieta pero
  quieres doble disco, la CR4 150 ofrece el mismo esquema de frenos por 1,6 millones
  menos.
faq:
  - pregunta: "¿Cuánto consume realmente la CR4 200 Pro?"
    respuesta: >-
      El homologado es 32 km/l. En ciudad con tráfico denso baja a 27-29; en carretera a 90
      km/h sube a 34-36. Con 13 litros de tanque la autonomía práctica está entre 350 y 450
      km, suficiente para una semana de uso mixto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es probablemente la AKT más adecuada para viajar después de la 250 R. Mantiene
      95-100 km/h con comodidad y llega a 115 en plano. La posición erguida y el asiento firme
      permiten trayectos de 150 km sin fatiga excesiva.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve si el trabajo incluye trayectos largos o vías rápidas. Para reparto urbano
      intenso, el consumo de 28 km/l y las llantas más costosas la hacen menos rentable que
      una 125. Es una moto de uso mixto, no una herramienta de reparto puro.
  - pregunta: "¿Cuánto cuesta el SOAT de la CR4 200 Pro?"
    respuesta: >-
      Con 197,6 cc se queda justo por debajo de los 200, así que paga la categoría de 100 a
      200 cc: alrededor de 343.000 pesos al año. Son 418.000 pesos menos que una 250, un
      ahorro anual que mucha gente no considera al comparar cilindrajes.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con matices. La potencia es manejable y la entrega lineal, así que un novato con
      criterio puede llevarla. Pero pesa 132 kilos y no tiene ABS, solo CBS: en una frenada de
      emergencia en mojado, el margen es menor que en una moto con ABS.
veredicto: >-
  La CR4 200 Pro es la puerta de entrada más barata al segmento de 200 cc con inyección.
  No tiene ABS ni el refinamiento de una Bajaj, pero por 8,6 millones ofrece prestaciones
  que hace cinco años costaban el doble.
