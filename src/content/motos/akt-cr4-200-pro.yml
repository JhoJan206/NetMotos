descripcion: >-
  La AKT CR4 200 Pro es el techo de la familia CR4: 197,6 cc, 16,8 HP, inyección
  electrónica y frenos de disco con CBS por 8.590.000 pesos. Es la naked de 200 más barata
  del mercado colombiano y la única del catálogo AKT con inyección en ese cilindraje. Es
  para ti si quieres salir de la 150 sin pagar más de nueve millones y necesitas una moto
  para ciudad y carretera corta. No es para ti si quieres ABS —aquí solo hay CBS— ni si te
  importa la reventa: la marca sigue castigando ese rubro.
uso_diario: >-
  Los 16,8 HP cambian la conversación frente a las CR4 menores: en ciudad se puede rodar
  tranquilo en tercera, y en carretera mantiene 95-100 km/h con soltura. La inyección
  resuelve el arranque en frío y estabiliza el ralentí en altura, dos problemas clásicos
  de las 125 y 150 carburadas de la marca. La caja de cinco marchas es la limitación: la
  relación entre cuarta y quinta deja un hueco que se nota al adelantar en subida. Pesa
  132 kilos, lo que la hace 8 kilos más pesada que la CR4 150 y algo más torpe en
  maniobras de parqueadero. El asiento a 795 mm es cómodo y la posición erguida, buena
  para trayectos de una hora. Los frenos con CBS funcionan, pero a este peso y con estas
  prestaciones el ABS empieza a hacer falta. El consumo de 32 km/l con 13 litros de tanque
  da unos 400 km de autonomía, una cifra correcta.
