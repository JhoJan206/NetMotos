costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es más caro que el de un scooter de 125
  por tres razones: aceite sintético, refrigerante y llantas de mayor medida. A cambio, el
  intervalo de la correa CVT es más largo (20.000 km) y el motor refrigerado por líquido
  sufre menos desgaste térmico en tráfico.
comparativa: >-
  Frente a la Yamaha NMAX 155, la Jet Evo cuesta 4,2 millones menos y ofrece 1 caballo
  menos, pero iguala el ABS de doble canal y el control de tracción: es la alternativa de
  precio del segmento premium. Contra la AKT Dynamic RX Fi, la Jet Evo representa un salto
  de categoría completo: ABS, control de tracción, refrigeración líquida y un tanque del
  doble de tamaño. Y si el uso es sobre todo urbano y el presupuesto es limitado, la
  Dynamic Pro CBS hace el mismo trabajo por 4,5 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la Jet Evo?"
    respuesta: >-
      El homologado es 33 km/l. En ciudad con tráfico denso baja a 28-30; en vías rápidas a 80
      km/h sube a 36-38. Con 12,1 litros de tanque la autonomía práctica es de 340 a 460 km,
      la mejor del segmento de scooters de 150.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es el scooter que mejor lo hace por debajo de los 13 millones: mantiene 100 km/h y
      tiene autonomía para trayectos de 200 km. La posición erguida y la falta de parabrisas
      cansan después de una hora, pero la moto tiene capacidad real de vía rápida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve por agilidad y autonomía, pero es caro para reparto: 12,5 millones de inversión y
      un mantenimiento que supera los 900.000 pesos al año. Quien reparte con Jet Evo lo hace
      por comodidad y seguridad, no por rentabilidad. Para volumen, una 125 con cadena.
  - pregunta: "¿Cuánto cuesta el SOAT de la Jet Evo?"
    respuesta: >-
      Con 149,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es
      una ventaja frente a un scooter de 300 cc, que pagaría 761.000, y explica por qué las
      marcas siguen apostando por motores de 150.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es de las mejores opciones para empezar con seguridad: sin embrague, con ABS de doble
      canal y control de tracción que cubren los errores típicos del novato en mojado. El peso
      de 145 kilos es su única exigencia: hay que practicar maniobras lentas antes de meterse
      al tráfico.
veredicto: >-
  La Jet Evo es el scooter que demuestra que se puede tener seguridad de gama alta sin
  pagar precio de NMAX. Su única concesión frente a la generación anterior es el piso
  plano, y a cambio entrega ABS, control de tracción y autonomía real. Una de las compras
  más completas del mercado.
