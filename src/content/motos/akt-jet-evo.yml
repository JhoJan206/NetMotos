descripcion: >-
  La AKT Jet Evo es la apuesta de AKT por el scooter premium: 149,6 cc refrigerados por
  líquido, 14 HP, ABS de doble canal, control de tracción y un tanque de 12,1 litros por
  12.590.000 pesos. Es, en ficha técnica, el scooter más equipado del mercado colombiano
  por debajo de los 13 millones. Es para ti si quieres un scooter para todo uso, con
  seguridad activa real y autonomía de moto. No es para ti si necesitas piso plano —la Jet
  Evo perdió el túnel abierto de la generación anterior— o si 145 kilos te parecen
  demasiado para maniobrar en parqueadero.
uso_diario: >-
  El motor refrigerado por líquido es la diferencia de fondo frente a otros scooters de
  150: mantiene la temperatura estable en tráfico denso y no pierde rendimiento después de
  media hora de recorrido urbano. Con 14 HP, la Jet Evo mantiene 100 km/h sin esfuerzo y
  llega a 115 en plano, algo que ningún scooter de 125 puede hacer. El ABS de doble canal
  y el control de tracción son el argumento más serio: en pavimento mojado, sobre pintura
  vial o en una frenada de emergencia, la moto no bloquea ni se va de atrás. El tanque de
  12,1 litros da entre 350 y 400 km de autonomía, cifra de moto, no de scooter. La contra
  es el peso: 145 kilos se sienten al maniobrar en parqueadero y en pendientes a baja
  velocidad. El asiento a 775 mm es accesible y la posición cómoda. El baúl bajo el
  asiento acepta un casco integral en la mayoría de tallas.
