descripcion: >-
  La Bajaj Boxer 150X es una moto de trabajo con vocación destapada: 149,5 cc, 12 HP, caja
  de cuatro marchas, tanque de 13 litros y 175 mm de distancia al piso por 7.499.000
  pesos. Está diseñada para cargar y para aguantar, no para correr. Es para ti si la usas
  como herramienta en zona rural o periurbana, con bultos y vías en mal estado. No es para
  ti si haces carretera, si quieres frenos de disco o si esperas comodidad: aquí todo está
  calculado para durar.
uso_diario: >-
  La Boxer 150X tiene el torque más bajo del segmento: 13,25 Nm a solo 5.500 rpm, lo que
  significa que jala desde muy abajo y perdona los cambios mal hechos. Esa es la razón por
  la que es una moto de trabajo tan querida: con carga atrás y en camino destapado, se
  puede rodar casi todo el tiempo en segunda sin que el motor se queje. La caja de cuatro
  marchas es corta y la cuarta es prácticamente una sobremarcha: cómoda a 60-70 km/h,
  incómoda por encima de 80. Los 175 mm al piso y las llantas de perfil alto permiten
  pasar huecos y rieles sin golpear. El asiento a 780 mm es accesible. El indicador de
  marchas y el medidor de combustible son detalles poco comunes en motos de trabajo y muy
  útiles en el día a día. El punto negro son los frenos: tambor en las dos ruedas, sin
  ABS. Con carga y en bajada mojada, la distancia de frenado se alarga mucho.
