costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es barato en repuestos, pero el intervalo
  de aceite de 2.500 km implica más visitas al taller que una 125 moderna. Aun así, el
  costo total anual se mantiene bajo porque ningún repuesto supera los 200.000 pesos y
  todos se consiguen en tiendas de barrio.
comparativa: >-
  Frente a la Bajaj Boxer CT100, la 150X ofrece 3,8 caballos más, un tanque 4,5 litros
  mayor y capacidad de carga real, por 1,3 millones adicionales: es el salto lógico para
  trabajo pesado. Contra la AKT TTR 125, la Boxer gana en torque y en capacidad de carga,
  y pierde en altura al piso y en frenada. Y si lo que buscas es una moto de trabajo con
  freno de disco, la Bajaj CT 125 ofrece uno delantero por 600.000 pesos menos, aunque con
  menos cilindraje.
faq:
  - pregunta: "¿Cuánto consume realmente la Boxer 150X?"
    respuesta: >-
      El homologado es 45 km/l. En uso de trabajo con carga y vías destapadas baja a 35-38; en
      asfalto a 60 km/h sube a 48. Con 13 litros de tanque la autonomía práctica va de 450 a
      620 km, una de las mejores del segmento.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos sí. La cuarta marcha permite 70-75 km/h sin esfuerzo, pero por encima de
      80 el motor va al límite y la moto se siente liviana. Es una moto de trayectos rurales e
      intermunicipales cortos, no de autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Es su razón de existir. Aguanta carga, maltrato y caminos destapados, tiene indicador de
      marchas y medidor de combustible, y su torque permite salir cargada sin sufrir. Es una
      de las mejores herramientas de trabajo del mercado colombiano.
  - pregunta: "¿Cuánto cuesta el SOAT de la Boxer 150X?"
    respuesta: >-
      Con 149,5 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la técnico-mecánica. Es un costo fijo razonable para una moto de trabajo que puede
      facturar todos los días.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Para aprender en zona rural, sí: el torque bajo y la caja corta perdonan mucho. Para
      aprender en ciudad, no: los frenos de tambor, el peso con carga y la falta de ABS exigen
      experiencia. Como primera moto de trabajo, es una escuela dura pero efectiva.
veredicto: >-
  La Boxer 150X no es una moto para disfrutar: es una moto para producir. Su torque desde
  abajo, su tanque enorme y su tolerancia al maltrato la convierten en una herramienta que
  se paga sola. Los frenos de tambor son su deuda pendiente con la seguridad.
