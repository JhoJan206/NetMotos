descripcion: >-
  La Bajaj Pulsar NS125 es la versión de entrada de la familia NS: 124,6 cc, 12 HP, freno
  de disco delantero de 260 mm y una estética deportiva heredada de la NS200, por
  8.799.000 pesos. Es una moto que vende imagen antes que mecánica, y conviene decirlo
  claro: por ese precio, la Bajaj Discover 125 Sport ofrece inyección electrónica y cuesta
  1,8 millones menos. Es para ti si el diseño de la NS te importa de verdad y no quieres
  pagar la NS160. No es para ti si comparas ficha técnica con precio: aquí hay opciones
  más racionales en la misma marca.
uso_diario: >-
  El motor de 124,6 cc con carburador entrega 12 HP a 8.500 rpm, la misma cifra de la
  Discover pero sin inyección. Eso significa que en frío pide starter y unos segundos de
  calentamiento, y que en altura el ralentí puede volverse irregular. En marcha, la moto
  se siente ágil: 122 kilos y una caja de cinco marchas bien escalonada permiten moverse
  con soltura entre carros y mantener 85 km/h en carretera sin sufrir. La estética NS se
  traduce en una posición algo deportiva y un asiento a 785 mm que resulta cómodo para
  trayectos de 40 minutos. El disco delantero de 260 mm es más grande que el de muchas
  rivales y frena con contundencia; el tambor trasero sigue siendo el punto flojo. La
  suspensión es firme y estable en curva. El consumo de 48 km/l con 11 litros de tanque da
  unos 480 km de autonomía, una cifra muy buena.
