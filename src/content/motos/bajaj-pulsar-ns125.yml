costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es el típico de una 125 carburada, con
  aceite cada 3.000 km. Es barato, pero el precio de compra alto hace que el costo por
  kilómetro real sea peor que el de una Discover o una CT 125, que ofrecen inyección por
  menos dinero.
comparativa: >-
  Frente a la Bajaj Discover 125 Sport, la NS125 cuesta 1,8 millones más, tiene carburador
  en lugar de inyección y ofrece la misma potencia: la única ventaja es el diseño. Contra
  la TVS Raider 125, la Bajaj pierde inyección y doble disco por el mismo dinero. Y si el
  presupuesto llega a nueve millones, la Pulsar P150 ofrece 2,2 caballos más, inyección y
  ABS delantero por solo 200.000 pesos adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Pulsar NS125?"
    respuesta: >-
      El homologado es 48 km/l. En ciudad con tráfico el registro está entre 42 y 45; en
      carretera a 70 km/h sube a 50. Con 11 litros de tanque la autonomía práctica es de 460 a
      550 km, una de las mejores de su categoría.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos de 80 a 100 km a 80 km/h, sí. Con 12 HP tiene algo más de reserva que una 125
      básica, aunque el carburador y el asiento limitan los trayectos largos. No es una moto
      de viaje, pero tampoco se queda en el intento.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, pero no es la más rentable: cuesta 8,8 millones y el mantenimiento es de moto
      económica. Para reparto puro, una CT 125 o una Discover cuestan menos de comprar y de
      operar. La NS125 es más una moto de imagen que de trabajo.
  - pregunta: "¿Cuánto cuesta el SOAT de la NS125?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Sobre
      un precio de 8,8 millones, eso equivale al 3,9 % del valor, una proporción alta para una
      125 de entrada.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí en lo mecánico: es dócil, liviana y la potencia no asusta. Pero como primera moto es
      una compra poco eficiente: por menos dinero hay opciones con inyección, doble disco y
      mejor equipo. Un principiante debería mirar la Raider 125 antes.
veredicto: >-
  La NS125 vive de la familia NS: se ve como una moto grande y por eso vende. Pero en
  2026, una 125 carburada a 8,8 millones no se sostiene frente a rivales con inyección y
  doble disco por menos. Es una moto para quien compra con los ojos; no para quien compra
  con la calculadora.
