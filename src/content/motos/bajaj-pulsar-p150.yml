descripcion: >-
  La Bajaj Pulsar P150 es la reinterpretación moderna de la histórica Pulsar 150: motor de
  149,68 cc con inyección electrónica, 14,2 HP, ABS delantero de serie y un diseño
  alineado con las NS de nueva generación, por 8.999.000 pesos. Es una moto pensada para
  quien quiere una 150 equilibrada, con frenos serios y precio contenido. Es para ti si
  buscas una moto para todo uso, con algo más de motor que una 125 y sin llegar a los once
  millones. No es para ti si quieres doble disco o ABS de doble canal: aquí solo hay ABS
  delantero.
uso_diario: >-
  El motor de 149,68 cc entrega el 95 % del torque desde 3.500 rpm, según Bajaj, y en la
  práctica eso se traduce en una moto muy fácil de manejar: se puede rodar en cuarta por
  ciudad sin tirones y salir de un semáforo con carga sin esfuerzo. Los 14,2 HP permiten
  mantener 90 km/h en carretera y llegar a 105 en plano. La caja de cinco marchas está
  bien escalonada y la quinta es larga, lo que reduce revoluciones y consumo en vía
  abierta. Pesa 140 kilos, un peso medio que da estabilidad sin volverla torpe. El asiento
  a 790 mm y la posición erguida son cómodos para trayectos de una hora. El ABS delantero
  funciona bien, pero el disco trasero es de 200 mm sin ABS, un esquema que ya empieza a
  quedar corto frente a rivales con doble canal. El consumo de 40 km/l con 12 litros de
  tanque da unos 440 km de autonomía.
