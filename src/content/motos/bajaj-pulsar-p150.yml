costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Es más barata de mantener que la NS160 por llantas más
  económicas y menor desgaste, y más cara que una 125 por la medida de los neumáticos y el
  precio del aceite. Está en el punto medio del segmento.
comparativa: >-
  Frente a la Bajaj Pulsar N125 FI, la P150 cuesta 900.000 pesos más y ofrece 2,36
  caballos adicionales, ABS delantero y un motor de mayor cilindraje: es el salto lógico
  dentro de la marca. Contra la Honda CB190R 2.0, la Bajaj cuesta 3,9 millones menos y
  pierde 2,8 caballos y acabado, aunque gana en precio de mantenimiento. Y si el
  presupuesto lo permite, la Pulsar N160 Pro ofrece 1,8 caballos más y ABS de doble canal
  por dos millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Pulsar P150?"
    respuesta: >-
      El homologado es 40 km/l. En ciudad con tráfico el registro está entre 34 y 37; en
      carretera a 80 km/h sube a 43. Con 12 litros de tanque la autonomía práctica es de 410 a
      510 km, una cifra sólida para el cilindraje.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 90 km/h y capacidad de llegar a 105 en plano. Es una moto
      estable y bien plantada, apta para trayectos de 120 a 150 km. Por encima de 100 el motor
      va alto y el consumo sube, pero no se siente insegura.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y es una de las 150 más equilibradas para eso: el torque desde 3.500 rpm permite
      salir cargado sin esfuerzo y el consumo es razonable. Su límite es el mantenimiento,
      algo más caro que el de una 125 de trabajo.
  - pregunta: "¿Cuánto cuesta el SOAT de la Pulsar P150?"
    respuesta: >-
      Con 149,68 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es
      un costo fijo bajo para una moto de nueve millones, y una de las razones por las que el
      segmento 150 sigue siendo el más vendido del país.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las mejores opciones para dar el salto desde una 125. El torque bajo hace
      que la moto perdone los errores de cambio, el peso es manejable y el ABS delantero cubre
      la frenada más crítica. La posición erguida facilita el aprendizaje en tráfico.
veredicto: >-
  La P150 es la 150 que hace todo bien y nada espectacular: motor elástico, ABS delantero,
  precio contenido y mantenimiento razonable. En un segmento saturado, su virtud es no
  tener defectos graves.
