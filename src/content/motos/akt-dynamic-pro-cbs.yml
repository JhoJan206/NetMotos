costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Es el scooter más barato de mantener del catálogo AKT, pero
  hay un costo que no aparece en la tabla: el tanque de 5,5 litros obliga a visitar la
  bomba cada 200 km, y en tiempo de trabajo eso también cuesta.
comparativa: >-
  Frente a la AKT Flex 125, la Dynamic Pro ofrece inyección, baúl bajo el asiento y frenos
  CBS por 2,2 millones más, aunque pierde la posibilidad de usar ruedas grandes de 18
  pulgadas. Contra la Honda Navi, la AKT gana en precio y en capacidad de carga, y pierde
  en red de servicio y en valor de reventa. Y si puedes estirar el presupuesto, la Dynamic
  RX Fi ofrece 2,8 caballos más por 1,4 millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Dynamic Pro CBS?"
    respuesta: >-
      El homologado es 40 km/l. En ciudad con tráfico denso baja a 36-38; en vías rápidas a 60
      km/h sube a 43. Con 5,5 litros de tanque la autonomía práctica es de 190 a 235 km, una
      de las más bajas del segmento por el tamaño del tanque.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Poco. Con 9,2 HP y 108 kilos, a 80 km/h ya va al límite y el viento la mueve. Sirve para
      trayectos urbanos y periurbanos cortos; para carretera hace falta una 150 o más.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve para pedidos pequeños y trayectos cortos, gracias a la agilidad y al piso plano.
      Pero el baúl es reducido y el tanque pequeño obliga a tanquear seguido. Para volumen
      alto, una moto con cadena de 10 litros de tanque es más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la Dynamic Pro CBS?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Sobre
      un vehículo de 8 millones, eso equivale a más del 4 % de su valor anual, una proporción
      que conviene incluir en el presupuesto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es una de las opciones más fáciles: sin embrague, sin cambios, liviana y con una altura
      de asiento de 765 mm. El riesgo es que tanta facilidad lleva a subestimar la frenada; el
      tambor trasero y la ausencia de ABS exigen aprender a dosificar desde el primer día.
veredicto: >-
  La Dynamic Pro CBS cumple con lo que promete: moverse en ciudad con el mínimo esfuerzo y
  el mínimo costo. Es un scooter honesto para trayectos cortos, y su limitación no es la
  calidad sino el tamaño: 5,5 litros de tanque y un baúl pequeño definen su alcance.
