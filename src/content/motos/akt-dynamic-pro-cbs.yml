descripcion: >-
  La AKT Dynamic Pro CBS es el scooter de entrada de AKT: 124,6 cc, 9,2 HP, inyección
  electrónica, frenos CBS y un peso de solo 108 kilos por 8.090.000 pesos. Es un scooter
  pensado para trayectos urbanos cortos, con una propuesta muy concreta: comodidad
  automática al precio más bajo posible dentro de la marca. Es para ti si haces recorridos
  de menos de 15 km diarios y quieres la simplicidad de un CVT. No es para ti si ruedas en
  vías rápidas, si llevas parrillero con frecuencia o si necesitas espacio de carga.
uso_diario: >-
  Con 108 kilos es el vehículo más liviano de esta lista, y eso se siente: se mueve entre
  carros con una facilidad que ninguna moto de 130 kilos iguala, y se parquea en cualquier
  hueco. El motor de 124,6 cc entrega 9,2 HP, suficiente para ciudad y justo para vías
  rápidas: a 80 km/h ya va en su límite y con parrillero pierde bastante alegría. El
  arranque es por botón, sin pedal, y la inyección evita el clásico problema de arranque
  en frío. Los frenos CBS combinan delantero de disco de 190 mm y tambor trasero de 110
  mm: funcionan bien a baja velocidad, que es el uso previsto. El baúl bajo el asiento es
  pequeño, apenas para un casco abierto y poco más. La suspensión es blanda y absorbe bien
  los huecos, aunque con dos personas hace tope con facilidad. El consumo de 40 km/l con
  un tanque de 5,5 litros da unos 210 km: hay que tanquear seguido.
