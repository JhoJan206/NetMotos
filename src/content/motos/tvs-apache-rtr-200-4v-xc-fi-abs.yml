costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Con 197,75 cc se queda por debajo del umbral de 200 y paga
  la categoría intermedia: 343.000 pesos en lugar de 761.000. Esa es la gran ventaja
  fiscal de las "casi 200" y una de las razones por las que este cilindraje creció tanto
  en Colombia.
comparativa: >-
  Frente a la TVS Apache RTR 160 4V, la 200 cuesta 7,1 millones más y ofrece 4,23 caballos
  adicionales, ABS, inyección y modos de manejo: el salto es de categoría. Contra la Bajaj
  Pulsar NS200, la TVS cuesta 400.000 pesos menos y ofrece 3,9 caballos menos, aunque gana
  en modos de manejo y en equipamiento digital. Y si el presupuesto llega a 16 millones,
  la Bajaj Pulsar NS400Z ofrece 19 caballos más por cinco millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la RTR 200 4V?"
    respuesta: >-
      El homologado es 34 km/l. En ciudad con tráfico y modo Sport el registro está entre 28 y
      31; en carretera a 90 km/h sube a 36-38. Con 12 litros de tanque la autonomía práctica
      va de 340 a 460 km, dependiente del modo de manejo.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura: mantiene 105-110 km/h sin esfuerzo y llega a 125 en plano. La posición
      deportiva cansa después de dos horas, pero la moto tiene capacidad real de vía rápida y
      el ABS de doble canal da confianza.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, pero no es lo más rentable: consume 30 km/l en ciudad y el mantenimiento supera
      el millón anual. Para reparto intenso, una 125 cuesta la mitad de operar. Para trabajo
      mixto con recorridos largos, la RTR 200 da prestaciones que una 125 no tiene.
  - pregunta: "¿Cuánto cuesta el SOAT de la RTR 200 4V?"
    respuesta: >-
      Con 197,75 cc se queda por debajo de los 200, así que paga la categoría de 100 a 200 cc:
      alrededor de 343.000 pesos al año. Son 418.000 pesos menos que una 250, un ahorro anual
      que mucha gente no considera al comparar cilindrajes.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No es la mejor primera moto: 20,23 caballos y 152 kilos exigen criterio, y la posición
      deportiva no es la más amable para aprender. Los modos de manejo ayudan, sobre todo el
      de Lluvia, pero es una excelente segunda moto para quien ya domina una 150.
veredicto: >-
  La RTR 200 4V XC es la 200 con más tecnología por peso del mercado: tres modos de
  manejo, ABS doble y refrigeración por aceite por menos de trece millones. Su limitación
  es la red de servicio de TVS, no su ficha técnica.
