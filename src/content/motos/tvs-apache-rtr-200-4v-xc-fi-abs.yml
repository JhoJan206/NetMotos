descripcion: >-
  La TVS Apache RTR 200 4V XC FI ABS es una naked deportiva de 197,75 cc con inyección
  electrónica, 20,23 HP, ABS de doble canal y tres modos de manejo, por 12.799.999 pesos.
  Es una de las 200 mejor equipadas del mercado y la única de su rango con modos
  seleccionables. Es para ti si quieres prestaciones de 200 con un paquete tecnológico
  completo y no te importa la red de servicio. No es para ti si buscas la moto más barata
  de mantener: el mantenimiento de una 200 con ABS y modos de manejo no es el de una 125.
uso_diario: >-
  Los tres modos de manejo —Sport, Urbano y Lluvia— cambian la respuesta del acelerador de
  forma perceptible, y esa es una función que ninguna otra 200 ofrece en Colombia. En modo
  Sport la moto entrega los 20,23 HP con una respuesta inmediata y una caja de cinco
  marchas que invita a subir de vueltas; en Urbano suaviza la entrega y en Lluvia la
  limita para evitar pérdidas de tracción. La refrigeración por aceite, según TVS, reduce
  hasta 10 °C la temperatura del motor en tráfico, y en la práctica el ventilador entra
  menos que en motos de aire convencionales. Pesa 152 kilos, lo que da estabilidad en
  carretera pero exige algo de fuerza en maniobras lentas. La posición es deportiva, con
  el torso inclinado y las estriberas retrasadas, cómoda para trayectos de 45 minutos. El
  ABS de doble canal sobre discos de 270 y 240 mm frena con autoridad. El consumo de 34
  km/l con 12 litros de tanque da unos 400 km de autonomía.
