costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Honda. El
  SOAT y la técnico-mecánica van aparte. Es la ficha más barata de mantener del catálogo
  junto con la Crypton: zapatas en lugar de pastillas, llantas pequeñas y un motor
  sencillo. El único gasto extra frente a una moto con cadena es el mantenimiento del CVT,
  que en este cilindraje es económico.
comparativa: >-
  Frente a la AKT Flex 125, la Navi cuesta 3,2 millones más y ofrece 0,7 caballos menos,
  aunque gana en imagen, en red de servicio y en la simplicidad del CVT frente a la caja
  semiautomática. Contra la Yamaha Crypton Finn FI, la Honda cuesta 600.000 pesos menos y
  ofrece un caballo menos y un tanque mucho más pequeño, aunque gana en practicidad
  urbana. Y si el objetivo es una moto automática con más capacidad, la AKT Dynamic Pro
  CBS ofrece baúl y piso plano por menos dinero.
faq:
  - pregunta: "¿Cuánto consume realmente la Navi?"
    respuesta: >-
      El homologado es 55 km/l. En ciudad con tráfico y paradas constantes el registro está
      entre 48 y 52; en tramos planos se acerca a 57. Con 3,8 litros de tanque la autonomía
      práctica es de 180 a 215 km, lo que obliga a tanquear varias veces por semana.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Poco. A 60 km/h va cómoda y a 70 ya va al límite. Las ruedas pequeñas, el peso ligero y
      los frenos de tambor no están pensados para vías rápidas. Es una moto estrictamente
      urbana.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve para pedidos pequeños y trayectos cortos, sobre todo por la facilidad de manejo y
      el consumo. Pero el tanque de 3,8 litros y el baúl reducido la limitan. Para reparto de
      volumen, una moto con tanque de 10 litros es más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la Navi?"
    respuesta: >-
      Con 109 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 8,49 millones representa el 4 % del valor, una
      proporción que conviene incluir en el presupuesto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es probablemente la más fácil de aprender del mercado: sin embrague, sin cambios, 101
      kilos y un asiento de 765 mm. El riesgo es el opuesto al habitual: tanta facilidad lleva
      a subestimar la frenada, y los tambores sin ABS exigen distancia en mojado.
veredicto: >-
  La Navi es una moto de concepto inteligente: la simplicidad de un scooter con la postura
  de una moto. Su limitación no es la calidad sino el alcance: 3,8 litros de tanque y
  frenos de tambor la confinan a la ciudad y a trayectos cortos.
