descripcion: >-
  La Honda Navi es una moto con formato inclasificable: mezcla de scooter y moto pequeña,
  con 109 cc, 7,9 HP, transmisión automática CVT y un peso de 101 kilos por 8.490.000
  pesos. Es la moto más barata de Honda en Colombia y una de las más fáciles de manejar
  del mercado. Es para ti si quieres moverte en ciudad sin aprender a usar embrague ni
  cambios, y valoras la red de servicio Honda. No es para ti si haces carretera, si
  necesitas capacidad de carga o si esperas frenos modernos: aquí solo hay tambor.
uso_diario: >-
  La Navi es, ante todo, práctica. Con 101 kilos y 765 mm de asiento, cualquier persona
  puede moverla, parquearla y levantarla. La transmisión CVT elimina el embrague y los
  cambios, así que en tráfico denso solo hay que acelerar y frenar, lo que reduce la
  fatiga de forma notable. El motor de 109 cc con inyección PGM-FI entrega 7,9 HP,
  suficiente para ciudad y justo para vías rápidas: a 70 km/h ya va en su límite. El
  consumo de 55 km/l es de los mejores del mercado, pero el tanque de 3,8 litros obliga a
  tanquear cada 180-200 km. Los frenos de tambor en las dos ruedas, sin ABS, son el punto
  más criticado: en pavimento mojado la distancia de frenado se alarga. El baúl bajo el
  asiento es reducido y el espacio para el pasajero, mínimo.
