costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El doble disco encarece el mantenimiento frente a una moto
  con tambor trasero, pero la diferencia anual ronda los 40.000 pesos. El riesgo real no
  es el costo sino la disponibilidad: fuera de las ciudades principales, un repuesto
  específico de TVS puede tardar varios días.
comparativa: >-
  Frente a la Bajaj Pulsar P150, la Apache cuesta 3,3 millones menos y ofrece 1,8 caballos
  y doble disco, aunque pierde ABS y red de servicio. Contra la Honda CB190R 2.0, la TVS
  cuesta 7,1 millones menos y ofrece 1 caballo menos, sin ABS: la diferencia de precio es
  enorme para la diferencia de prestaciones. Y si el presupuesto lo permite, la Apache RTR
  200 4V ofrece 4,2 caballos más, ABS y modos de manejo por 7,1 millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la RTR 160 4V?"
    respuesta: >-
      El homologado es 42 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      35 y 38; en carretera a 85 km/h sube a 44-46. Con 10 litros de tanque la autonomía
      práctica va de 350 a 460 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 100 km/h y capacidad de llegar a 115. Es una 160 con
      prestaciones suficientes para trayectos de 150 km. Por encima de 105 el motor va alto y
      el consumo sube, pero la moto se mantiene estable.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve por precio y por frenos, pero la red de servicio es el factor decisivo: si
      trabajas en una ciudad intermedia sin concesionario TVS, un repuesto puede dejarte
      parado. Para reparto de alto volumen, conviene verificar primero dónde hay taller
      autorizado.
  - pregunta: "¿Cuánto cuesta el SOAT de la RTR 160?"
    respuesta: >-
      Con 159,7 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la técnico-mecánica. Sobre una moto de 5,69 millones, el SOAT representa el 6 % del
      valor, una proporción alta que conviene presupuestar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, sobre todo por los frenos: el doble disco perdona errores que en una moto con tambor
      trasero terminan en caída. La posición deportiva y las 16 caballos invitan a acelerar,
      así que conviene respetar los primeros meses de aprendizaje.
veredicto: >-
  La RTR 160 4V es una de las compras más inteligentes del segmento por ficha técnica: 16
  caballos y doble disco por 5,69 millones no los ofrece nadie más. Su punto débil no es
  la moto, es la posventa de TVS en Colombia.
