descripcion: >-
  La TVS Apache RTR 160 4V es una de las 160 con mejor relación precio-equipo del mercado:
  16 HP, doble disco, 136 kilos y una parte ciclo derivada de la RTR 200, por 5.690.000
  pesos. Ese precio es el dato más llamativo de la ficha y también el que explica su éxito
  entre quienes quieren prestaciones sin gastar diez millones. Es para ti si buscas una
  moto deportiva para ciudad y carretera corta con frenos serios. No es para ti si te
  preocupa la red de servicio: TVS tiene menos concesionarios en Colombia que Honda,
  Yamaha o Bajaj, y eso es una limitación real.
uso_diario: >-
  El motor de 159,7 cc entrega 16 HP con una respuesta viva que se siente desde las 5.000
  rpm y se mantiene hasta el corte, con una caja de cinco marchas bien escalonada que
  permite aprovecharlo en ciudad y en carretera. Con 136 kilos, la moto es ágil entre
  carros y estable en curva, y el doble disco —270 mm adelante y 220 mm atrás— da una
  frenada consistente, muy por encima de lo que se espera en este rango de precio. La
  posición es deportiva, con el torso algo inclinado y las estriberas centradas, cómoda
  para trayectos de 45 minutos. El asiento a 800 mm es accesible y la suspensión es firme,
  estable en curva y algo seca en vías rotas. En carretera mantiene 100 km/h con comodidad
  y llega a 115 en plano. El consumo de 42 km/l con 10 litros de tanque da unos 420 km de
  autonomía, correcto. El punto flojo es el acabado: algunos plásticos y tornillería se
  sienten por debajo de una japonesa.
