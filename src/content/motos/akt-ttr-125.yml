costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. Esta moto cuesta más de mantener que una 125 de calle
  por una razón concreta: las llantas de tacos se gastan más rápido y el kit de arrastre
  sufre mucho con polvo y barro, así que su intervalo real se acorta. Es el precio de
  tener tracción fuera del asfalto.
comparativa: >-
  Frente a la AKT NKD 125, la TTR comparte motor pero cambia por completo el carácter:
  gana 100 mm de altura al piso, suspensión más larga y llantas de tacos, y pierde
  comodidad y estabilidad en asfalto. Contra la Honda XR150L 2.0 ABS, la diferencia está
  en el freno: la Honda ofrece ABS delantero y una red de servicio más amplia, a cambio de
  unos 3,5 millones más. Y si el uso es más de trabajo pesado que de trocha, la Bajaj
  Boxer 150X es la alternativa directa.
faq:
  - pregunta: "¿Cuánto consume realmente la TTR 125?"
    respuesta: >-
      El dato de ficha es 45 km/l. En destapado con pendientes y carga baja a 38-40; en
      asfalto a 70 km/h se acerca a 48. Con 11 litros de tanque la autonomía práctica está
      entre 420 y 500 km, suficiente para una semana de recorridos rurales.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, mejor que una 125 de calle en vías en mal estado, pero con límites. Sostiene 75-80
      km/h en plano y la posición alta da buena visibilidad. Las llantas de tacos y la altura
      generan algo de inestabilidad por encima de 85 km/h, así que no es una moto para
      autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zonas rurales o periurbanas con vías destapadas, sí, y es de las mejores opciones. En
      casco urbano pavimentado no tiene sentido: gastas llantas de tacos y pierdes agilidad.
      Para domicilios en ciudad hay opciones más eficientes y más baratas de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la TTR 125?"
    respuesta: >-
      Con 124,9 cc queda en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año,
      más la revisión técnico-mecánica. Es el mismo costo fijo que cualquier 125,
      independientemente de que sea doble propósito.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha sí, porque perdona mucho. En ciudad es exigente: la altura del asiento de 820
      mm y el peso del manubrio hacen que los primeros días cuesten. Un principiante urbano
      debería empezar en una 125 de calle y pasar a doble propósito después de tener
      confianza.
veredicto: >-
  La TTR 125 hace una sola cosa y la hace bien: llevar a alguien de un punto rural a otro
  sin destrozar la moto ni el cuerpo. Si tu ruta tiene tierra, piedra o barro, es una
  compra sensata; si tu ruta es asfalto puro, estarías pagando por capacidad que nunca vas
  a usar.
