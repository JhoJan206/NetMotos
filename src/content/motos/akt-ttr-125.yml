descripcion: >-
  La AKT TTR 125 es la doble propósito de entrada de AKT: 124,9 cc, 10,3 HP, 255 mm de
  distancia al piso y un asiento a 820 mm que la delata de inmediato como moto de trocha.
  Está hecha para el motociclista rural colombiano, el que sale de la vereda a la cabecera
  municipal por una vía destapada y no quiere sufrir cada hueco. Es para ti si vives o
  trabajas fuera del casco urbano y necesitas altura libre y suspensión larga. No es para
  ti si solo ruedas en ciudad: ahí pagas un precio alto en comodidad, altura y centro de
  gravedad sin aprovechar nada.
uso_diario: >-
  En destapado es donde la TTR 125 justifica cada peso. Los 255 mm al piso y las llantas
  de tacos de perfil alto permiten pasar rieles, piedra suelta y barro liviano sin golpear
  el cárter, y la suspensión de recorrido largo absorbe lo que una moto de calle sentiría
  como un golpe seco. En ciudad, en cambio, se nota torpe: el asiento alto obliga a
  estirarse al detenerse, el manubrio ancho complica filtrar entre carros y los tacos
  cantan en asfalto mojado. Las llantas de tacos son el punto crítico para uso urbano:
  frenan peor en seco y bastante peor en agua. El motor de 10,3 HP mueve bien la moto sola
  y con carga moderada, pero en subidas largas con parrillero hay que recurrir a primera.
  Los frenos CBS de serie son un plus real frente a otras doble propósito económicas,
  aunque el tambor trasero sigue siendo el eslabón débil en bajadas largas.
