costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Kawasaki. El
  SOAT y la técnico-mecánica van aparte. Es un mantenimiento de bicilíndrica: más aceite,
  dos bujías y llantas de medida grande. A cambio, los intervalos son largos y la moto
  está pensada para durar, así que el costo por kilómetro se diluye en el tiempo.
comparativa: >-
  Frente a la Suzuki V-Strom 250, la Versys cuesta 7 millones más y ofrece 15 caballos
  adicionales y un motor más revolucionado, aunque pierde torque a bajas vueltas. Contra
  la Kawasaki Z400, la Versys cuesta 3 millones menos y ofrece 6 caballos menos, con
  capacidad de trocha y autonomía muy superiores. Y si el objetivo es una adventure
  monocilíndrica más barata, la Honda XRE 300 cuesta 2,5 millones más y ofrece trocha
  real.
faq:
  - pregunta: "¿Cuánto consume realmente la Versys-X 300?"
    respuesta: >-
      El homologado es 27 km/l. En ciudad con tráfico el registro está entre 22 y 25; en
      carretera a 110 km/h sube a 29-31. Con 17 litros de tanque la autonomía práctica va de
      380 a 520 km, una de las mejores de su categoría.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno natural: mantiene 120 km/h sin vibraciones y llega a 150 en plano. El
      parabrisas ajustable y la posición erguida permiten trayectos de 300 km con comodidad.
      Es una turística liviana con apellido adventure.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Cuesta 31 millones, pesa 179 kilos y su mantenimiento supera los dos millones al
      año. Es una moto de viaje. Para trabajo, una 125 cuesta seis veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Versys-X 300?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 31 millones representa el 2,5 % del valor, así que
      no es el rubro que decide la compra.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con criterio, sí. La entrega es lineal, el peso es contenido y el ABS de doble canal
      ayuda. Pero 39 caballos y una altura de asiento de 815 mm exigen experiencia. Es una
      buena segunda moto para quien quiere empezar a viajar.
veredicto: >-
  La Versys-X 300 es la adventure de quien viaja por carretera con incursiones en
  destapado suave: motor suave, autonomía real y comodidad de turística. No es una enduro,
  y quien la compre entendiendo eso va a estar muy satisfecho.
