descripcion: >-
  La Kawasaki Versys-X 300 ABS es la adventure de entrada de Kawasaki: motor bicilíndrico
  de 296 cc, 39 HP, ABS de doble canal y un tanque de 17 litros por 30.990.000 pesos. Es
  una moto de turismo liviano con capacidad de trocha suave, pensada para quien quiere
  viajar por carretera y caminos destapados sin una moto pesada. Es para ti si haces
  trayectos mixtos y valoras autonomía y suavidad de motor. No es para ti si esperas una
  enduro: 178 mm al piso y una suspensión de asfalto no son para trocha exigente.
uso_diario: >-
  El bicilíndrico de 296 cc es la gran diferencia frente a las adventure monocilíndricas:
  entrega 39 HP con muy poca vibración y permite mantener 120 km/h en carretera sin
  fatiga. Eso sí, hay que subirlo de vueltas para encontrar el torque: 25 Nm a 10.000 rpm
  es una cifra alta en régimen, y quien viene de una monocilíndrica lo nota. El tanque de
  17 litros con un consumo de 27 km/l da más de 450 km de autonomía teórica, una cifra de
  turística real. La posición es erguida, con parabrisas ajustable y estriberas centradas,
  cómoda durante dos horas. El asiento a 815 mm exige estatura media. El ABS de doble
  canal frena sobre disco de 290 mm. Pesa 179 kilos, un peso contenido para una adventure.
  En trocha suave se defiende, pero los 178 mm al piso y la suspensión corta limitan el
  uso fuera del asfalto. La protección del parabrisas ajustable y la posición de las
  estriberas permiten hacer trayectos largos sin cargar las rodillas, algo que no ocurre en
  las adventure de asiento alto y estriberas retrasadas.
