descripcion: >-
  La TVS Raider 125 es la 125 con mejor equipo por peso en el segmento económico:
  inyección electrónica, frenos de disco en las dos ruedas, cinco marchas y un motor de
  11,5 HP que la pone por encima de casi todas sus rivales de cilindraje. Y lo hace por
  4.890.000 pesos, el mismo precio que una naked básica carburada. Es para ti si quieres
  lo mejor de la ficha técnica al menor precio posible. No es para ti si valoras la red de
  servicio por encima de todo: TVS tiene menos concesionarios en Colombia que Honda,
  Yamaha o AKT, y eso se siente cuando necesitas un repuesto específico.
uso_diario: >-
  El motor de la Raider tiene una personalidad más viva que la media del segmento: 11,5 HP
  a 7.500 rpm y una caja de cinco marchas bien escalonada permiten cruceros de 80 km/h sin
  que la moto se sienta forzada, algo raro en una 125. La inyección resuelve el arranque
  en frío y estabiliza el ralentí en altura. Pesa 122 kilos, así que mantiene agilidad
  urbana sin volverse nerviosa. El doble disco es el argumento más fuerte en seguridad: la
  frenada es más progresiva y consistente que la de cualquier rival con tambor trasero, y
  en lluvia se nota. El asiento a 780 mm es amable y la posición es ligeramente deportiva,
  con el torso algo inclinado hacia adelante; cómoda en trayectos de 40 minutos, menos en
  viajes de dos horas. El consumo declarado de 52 km/l se sostiene bien en uso real. Donde
  pierde puntos es en acabados: algunos plásticos y la tornillería se sienten por debajo
  de una Honda.
