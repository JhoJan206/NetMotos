costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El doble disco encarece el mantenimiento frente a una moto
  con tambor trasero —dos juegos de pastillas en lugar de unas zapatas—, pero esa
  diferencia de unos 40.000 pesos anuales se compensa con creces en seguridad y en
  desgaste de llanta. Es un costo pequeño por un beneficio grande.
comparativa: >-
  Frente a la AKT NKD 125, la Raider ofrece inyección, doble disco y 1 HP más por el mismo
  dinero: en ficha técnica no hay comparación. Contra la Honda CB125F, la diferencia es de
  marca y de red de servicio: la Honda cuesta 300.000 pesos más, tiene mejor acabado y
  llega a más talleres, pero pierde el disco trasero. Y frente a la Bajaj Pulsar N125 FI,
  la TVS gana en frenos y la Bajaj gana en equipamiento digital y en red de
  concesionarios.
faq:
  - pregunta: "¿Cuánto consume realmente la Raider 125?"
    respuesta: >-
      TVS declara 52 km/l. En uso urbano real el registro está entre 45 y 49 km/l; en
      carretera a 75 km/h llega a 55. Con 10 litros de tanque da entre 450 y 550 km de
      autonomía, una cifra sólida para una moto de este precio.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es una de las 125 que mejor lo hace gracias a sus 11,5 HP y a la quinta marcha
      larga. Mantiene 80 km/h sin esfuerzo y llega a 95 en plano. No es una moto de viaje,
      pero para trayectos intermedios de 100 a 150 km cumple sin sufrir.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y con ventajas sobre las 125 básicas: la inyección reduce el mantenimiento y el
      doble disco agrega margen de seguridad en tráfico. Su punto débil es la red de servicio:
      si trabajas en una ciudad intermedia, conviene verificar primero dónde hay taller
      autorizado TVS.
  - pregunta: "¿Cuánto cuesta el SOAT de la Raider 125?"
    respuesta: >-
      Por sus 124,8 cc paga la tarifa de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la revisión técnico-mecánica. Es un costo fijo que conviene sumar al precio de lista,
      porque casi equivale a dos meses de gasolina de esta moto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Muy buena, aunque con algo más de carácter que una 125 básica. La entrega de potencia es
      progresiva y la moto es liviana, pero los 11,5 HP invitan a acelerar más de lo que un
      novato debería. El doble disco, eso sí, le da un margen de seguridad que casi ninguna
      rival ofrece en este precio.
veredicto: >-
  En relación equipo-precio, la Raider 125 es la referencia del segmento: inyección y
  doble disco por menos de cinco millones no lo ofrece nadie más. Su tarea pendiente no es
  la moto, es la red de posventa. Si tienes taller TVS cerca, es una compra difícil de
  discutir.
