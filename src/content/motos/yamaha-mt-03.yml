descripcion: >-
  La Yamaha MT-03 es la naked de 321 cc de Yamaha: motor bicilíndrico, 42 HP, 29,6 Nm,
  embrague antirrebote, conectividad Y-Connect y ABS de doble canal por 31.900.000 pesos.
  Es el escalón natural entre una 250 y una 600, y una de las naked más equilibradas del
  mercado. Es para ti si quieres una moto para todo uso con prestaciones reales y
  refinamiento japonés. No es para ti si tu prioridad es el precio: por la mitad hay 300
  monocilíndricas que cumplen en ciudad.
uso_diario: >-
  El bicilíndrico de 321 cc entrega 42 HP de forma lineal, con un torque de 29,6 Nm a
  9.000 rpm que obliga a subir de vueltas para aprovecharlo, pero que recompensa con una
  respuesta suave y sin vibraciones hasta 130 km/h. Es un motor que se siente más grande
  de lo que es, y eso es exactamente lo que se busca en una naked de entrada a la gama
  media. El embrague antirrebote es un detalle que se agradece en tráfico y en bajadas
  rápidas, y la conectividad Y-Connect añade información de la moto en el celular. Pesa
  168 kilos, un peso contenido que la hace ágil en curva y manejable en ciudad. La
  posición es erguida, con el asiento a 780 mm accesible. El ABS de doble canal frena
  sobre disco de 298 mm adelante. El consumo de 27 km/l con 14 litros da unos 380 km de
  autonomía. El asiento del parrillero es pequeño y duro, poco práctico para dos personas.
