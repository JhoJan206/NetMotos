costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Yamaha. El
  SOAT y la técnico-mecánica van aparte. El bicilíndrico exige más aceite, dos bujías y
  llantas de medida deportiva, así que el mantenimiento es el de una moto de gama media,
  no el de una 250 india. Quien viene de una 200 debe presupuestar entre 700.000 y 800.000
  pesos más al año.
comparativa: >-
  Frente a la Yamaha FZ25, la MT-03 cuesta 16,6 millones más y ofrece 21,1 caballos
  adicionales, un motor bicilíndrico, embrague antirrebote y conectividad: es un salto de
  categoría completo. Contra la Kawasaki Z400, la Yamaha cuesta 2 millones menos y ofrece
  3 caballos menos, con un motor similar en concepto. Y si el presupuesto aprieta pero
  quieres una naked de 300, la BMW G 310 R ofrece 34 caballos por 4 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la MT-03?"
    respuesta: >-
      El homologado es 27 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      22 y 25; en carretera a 100 km/h sube a 29-31. Con 14 litros de tanque la autonomía
      práctica va de 310 a 430 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, y bien. Mantiene 130 km/h con el motor relajado y llega a 160 en plano. El
      bicilíndrico no vibra y el chasis es estable, así que trayectos de 300 km son viables.
      El asiento del parrillero, en cambio, no está hecho para viajes largos.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es lo más eficiente: consume 24 km/l en ciudad y su mantenimiento ronda el millón
      ochocientos mil anual. Es una moto de disfrute y de uso mixto. Para trabajo, una 125
      cuesta cuatro veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la MT-03?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 250 o una 900, porque el SOAT no escala por
      encima de ese umbral de cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con criterio, sí. La entrega es lineal y el embrague antirrebote perdona errores, pero
      42 caballos exigen respeto. Es una buena segunda moto para quien ya tiene experiencia en
      250, más que una primera moto.
veredicto: >-
  La MT-03 es la naked de entrada a la gama media que hace todo bien: motor suave,
  prestaciones suficientes, chasis ágil y equipo completo. Su precio la pone fuera del
  alcance de muchos, pero dentro de su categoría es una de las compras más equilibradas.
