descripcion: >-
  La Yamaha XTZ150 es la doble propósito de entrada de Yamaha: 150 cc, 13,1 HP, inyección
  electrónica, 205 mm de distancia al piso y 128 kilos por 14.500.000 pesos. Es una moto
  pensada para el trabajo rural y los caminos destapados, con un peso contenido que la
  hace fácil de manejar en trocha. Es para ti si vives en zona rural y necesitas una moto
  liviana y confiable para vías en mal estado. No es para ti si haces carretera o si
  necesitas frenos ABS: aquí el tambor trasero y la ausencia de ABS son la norma.
uso_diario: >-
  Con 128 kilos, la XTZ150 es la doble propósito más liviana de su categoría, y eso se
  siente en trocha: se levanta, se acomoda y se maneja con menos esfuerzo que una 200. Los
  205 mm de distancia al piso y la suspensión de recorrido largo absorben piedra y barro
  liviano sin golpear el cárter. El motor de 150 cc con inyección entrega 13,1 HP con un
  torque de 12,6 Nm que permite subir en segunda por caminos empinados sin exigir el
  embrague. En carretera mantiene 80-85 km/h con comodidad y llega a 95 en plano, aunque
  por encima de 85 el motor va alto y no hay resto. El freno delantero de disco de 220 mm
  funciona; el tambor trasero de 130 mm es el eslabón débil, sobre todo en bajadas largas
  con carga. El asiento a 800 mm es accesible y el consumo de 38 km/l con 10 litros da
  unos 380 km de autonomía.
