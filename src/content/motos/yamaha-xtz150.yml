costo_anual_cop: 880000
costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. Es más costosa de mantener que una 125 de calle por las
  llantas de doble propósito y el kit de arrastre reforzado, que sufre con polvo y barro.
  A cambio, los repuestos Yamaha se consiguen con facilidad y la moto tiene fama de
  aguantar maltrato.
comparativa: >-
  Frente a la Honda XR150L 2.0 ABS, la XTZ150 cuesta 3,5 millones menos y ofrece 1,4
  caballos más y 50 mm más de distancia al piso, aunque pierde ABS delantero y red de
  servicio. Contra la AKT TTR 125, la Yamaha cuesta 4,6 millones más y ofrece 2,8 caballos
  adicionales, inyección y más recorrido de suspensión. Y si el uso es de trabajo pesado
  con carga, la Bajaj Boxer 150X cuesta la mitad y tiene un tanque mayor.
faq:
  - pregunta: "¿Cuánto consume realmente la XTZ150?"
    respuesta: >-
      El homologado es 38 km/l. En trocha con primera y segunda constantes baja a 31-34; en
      asfalto a 70 km/h sube a 40-42. Con 10 litros de tanque la autonomía práctica va de 310
      a 420 km, algo corta para uso rural intensivo.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos, sí. Mantiene 80-85 km/h con comodidad y llega a 95 en plano, pero por
      encima de 85 el motor va alto y las llantas de tacos restan estabilidad. Es una moto de
      vías secundarias, no de autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zona rural, sí: es liviana, confiable y pasa por donde una moto de calle no pasa. El
      tanque de 10 litros y el consumo de 33 km/l en trocha obligan a tanquear seguido. En
      ciudad pavimentada no tiene sentido.
  - pregunta: "¿Cuánto cuesta el SOAT de la XTZ150?"
    respuesta: >-
      Con 150 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 125, lo que mantiene el costo fijo bajo para
      una moto de trabajo rural.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha sí, es de las más amables: liviana, baja de peso y con un motor que perdona.
      En carretera es exigente por la falta de ABS y el tambor trasero. Como primera moto
      rural, es una opción sensata y económica.
veredicto: >-
  La XTZ150 es una doble propósito honesta: liviana, confiable y con altura suficiente
  para el destapado colombiano. Le falta ABS y un tanque más grande, pero por 14,5
  millones cumple con lo que promete.
