costos_nota: >-
  Cifras estimadas para Colombia en 2026, con mano de obra incluida y un uso de
  12.000 km al año; los precios varían entre ciudades y concesionarios. El SOAT y la
  revisión técnico-mecánica van aparte del total porque se pagan una vez al año y no
  dependen del kilometraje. Lo que hace barata a la NKD no es que cada repuesto sea
  barato —que también— sino que ninguno es difícil de conseguir: en una carretera
  perdida encuentras aceite, cadena y bujía. Ese es el ahorro real.
comparativa: >-
  Contra la Bajaj CT 100, la NKD 125 gana en potencia y en freno de disco delantero,
  pero pierde en precio de entrada y en simplicidad mecánica. Frente a la Honda CB125F
  la diferencia es de acabado y de inyección: la Honda cuesta más, arranca más fina en
  frío y aguanta mejor el maltrato, mientras la AKT compensa con repuestos más baratos
  y una red de talleres que llega a municipios donde Honda no tiene concesionario.
  Si lo tuyo es el destapado, la AKT TTR 125 comparte motor y agrega recorrido de
  suspensión y llantas con más tacos. Y si quieres el mismo tamaño con más músculo,
  la AKT 250R o una 150 como la AKT CR4 150 son el paso natural.
faq:
  - pregunta: ¿Cuánto consume realmente la AKT NKD 125?
    respuesta: >-
      El dato homologado ronda los 50 km/l. En uso urbano real, con trancones y
      arranques constantes, lo normal es moverse entre 42 y 46 km/l; en carretera a
      70 km/h sostenidos se llega a 52-55 km/l. Con el tanque de 11 litros eso son
      entre 460 y 600 km por tanque, según el puño derecho.
  - pregunta: ¿Aguanta carretera?
    respuesta: >-
      Tramo corto sí, trayecto largo no. Puede mantener 85-90 km/h en plano, pero por
      encima de 80 el motor va revolucionado, el consumo sube y el viento mueve la
      moto. Sirve para ir de un pueblo a otro a 60-70 km/h; para viajar 400 km en un
      día conviene una 200 o una 250.
  - pregunta: ¿Sirve para domicilios y trabajo?
    respuesta: >-
      Es una de las mejores opciones del mercado para eso. Combustible barato,
      mantenimiento de bajo costo, autonomía de más de 500 km y repuestos en cualquier
      ciudad. Muchos domiciliarios la eligen justamente porque una caída o un daño se
      arregla el mismo día sin dejar de facturar.
  - pregunta: ¿Cuánto cuesta el SOAT de la NKD 125?
    respuesta: >-
      Por estar entre 100 y 200 cc, paga la tarifa intermedia: alrededor de 343.000
      pesos al año, más la revisión técnico-mecánica. Es una de las razones por las
      que una 125 sigue siendo más económica que una 250, que casi duplica el SOAT.
  - pregunta: ¿Es buena para principiantes?
    respuesta: >-
      Sí, es una de las más amigables. Pesa poco, el asiento es bajo, el motor perdona
      los errores de cambio, no tiene reacciones bruscas y la caída en una maniobra
      equivocada cuesta poco de reparar. La única advertencia es el freno de tambor
      trasero y la ausencia de ABS: hay que aprender a frenar con criterio desde el
      primer día.
veredicto: >-
  La NKD 125 no sorprende a nadie y ese es exactamente su mérito. Por menos de cinco
  millones entrega lo que el 80 % de los motociclistas colombianos necesita: bajo
  consumo, mantenimiento barato y repuestos en la esquina. Si buscas prestaciones,
  mira otra cosa; si buscas que la moto deje de ser un gasto, esta es la respuesta.
