descripcion: >-
  La AKT NKD 125 es la moto que compra quien necesita moverse todos los días y no
  quiere pensar en ella: arranca, gasta poco y se arregla en cualquier taller del país.
  Con 124 cc, 10,5 HP y 120 kilos, es una naked urbana pensada para trayectos cortos y
  para trabajar sobre ella. Es para ti si buscas el costo por kilómetro más bajo
  posible, si mides menos de 1,75 m o si es tu primera moto. No es para ti si haces
  carretera a diario, si viajas con parrillero por vías de montaña o si esperas frenos
  ABS: para eso hay que subir de cilindraje y de presupuesto.
uso_diario: >-
  En ciudad la NKD 125 se siente cómoda desde el primer semáforo. Pesa 120 kilos y el
  asiento queda a 775 mm, así que se maneja con las dos plantas en el piso para casi
  cualquier estatura, y se mueve entre el tráfico con un giro de manubrio. El motor es
  de carrera larga y bastante elástico: acepta ir en tercera a 2.000 rpm sin protestar,
  lo que en trancones de Bogotá o Medellín se traduce en menos cambios y menos
  esfuerzo. En carretera cambia la historia. Por encima de 80 km/h el motor va alto de
  revoluciones y la moto se siente liviana frente al viento y al paso de buses; se
  puede sostener 90 km/h en tramos planos, pero no es una moto para autopista. Con
  parrillero y pendiente larga toca bajar a segunda y acompañar con el embrague. Las
  llantas de 18 pulgadas de perfil alto ayudan mucho en huecos y vías destapadas, y la
  suspensión de doble amortiguador trasero, aunque básica, no hace tope con carga.
  El tanque de 11 litros es su mejor carta en uso intensivo: a 50 km/l da más de 500 km
  de autonomía, algo que un domiciliario agradece porque deja de pasar por la bomba
  cada dos días.
