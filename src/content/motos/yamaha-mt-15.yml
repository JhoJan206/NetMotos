descripcion: >-
  La Yamaha MT-15 es la versión naked de la R15: misma base mecánica de 155 cc con
  refrigeración líquida, 18,6 HP y caja de seis marchas, pero sin carenado y con un
  manubrio que cambia por completo la postura. Es la 150 más potente que se vende en
  Colombia y también una de las más caras: 15.500.000 pesos por una moto de ese
  cilindraje. Es para ti si quieres prestaciones de deportiva con una posición menos
  extrema y te importa el equipo (horquilla invertida, ABS, seis marchas). No es para ti
  si buscas economía, comodidad para dos o una moto para aprender: aquí cada caballo se
  paga.
uso_diario: >-
  El motor es lo mejor de la moto: 18,6 HP a 10.000 rpm en una moto de 138 kilos dan una
  relación peso-potencia que ninguna otra 150 del mercado iguala. Eso significa que
  adelanta con autoridad y mantiene 110 km/h sin sufrir, algo impensable en una FZ. La
  contraparte es que hay que subirlo de vueltas para aprovecharlo: por debajo de 6.000 rpm
  la moto es dócil, casi perezosa, y quien viene de una 200 va a sentir que le falta
  empuje abajo. La horquilla invertida y el chasis derivado de la R15 le dan una precisión
  en curva que se agradece en carretera de montaña. En ciudad la posición es la queja
  habitual: las estriberas están retrasadas y el torso va inclinado, así que en tráfico
  denso las muñecas y la espalda trabajan más de la cuenta. El asiento a 810 mm no es para
  todo el mundo, y el de pasajero es pequeño y duro. El ABS de doble canal y el consumo de
  40 km/l redondean un paquete coherente, aunque el tanque de 10 litros da apenas para
  350-380 km.
