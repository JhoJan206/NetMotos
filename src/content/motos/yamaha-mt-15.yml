costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Yamaha. El
  SOAT y la técnico-mecánica van aparte. Es una de las motos más caras de mantener por
  kilómetro en el segmento de 150-160 cc: aceite sintético, llantas deportivas de 17
  pulgadas y pastillas en las dos ruedas. Quien compra MT-15 debe asumir que el costo de
  operación se parece más al de una 250 que al de una 150.
comparativa: >-
  Frente a la Yamaha FZ 3.0, la MT-15 cuesta 3,7 millones más y entrega 5,6 caballos
  adicionales, seis marchas, horquilla invertida y ABS de doble canal: es otra moto, no
  una versión mejorada. Contra la TVS Apache RTR 160 4V, la Yamaha gana en refinamiento y
  en red de servicio, y pierde en precio de forma contundente. Y si el objetivo es la
  deportiva carenada, la Yamaha R15 ofrece el mismo motor con protección aerodinámica por
  600.000 pesos más.
faq:
  - pregunta: "¿Cuánto consume realmente la MT-15?"
    respuesta: >-
      El homologado es 40 km/l. En uso urbano tranquilo ronda 36-38; si se aprovecha el motor
      subiéndolo de vueltas baja a 30-33. En carretera a 90 km/h constante se acerca a 42. Es
      eficiente para su potencia, pero no es una moto económica.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es su terreno natural. Mantiene 110 km/h sin problema y tiene reserva para
      adelantar. El límite no es el motor sino la autonomía: con 10 litros de tanque hay que
      planear las paradas cada 300 km aproximadamente.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es la herramienta adecuada. El costo de mantenimiento, el precio de las llantas y la
      posición de manejo la hacen poco práctica para reparto. Existen opciones mucho más
      rentables para trabajo: una 125 con cadena cuesta la mitad de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la MT-15?"
    respuesta: >-
      Con 155 cc sigue en la categoría de 100 a 200 cc, así que paga alrededor de 343.000
      pesos al año. Es la única buena noticia del costo fijo: el cilindraje la mantiene fuera
      de la tarifa alta, aunque su precio de lista sea el de una moto superior.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No la recomendaría como primera moto. La posición deportiva, el asiento alto y un motor
      que entrega lo mejor arriba exigen experiencia. Un novato aprende más rápido y con menos
      riesgo en una 150 de posición neutra como la FZ 3.0.
veredicto: >-
  La MT-15 es la naked de 150 más divertida del mercado colombiano y se paga como tal. Si
  tu prioridad es el rendimiento y aceptas el costo de mantenerla, es una compra
  coherente; si buscas transporte económico con etiqueta deportiva, hay opciones que hacen
  lo mismo por siete millones menos.
