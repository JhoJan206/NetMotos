descripcion: >-
  La Yamaha MT-07 es una de las naked más vendidas del mundo y la razón es simple: motor
  bicilíndrico CP2 de 689 cc con 73,4 HP y 67 Nm, 184 kilos y un precio de 57.000.000 de
  pesos que, dentro de la gama media-alta, es competitivo. Es la moto que muchos
  motociclistas compran cuando quieren subir de cilindraje sin entrar en el territorio de
  las 1000. Es para ti si buscas torque abundante, uso diario y viajes de fin de semana.
  No es para ti si tu presupuesto está por debajo de los 50 millones o si buscas
  electrónica de última generación.
uso_diario: >-
  El motor CP2 es el corazón de esta moto: 67 Nm de torque disponibles desde 4.000 rpm
  significan que se puede rodar en sexta a 60 km/h y salir con fuerza sin bajar marcha, y
  que adelantar en carretera es cuestión de girar el puño. Es un motor con carácter, con
  un sonido grave característico y una entrega lineal que perdona mucho. Con 184 kilos, la
  MT-07 es notablemente liviana para su cilindraje, y eso se traduce en una moto ágil en
  curva y fácil de manejar en ciudad, algo que no ocurre con otras naked de 700. La
  posición es erguida, con el manubrio ancho y las estriberas centradas, cómoda para
  trayectos de dos horas. El ABS de doble canal frena sobre discos de 298 mm. La
  suspensión delantera no es ajustable, un detalle que se nota en conducción deportiva. El
  consumo de 22 km/l con 14 litros da unos 300 km de autonomía.
