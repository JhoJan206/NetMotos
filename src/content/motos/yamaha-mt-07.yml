costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Yamaha. El
  SOAT y la técnico-mecánica van aparte. Es una moto de 700 cc y el mantenimiento lo
  refleja: llantas de 17 pulgadas que cuestan cerca de 500.000 pesos, aceite sintético en
  cantidad de bicilíndrico y pastillas en las dos ruedas. Quien sube de una 300 debe
  duplicar su presupuesto de mantenimiento.
comparativa: >-
  Frente a la Yamaha MT-03, la MT-07 cuesta 25,1 millones más y ofrece 31,4 caballos
  adicionales y 37,4 Nm más de torque: es un salto de categoría real. Contra la Yamaha
  MT-09, la MT-07 cuesta 6 millones menos y pierde 44 caballos y el motor tricilíndrico,
  aunque gana en peso y en sencillez. Y si el objetivo es una naked de 400 con precio
  contenido, la Kawasaki Z400 ofrece 45 caballos por 34 millones.
faq:
  - pregunta: "¿Cuánto consume realmente la MT-07?"
    respuesta: >-
      El homologado es 22 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      17 y 20; en carretera a 110 km/h sube a 24-26. Con 14 litros de tanque la autonomía
      práctica va de 240 a 360 km, corta para una moto con vocación de viaje.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con mucha soltura. Mantiene 140 km/h con el motor relajado y tiene reserva hasta
      200. El CP2 no vibra y el chasis es estable. La autonomía y la falta de protección
      aerodinámica son sus límites, no la mecánica.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Consume 18 km/l en ciudad, pesa 184 kilos y su mantenimiento ronda los dos millones
      y medio al año. Es una moto de disfrute. Para trabajo, una 125 cuesta cinco veces menos
      de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la MT-07?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que paga una 250, así que el costo fijo no es el
      problema: el problema es el mantenimiento y el consumo.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 73,4 caballos y 67 Nm de torque desde muy abajo, la MT-07 es una moto que
      responde con contundencia y que puede sorprender a un novato. Es una excelente segunda o
      tercera moto para quien ya tiene experiencia.
veredicto: >-
  La MT-07 es probablemente la mejor relación precio-diversión de la gama media: motor con
  carácter, peso contenido y una posición que sirve para todo. No es la más equipada ni la
  más potente, pero sí una de las más equilibradas.
