descripcion: >-
  La Suzuki GSX-S150 ABS es una 150 con motor de refrigeración líquida, DOHC, cuatro
  válvulas y 18,9 HP, por 12.990.000 pesos. Es una de las pocas motos de su cilindraje en
  Colombia con esa arquitectura, y eso explica su precio: casi el doble que una 150
  convencional. Es para ti si quieres prestaciones de 200 con cilindraje de 150 y una moto
  ligera y ágil. No es para ti si buscas economía o si haces trayectos largos: su tanque
  de 11 litros y su posición deportiva no están pensados para viajar.
uso_diario: >-
  El motor de 147 cc con refrigeración líquida y DOHC entrega 18,9 HP a 10.500 rpm, una
  cifra que ninguna otra 150 de aire alcanza. Eso significa que hay que subirlo de vueltas
  para aprovecharlo: por debajo de 6.000 rpm es dócil, casi perezoso, y arriba se
  transforma en una moto que empuja con fuerza y llega a 120 km/h. La caja de seis marchas
  es clave para mantenerlo en la zona buena. Con 130 kilos, es una de las motos más
  livianas del segmento, y eso se traduce en agilidad extrema entre semáforos y en
  parqueadero. La posición es deportiva, con el torso inclinado y las estriberas
  retrasadas, cómoda para 30-40 minutos y exigente después. Los frenos de disco con ABS de
  doble canal son un equipo serio para el precio. El tanque de 11 litros con 38 km/l da
  unos 400 km de autonomía. El motor líquido, eso sí, cobra su precio en mantenimiento:
  exige revisar el nivel de refrigerante y usar aceite sintético, dos cosas que una 150 de
  aire no pide.
