costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Suzuki. El
  SOAT y la técnico-mecánica van aparte. Con 147 cc se mantiene en la categoría intermedia
  del SOAT, una ventaja real. Pero el mantenimiento es de motor líquido: aceite sintético,
  refrigerante y pastillas en las dos ruedas. Es más caro de operar que cualquier 150 de
  aire.
comparativa: >-
  Frente a la Yamaha FZ 3.0, la GSX-S150 cuesta 2,5 millones más y ofrece 5,9 caballos
  adicionales, refrigeración líquida y 7 kilos menos: en prestaciones es otra moto. Contra
  la Yamaha MT-15, la Suzuki cuesta 2,5 millones menos y pierde 0,3 caballos, aunque gana
  en peso y en precio de mantenimiento. Y si el objetivo es una 150 económica para uso
  diario, la Honda CB125F cuesta la mitad y hace el mismo recorrido.
faq:
  - pregunta: "¿Cuánto consume realmente la GSX-S150?"
    respuesta: >-
      El homologado es 38 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      32 y 35; en carretera a 90 km/h sube a 40-42. Con 11 litros de tanque la autonomía
      práctica va de 350 a 460 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura: mantiene 110 km/h y llega a 120 en plano. El motor líquido no pierde
      rendimiento después de una hora y el chasis es estable. La limitación es la autonomía y
      la posición deportiva, no la mecánica.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve por agilidad, pero no es lo más rentable: cuesta 13 millones, consume 34 km/l en
      ciudad y el mantenimiento supera el millón anual. Para reparto intenso, una 125 de
      trabajo cuesta la mitad de comprar y de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la GSX-S150?"
    respuesta: >-
      Con 147 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Es la misma tarifa de una 125, aunque la moto cueste 13 millones.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con matices. Es liviana y manejable, y el ABS de doble canal cubre los errores
      iniciales. Pero la posición deportiva y un motor que entrega lo mejor arriba exigen
      aprender a manejar las revoluciones. Una FZ 3.0 es más amable como primera moto.
veredicto: >-
  La GSX-S150 es la 150 más deportiva del mercado por menos de trece millones: motor
  líquido, DOHC y ABS de doble canal en un paquete de 130 kilos. Su problema es el
  contexto: por ese dinero hay 200 con más torque y por la mitad hay 125 que hacen lo
  mismo en ciudad.
