costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El costo de operación es el de una moto de 400 real:
  llantas anchas de 17 pulgadas, aceite sintético con intervalos de 5.000 km y SOAT de
  categoría alta. Aun así, sigue siendo más barata de mantener que una KTM o una Yamaha de
  cilindraje equivalente.
comparativa: >-
  Frente a la Bajaj Dominar 400, la NS400Z cuesta 1,1 millones menos y ofrece la misma
  potencia con 15 kilos menos, cuatro modos de manejo y una postura más ágil: es la misma
  plataforma con otro carácter. Contra la KTM 390 Duke, la Bajaj cuesta 11,5 millones
  menos y pierde en acabado, en peso y en componentes de suspensión. Y frente a la Yamaha
  MT-03, la NS400Z gana 8 caballos por 12,7 millones menos, aunque pierde el motor
  bicilíndrico.
faq:
  - pregunta: "¿Cuánto consume realmente la NS400Z?"
    respuesta: >-
      El homologado es 26 km/l. En ciudad con tráfico denso baja a 21-23; en carretera a 110
      km/h sube a 29-31. Con 14 litros de tanque la autonomía práctica va de 290 a 430 km, lo
      que en viaje exige planear las paradas.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su mejor escenario. Mantiene 130 km/h con el motor relajado y llega a 170. Los cuatro
      modos de manejo y el ABS adaptativo permiten afrontar lluvia o destapado liviano con
      margen. Para trayectos de 400 km es una moto capaz.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Consume 22 km/l en ciudad, pesa 178 kilos y su mantenimiento supera el millón y
      medio anual. Es una moto de disfrute. Para trabajo, una 125 o 150 cuesta entre tres y
      cuatro veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la NS400Z?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, y el principal costo fijo a
      considerar antes de subir a 400.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 39,4 caballos y 178 kilos, es una moto que castiga los errores. Los modos de
      manejo ayudan, pero no reemplazan la experiencia. Es una excelente segunda o tercera
      moto para quien ya domina una 200 o 250.
veredicto: >-
  La NS400Z es la moto con mejor relación precio-potencia del país, sin discusión: 39
  caballos por 18 millones no lo ofrece nadie. Sus concesiones son peso, acabado y
  consumo; sus virtudes, todo lo demás.
