descripcion: >-
  La Bajaj Pulsar NS400Z es la naked más potente que Bajaj vende en Colombia: 373 cc, 39,4
  HP, 35 Nm, cuatro modos de manejo, ABS adaptativo y conectividad Bluetooth por
  18.299.000 pesos. Es, en relación precio-potencia, la moto más agresiva del mercado
  colombiano. Es para ti si quieres prestaciones de 400 sin pagar precio de marca europea
  o japonesa, y aceptas un peso alto a cambio. No es para ti si buscas una moto ligera y
  ágil: con 178 kilos, la NS400Z se disfruta en carretera y sufre en tráfico lento.
uso_diario: >-
  Los 39,4 caballos no son una cifra de ficha: se sienten. La moto empuja con fuerza desde
  4.000 rpm y sigue tirando hasta el corte, con una entrega que en carretera de montaña
  permite adelantar en cualquier marcha. Los cuatro modos de manejo —Carretera, Deporte,
  Lluvia y Off-Road— cambian de verdad la respuesta del acelerador, y el modo Lluvia
  reduce la potencia de forma perceptible, lo que en pavimento mojado se agradece. El ABS
  adaptativo ajusta su intervención según el modo seleccionado. En ciudad, la moto se
  siente grande: 178 kilos y un asiento a 810 mm obligan a maniobras amplias. La posición
  es erguida y cómoda, más de naked que de deportiva. El chasis es firme y la suspensión
  invertida absorbe bien, aunque en vías rotas se siente seca. El consumo de 26 km/l con
  14 litros de tanque da unos 360 km de autonomía.
