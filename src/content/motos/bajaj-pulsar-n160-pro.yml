descripcion: >-
  La Bajaj Pulsar N160 Pro es la versión de equipamiento alto de la familia N160: 164,82
  cc, 16 HP, ABS de doble canal, suspensión invertida, embrague antirrebote y conectividad
  Bluetooth por 10.999.000 pesos. Es la naked de 160 con mejor relación equipo-precio del
  mercado y una alternativa directa a la NS160, con la que comparte motor pero no enfoque.
  Es para ti si quieres una 160 completa, con ABS real y equipo moderno, sin llegar a los
  once millones y medio. No es para ti si buscas carácter deportivo: la N160 Pro es más
  equilibrada y menos agresiva que la NS160.
uso_diario: >-
  El motor de 164,82 cc entrega 16 HP de forma muy lineal, con un empuje consistente desde
  4.000 rpm que permite rodar en tercera por ciudad sin tirones y mantener 100 km/h en
  carretera con reserva. El embrague antirrebote es el detalle que más se agradece en uso
  real: reduce el rebote de la rueda trasera al bajar marchas rápido, algo que en tráfico
  con frenadas bruscas se nota. La suspensión invertida mejora la precisión en curva y el
  ABS de doble canal actúa sobre disco de 260 mm adelante y 230 mm atrás, un equipo serio
  para el precio. Pesa 150 kilos, lo que la hace estable pero algo pesada en maniobras
  lentas. El asiento a 790 mm es accesible. El consumo de 38 km/l con 12 litros de tanque
  da unos 420 km de autonomía, correcto para 16 caballos.
