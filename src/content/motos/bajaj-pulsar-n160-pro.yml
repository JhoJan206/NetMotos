costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Con 164,82 cc sigue en la categoría de 100 a 200 cc, así
  que el SOAT es el mismo de una 125: 343.000 pesos. Esa es una ventaja enorme frente a
  una 200, que paga exactamente lo mismo pero con menos margen de crecimiento.
comparativa: >-
  Frente a la Bajaj Pulsar NS160 FI ABS, la N160 Pro cuesta un millón menos y ofrece el
  mismo motor, ABS y suspensión invertida, con un enfoque menos deportivo y una llanta
  trasera más angosta. Contra la Yamaha MT-15, la Bajaj cuesta 4,5 millones menos y pierde
  2,6 caballos y la sexta marcha, aunque gana en comodidad y en precio de mantenimiento. Y
  si el presupuesto aprieta, la Pulsar N125 FI ofrece 4,16 caballos menos por 2,9 millones
  menos.
faq:
  - pregunta: "¿Cuánto consume realmente la N160 Pro?"
    respuesta: >-
      El homologado es 38 km/l. En ciudad con tráfico el registro está entre 33 y 36; en
      carretera a 90 km/h sube a 41-43. Con 12 litros de tanque la autonomía práctica es de
      380 y 490 km según el uso.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura. Mantiene 100-110 km/h sin esfuerzo y tiene reserva para adelantar. El
      asiento firme y la posición erguida permiten trayectos de 150 km sin fatiga. Es una 160
      con capacidad real de vía rápida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, pero no es lo más eficiente: 35 km/l en ciudad y mantenimiento de 950.000 pesos
      al año. Para reparto intenso una 125 sigue siendo más rentable. Para trabajo mixto con
      recorridos largos, en cambio, es una buena herramienta.
  - pregunta: "¿Cuánto cuesta el SOAT de la N160 Pro?"
    respuesta: >-
      Con 164,82 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es
      la misma tarifa de una 125, lo que hace que subir de cilindraje dentro de ese rango no
      tenga costo fiscal adicional.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con criterio, sí. La entrega es lineal y el ABS de doble canal cubre los errores típicos
      del novato. El peso de 150 kilos y los 16 caballos exigen respeto, así que conviene
      practicar maniobras en parqueadero antes de salir al tráfico.
veredicto: >-
  La N160 Pro demuestra que no hay que gastar once millones y medio para tener ABS de
  doble canal, suspensión invertida y embrague antirrebote. Es la 160 más equilibrada del
  mercado y probablemente la compra más sensata del segmento.
