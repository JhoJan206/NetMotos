costos_nota: >-
  Cifras estimadas para 2026 con 12.000 km al año y mano de obra incluida. El SOAT sube de
  categoría frente a la CT100 y eso se siente en el bolsillo, pero el consumo de 55 km/l
  lo compensa con creces para quien rueda mucho. Los repuestos de la familia CT comparten
  buena parte de la cadena de distribución con otras Bajaj, así que se consiguen incluso
  en talleres pequeños de municipios intermedios.
comparativa: >-
  Frente a la CT100, la CT 125 cuesta unos 700.000 pesos más y ofrece 2,6 caballos
  adicionales, quinta marcha, disco delantero y tres litros más de tanque: es el salto más
  rentable de todo el segmento económico. Contra la Honda CB125F, la diferencia se
  invierte: la Honda tiene inyección y un acabado claramente superior, mientras la Bajaj
  apuesta por repuestos más baratos y una postura más de trabajo. Y si el uso es mixto con
  destapado, la AKT TTR 125 ofrece más recorrido de suspensión por un precio parecido.
faq:
  - pregunta: "¿Cuánto consume realmente la CT 125?"
    respuesta: >-
      El homologado es 55 km/l. En ciudad con tráfico real se mueve entre 45 y 50; en
      carretera plana a 70 km/h llega a 58-60. Es una de las motos más eficientes que se
      venden en el país, y con el tanque de 12 litros permite más de 500 km entre tanqueadas.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos intermedios sí, mucho mejor que la CT100. Sostiene 75-80 km/h sin esfuerzo y con
      pasajero se defiende en planos. En ascensos largos toca bajar a cuarta, y a 90 km/h el
      motor ya va alto. Es una moto para vías secundarias, no para autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y es de las mejores del mercado para eso. Combina el consumo más bajo del segmento
      con tanque grande, disco delantero y repuestos baratos. Muchos repartidores la eligen
      justamente porque el gasto semanal de gasolina es notablemente menor que el de una 150.
  - pregunta: "¿Cuánto cuesta el SOAT de la CT 125?"
    respuesta: >-
      Por sus 124,6 cc entra en la categoría de 100 a 200 cc, con una tarifa cercana a los
      343.000 pesos anuales, más la revisión técnico-mecánica. Es el punto donde la 125 deja
      de ser gratis frente a la 100: hay que sumar unos 90.000 pesos al año solo en SOAT.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Bastante. Es liviana, la entrega de potencia es lineal y la quinta marcha perdona los
      errores de cambio. El único punto de atención es la altura del asiento para pilotos muy
      bajos y la ausencia de ABS, que obliga a dosificar bien el freno delantero en mojado.
veredicto: >-
  Si el criterio es pesos por kilómetro, la CT 125 es difícil de superar: consume como una
  100, tiene freno de disco y un tanque que parece de otra categoría. No emociona, pero
  cumple con una eficiencia que se traduce en dinero real cada mes.
