descripcion: >-
  La Bajaj CT 125 es la hermana mayor de la CT100: mismo espíritu de trabajo, pero con
  124,6 cc, caja de cinco marchas y freno de disco delantero. Con 10,8 HP y un consumo
  declarado de 55 km/l, es probablemente la moto nueva más económica de mantener en
  Colombia por kilómetro recorrido. Es para ti si haces muchos kilómetros urbanos o
  intermunicipales cortos y quieres el menor gasto posible. No es para ti si buscas
  acabados cuidados, tablero moderno o una moto con la que presumir: aquí todo está
  pensado para durar, no para lucir.
uso_diario: >-
  La diferencia con la CT100 se siente de inmediato en la quinta marcha: permite cruceros
  de 70-75 km/h sin que el motor vaya sufriendo, lo que la vuelve mucho más usable en
  trayectos intermunicipales. En ciudad, la posición de manejo es erguida y el manubrio
  ancho da control, aunque el asiento a 785 mm ya pide algo más de estatura que su
  hermana. El tanque de 12 litros es el argumento más fuerte: a 55 km/l homologados, la
  autonomía teórica pasa de 600 km, y en la práctica ronda los 480-520 km, lo que
  significa tanquear una vez por semana o menos. La suspensión es firme y pensada para
  carga; sola se siente seca en vías rotas, pero con peso atrás trabaja mejor. El freno de
  disco delantero de 240 mm marca una diferencia real frente a la CT100 en frenadas de
  emergencia. En carretera sostiene 80 km/h sin drama, aunque con viento lateral se nota
  liviana.
