descripcion: >-
  La Bajaj Pulsar RS200 FI ABS es la única deportiva carenada de 200 cc con motor derivado
  de KTM que se vende en Colombia: 24,1 HP, inyección electrónica, seis marchas, ABS de
  doble canal y carenado completo por 15.999.000 pesos. Es una moto controvertida: ofrece
  prestaciones de 250 con precio de 200, pero paga el precio del carenado en peso y en
  comodidad. Es para ti si quieres una deportiva carenada real sin irte a los 30 millones.
  No es para ti si tu uso es urbano diario: la posición agachada y el calor del motor en
  tráfico la hacen incómoda.
uso_diario: >-
  El motor de 199,5 cc entrega 24,1 HP y empuja con fuerza desde 6.000 rpm, con una
  respuesta que en carretera de montaña se disfruta. La caja de seis marchas permite
  mantener el motor en la zona buena y la sexta da cruceros de 120 km/h sin forzar. Pero
  en ciudad la moto se pelea con su propia naturaleza: la posición agachada carga las
  muñecas, las estriberas retrasadas obligan a llevar las rodillas dobladas y el motor,
  refrigerado por aceite, calienta en tráfico lento. Pesa 165 kilos, que es mucho para el
  cilindraje, y se sienten en maniobras de parqueadero. Los frenos son excelentes: disco
  de 300 mm adelante con ABS de doble canal, y 230 mm atrás. El carenado protege bien del
  viento en autopista, que es donde la moto tiene sentido. El consumo de 32 km/l con 14
  litros da unos 400 km de autonomía.
