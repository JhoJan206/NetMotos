costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Hay un costo que no aparece en la tabla y que conviene
  advertir: cualquier caída implica reparar plásticos de carenado, y un juego completo de
  laterales supera los 600.000 pesos. Es la letra pequeña de las deportivas carenadas.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la RS200 cuesta 2,8 millones más y ofrece las mismas
  prestaciones con carenado y peor ergonomía: la diferencia es estética y aerodinámica.
  Contra la Yamaha R15, la Bajaj gana 5,7 caballos y pierde en refinamiento, acabado y
  reventa, por 4,4 millones menos. Y si el presupuesto llega a 17 millones, la Suzuki
  Gixxer SF 250 ofrece 2 caballos más y un motor más moderno.
faq:
  - pregunta: "¿Cuánto consume realmente la RS200?"
    respuesta: >-
      El homologado es 32 km/l. En ciudad con tráfico denso baja a 26-29; en carretera a 100
      km/h sube a 34-36. Con 14 litros de tanque la autonomía práctica va de 360 a 490 km,
      suficiente para un viaje de un día.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno natural. Mantiene 120 km/h con comodidad y llega a 140 en plano. El
      carenado protege del viento y el ABS de doble canal da confianza en frenadas fuertes.
      Para trayectos de 200 a 300 km es una moto competente.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. La posición agachada, el calor del motor en tráfico y el costo de reparar plásticos
      la hacen poco práctica para reparto. Es una moto de disfrute y de carretera, no una
      herramienta de trabajo.
  - pregunta: "¿Cuánto cuesta el SOAT de la RS200?"
    respuesta: >-
      Con 199,5 cc se queda por debajo de los 200, así que paga la categoría de 100 a 200 cc:
      alrededor de 343.000 pesos al año. Es una ventaja enorme frente a una 250, que pagaría
      761.000 por prestaciones similares.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. La posición deportiva, el peso de 165 kilos y los 24 caballos exigen experiencia.
      Además, una caída en una moto carenada es mucho más costosa que en una naked. Es una
      segunda o tercera moto, no una primera.
veredicto: >-
  La RS200 es la deportiva carenada más accesible con prestaciones reales. Su problema no
  es la mecánica sino el uso: en carretera es divertida y competente, en ciudad es
  incómoda y cara de reparar. Quien la compre para viajar no se arrepiente; quien la
  compre para el tráfico diario sí.
