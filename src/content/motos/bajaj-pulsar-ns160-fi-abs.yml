descripcion: >-
  La Bajaj Pulsar NS160 FI ABS es la versión deportiva de la familia 160 de Bajaj: 164,82
  cc, 16,75 HP, inyección electrónica, ABS de doble canal con tres modos, suspensión
  invertida y caja de cinco marchas, por 11.199.000 pesos. Es la naked de 160 más potente
  del mercado y una de las mejor equipadas. Es para ti si quieres prestaciones de 200 con
  precio de 160 y no te importa un peso algo elevado. No es para ti si buscas comodidad
  pura o si haces trayectos muy cortos: aquí el enfoque es claramente deportivo.
uso_diario: >-
  Los 16,75 HP a 8.500 rpm dan una respuesta más viva que la N160 Pro, con un empuje que
  se siente desde las 5.000 rpm y se mantiene hasta el corte. Eso permite adelantar con
  autoridad en carretera y mantener 110 km/h sin que el motor parezca forzado. La
  suspensión invertida aporta precisión en curva, y el ABS de doble canal con tres modos
  —carretera, lluvia y off-road— es un equipo que ninguna otra 160 ofrece en Colombia. En
  ciudad, la posición deportiva y el asiento a 795 mm resultan cómodos para trayectos de
  45 minutos. Pesa 152 kilos, lo que da estabilidad pero exige algo de fuerza en maniobras
  lentas. El motor calienta en tráfico denso y el ventilador entra seguido. El consumo de
  38 km/l con 12 litros de tanque da unos 420 km de autonomía.
