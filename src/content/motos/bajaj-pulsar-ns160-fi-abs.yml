costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Los 164,82 cc la mantienen en la categoría intermedia del
  SOAT, así que paga lo mismo que una 125. Es el gran argumento del segmento 160: casi
  prestaciones de 200 con costos fijos de 125.
comparativa: >-
  Frente a la Bajaj Pulsar N160 Pro, la NS160 cuesta 200.000 pesos más y ofrece 0,75
  caballos adicionales, ABS con tres modos y un enfoque más deportivo, aunque comparte
  casi todo el resto. Contra la Yamaha MT-15, la Bajaj cuesta 4,3 millones menos y pierde
  1,85 caballos y la sexta marcha, pero gana en comodidad y en costo de mantenimiento. Y
  si el presupuesto llega a trece millones, la NS200 ofrece 7,4 caballos más y sexta
  marcha por dos millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la NS160 FI ABS?"
    respuesta: >-
      El homologado es 38 km/l. En ciudad con tráfico denso baja a 32-35; en carretera a 90
      km/h sube a 41-43. Con 12 litros de tanque la autonomía práctica va de 380 a 490 km,
      suficiente para una semana de uso mixto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura: mantiene 110 km/h y tiene reserva hasta 125. Es una de las 160 con
      mejor capacidad de vía rápida, gracias a los 16,75 caballos y a la estabilidad del
      chasis. Para trayectos de 150 km es una moto válida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, pero no es lo más rentable: 33 km/l en ciudad y mantenimiento cercano al millón
      anual. Para reparto intenso, una 125 es más eficiente. Para trabajo mixto con recorridos
      largos y exigentes, la NS160 da prestaciones que una 125 no puede.
  - pregunta: "¿Cuánto cuesta el SOAT de la NS160?"
    respuesta: >-
      Con 164,82 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la técnico-mecánica. Es la misma tarifa que una 125, y una de las razones por las que el
      segmento 160 creció tanto en Colombia.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No es la mejor primera moto. Con 16,75 caballos y 152 kilos, exige criterio y respeto.
      El ABS de tres modos ayuda, pero la posición deportiva y la respuesta del motor invitan
      a correr. Es una excelente segunda moto.
veredicto: >-
  La NS160 FI ABS es la deportiva de 160 más completa del mercado: 16,75 caballos, ABS de
  tres modos y suspensión invertida por once millones. Su única competencia real es su
  propia hermana N160 Pro, que ofrece casi lo mismo por menos dinero y con más confort.
