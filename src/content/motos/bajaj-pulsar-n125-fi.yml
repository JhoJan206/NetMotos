descripcion: >-
  La Bajaj Pulsar N125 FI es la 125 más equipada de Bajaj: inyección electrónica, sistema
  Start-Stop, tablero digital con conectividad Bluetooth, frenos CBS y 198 mm de distancia
  al piso por 8.099.000 pesos. Es una 125 con pretensiones de moto moderna, y eso explica
  su precio, casi 2 millones por encima de una Discover o una CT 125. Es para ti si
  quieres tecnología y altura al piso para vías en mal estado, y no te importa pagar por
  ello. No es para ti si buscas la 125 más económica de operar: aquí pagas por equipo, no
  por economía.
uso_diario: >-
  Los 198 mm de distancia al piso son el dato más útil en Colombia: permiten pasar
  resaltos, huecos y rieles que una 125 convencional golpea. Eso, sumado a una suspensión
  algo más larga, la hace notablemente más tolerante en vías rotas. El motor de 11,84 HP
  con inyección entrega de forma lineal y el sistema Start-Stop apaga el motor en
  detenciones largas, lo que en tráfico denso reduce consumo y ruido (y sorprende la
  primera vez). Pesa 125 kilos, diez más que una NKD. El tablero digital con Bluetooth
  muestra notificaciones del celular, una función curiosa pero de utilidad discutible en
  movimiento. Los frenos son disco delantero de 240 mm con CBS y tambor trasero: el CBS
  ayuda, pero no reemplaza el ABS. El consumo de 45 km/l con 10 litros de tanque da unos
  420 km de autonomía.
