costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. La electrónica adicional —tablero, módulo de conectividad y
  Start-Stop— no encarece el mantenimiento rutinario, pero sí es un componente más que
  puede fallar con los años. Es el riesgo de comprar tecnología en un segmento económico.
comparativa: >-
  Frente a la Bajaj Discover 125 Sport, la N125 FI cuesta 1,1 millones más y ofrece
  Start-Stop, conectividad y 33 mm más de distancia al piso, aunque pierde 0,16 caballos.
  Contra la Honda CB125F, la Bajaj gana en equipo y altura, y pierde en acabado, reventa y
  red de servicio, por 2,9 millones menos. Y si el presupuesto lo permite, la Pulsar N160
  Pro ofrece ABS de doble canal y 4 caballos más por 2,9 millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Pulsar N125 FI?"
    respuesta: >-
      El homologado es 45 km/l. En ciudad con tráfico y Start-Stop activo el registro está
      entre 40 y 43; en carretera a 80 km/h sube a 48. Con 10 litros de tanque la autonomía
      práctica es de 400 a 480 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos de 80 a 100 km sin problema, a 80-85 km/h. Con 11,84 HP tiene más reserva que una
      125 básica, aunque el asiento y la ausencia de protección aerodinámica limitan los
      trayectos largos. No es una moto de viaje.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y los 198 mm al piso son una ventaja real en barrios con vías en mal estado. El
      precio de entrada y el mantenimiento son más altos que los de una CT 125, así que la
      rentabilidad depende de si aprovechas la altura y el equipo.
  - pregunta: "¿Cuánto cuesta el SOAT de la Pulsar N125 FI?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Sobre
      una moto de 8,1 millones, eso equivale al 4,2 % del valor, una proporción que conviene
      tener presente al comparar con opciones más baratas.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí: la entrega de potencia es dócil, el peso es contenido y el CBS ayuda en las
      frenadas. La conectividad y el tablero digital pueden distraer al principio, así que
      conviene configurarlos antes de salir a rodar y no tocarlos en movimiento.
veredicto: >-
  La Pulsar N125 FI es la 125 más "moderna" de Bajaj y se paga como tal. Si valoras altura
  al piso, conectividad y Start-Stop, tiene sentido; si solo quieres moverte barato, una
  CT 125 o una Discover hacen lo mismo por menos dinero.
