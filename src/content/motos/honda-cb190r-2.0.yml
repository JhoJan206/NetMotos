descripcion: >-
  La Honda CB190R 2.0 es la naked de 184 cc de Honda para el mercado colombiano: 17 HP,
  inyección PGM-FI, ABS delantero y freno de disco trasero por 12.790.000 pesos. Es la
  opción de quien quiere una moto de marca japonesa con algo más de motor que una 150, sin
  llegar a una 250. Es para ti si valoras fiabilidad, red de servicio y reventa por encima
  de la ficha técnica. No es para ti si buscas la mejor relación precio-potencia: una
  Bajaj NS200 ofrece 7 caballos más por 400.000 pesos adicionales.
uso_diario: >-
  El motor de 184,4 cc refrigerado por aire entrega 17 HP con una suavidad característica
  de Honda: no hay picos, no hay sorpresas, la potencia está disponible de forma lineal
  desde las 3.000 rpm. En ciudad eso se traduce en una moto fácil de manejar, que se puede
  llevar en cuarta sin tirones y que sale de un semáforo con carga sin esfuerzo. En
  carretera mantiene 100 km/h con comodidad y llega a 115 en plano. La posición es erguida
  y el asiento a 770 mm, el más bajo del segmento de 200, permite que pilotos de baja
  estatura apoyen bien los pies. Pesa 142 kilos, un peso contenido. El ABS delantero es un
  plus, aunque el freno trasero de disco no tiene ABS. En tráfico denso el motor
  refrigerado por aire calienta más que uno líquido, y el ventilador trabaja seguido. El
  consumo de 35 km/l con 12 litros da unos 420 km de autonomía. La caja de cinco marchas
  está bien escalonada para ciudad, con una quinta larga que baja las revoluciones a 80 km/h
  y ayuda al consumo, aunque en subida con parrillero obliga a bajar a cuarta.
