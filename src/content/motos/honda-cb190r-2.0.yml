costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Honda. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento es más caro que el de una 160
  india por llantas y repuestos de marca, pero la red Honda llega a más municipios que
  cualquier otra y el valor de reventa compensa parte de esa diferencia.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la Honda cuesta 400.000 pesos más y ofrece 7,1 caballos
  menos, sin sexta marcha: en ficha técnica pierde claramente. Contra la Yamaha FZ25, la
  CB190R cuesta 2,5 millones menos y pierde 3,9 caballos, aunque gana en asiento bajo y en
  agilidad urbana. Y si el objetivo es una 150 con inyección y buen respaldo, la Honda
  CB125F cuesta 7,6 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la CB190R?"
    respuesta: >-
      El homologado es 35 km/l. En ciudad con tráfico el registro está entre 30 y 33; en
      carretera a 90 km/h sube a 38. Con 12 litros de tanque la autonomía práctica es de 360 a
      460 km, correcta para el cilindraje.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 100 km/h y capacidad de llegar a 115. La posición erguida y el
      asiento permiten trayectos de 150 km sin fatiga. Por encima de 110 el motor refrigerado
      por aire pierde brío y el consumo sube.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, y la red de servicio Honda es un argumento fuerte para quien trabaja con la moto.
      El consumo de 32 km/l en ciudad es aceptable y el mantenimiento es predecible. Para
      reparto intenso, una 125 sigue siendo más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la CB190R?"
    respuesta: >-
      Con 184,4 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es la
      misma tarifa de una 125, una ventaja frente a las 250, que pagan 761.000 pesos.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las mejores primeras motos "grandes": asiento bajo de 770 mm, entrega muy
      lineal, peso contenido y ABS delantero. Los 17 caballos son suficientes para aprender
      sin sustos y para no aburrirse al año siguiente.
veredicto: >-
  La CB190R no gana comparativos de ficha y aun así vende: Honda ofrece algo que no
  aparece en la tabla, que es la tranquilidad de que la moto va a arrancar mañana y que
  hay un taller a 30 kilómetros. Quien paga por eso, no se equivoca.
