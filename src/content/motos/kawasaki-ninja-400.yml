descripcion: >-
  La Kawasaki Ninja 400 es la deportiva de acceso de referencia del mercado: motor
  bicilíndrico de 399 cc, 48,3 HP, 38 Nm, ABS de doble canal y 168 kilos por 35.990.000
  pesos. Es la moto que domina la categoría de 400 en ventas y en prestigio, y su precio
  lo refleja. Es para ti si quieres una deportiva carenada con prestaciones reales y valor
  de reventa sólido. No es para ti si buscas comodidad para dos personas o si tu
  presupuesto de mantenimiento es limitado.
uso_diario: >-
  El bicilíndrico de 399 cc entrega 48,3 HP con una linealidad que hace que la moto sea
  fácil de manejar pese a sus prestaciones: se puede rodar en ciudad a 60 km/h sin que el
  motor proteste y en carretera mantener 140 km/h con reserva hasta más de 180. La caja de
  seis marchas tiene recorridos cortos y un embrague suave, y la posición, aunque
  deportiva, es más tolerante que la de una supersport de 600: el torso va inclinado pero
  las estriberas no están tan retrasadas. El chasis es liviano y ágil, y con 168 kilos la
  moto se siente más pequeña de lo que es, lo que la hace muy fácil de llevar al límite en
  curvas. El ABS de doble canal frena sobre disco de 310 mm adelante. El carenado protege
  bien hasta 140 km/h. El asiento del parrillero es mínimo y el consumo de 26 km/l con 14
  litros da unos 360 km de autonomía.
