costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Kawasaki. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento de una bicilíndrica deportiva es
  más caro que el de una monocilíndrica equivalente: dos cilindros, más aceite, llantas
  deportivas de 17 pulgadas y pastillas de gama alta. A eso se suma el costo de los
  plásticos en caso de caída.
comparativa: >-
  Frente a la Kawasaki Z400, la Ninja cuesta 2 millones más y ofrece 3,3 caballos
  adicionales y carenado, aunque pierde la posición erguida y la comodidad diaria. Contra
  la KTM RC 390, la Ninja cuesta 5 millones más y ofrece 4,3 caballos adicionales y un
  motor bicilíndrico mucho más suave, aunque pierde el ABS en curva. Y si el objetivo es
  una deportiva de 400 con mejor relación precio-prestaciones, la KTM sigue siendo la
  referencia.
faq:
  - pregunta: "¿Cuánto consume realmente la Ninja 400?"
    respuesta: >-
      El homologado es 26 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      21 y 24; en carretera a 110 km/h sube a 28-30. Con 14 litros de tanque la autonomía
      práctica va de 290 a 420 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno: mantiene 140 km/h con el motor relajado y tiene reserva hasta más de 180.
      El carenado protege bien y el chasis es estable. La posición deportiva cansa después de
      dos horas, pero la moto está hecha para viajar rápido.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Consume 23 km/l en ciudad, cuesta 36 millones y su mantenimiento supera los dos
      millones al año. Es una moto de disfrute. Para trabajo, una 125 cuesta seis veces menos
      de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Ninja 400?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 250, así que en una moto de 36 millones
      representa apenas el 2 % del valor.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es una de las deportivas más amables para empezar en el mundo de las carenadas: entrega
      lineal, embrague suave y peso contenido. Aun así, 48 caballos exigen respeto. Es una
      buena segunda moto para quien ya tiene experiencia en 250.
veredicto: >-
  La Ninja 400 es la deportiva de 400 que mejor combina prestaciones, refinamiento y
  reventa. Su precio es alto y su mantenimiento no es barato, pero dentro de la categoría
  no tiene rival directo en equilibrio.
