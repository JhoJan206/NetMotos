descripcion: >-
  La Bajaj Pulsar NS200 FI ABS SC es la naked de 200 cc con mejor relación
  precio-prestaciones del mercado colombiano: 24,13 HP, inyección electrónica, seis
  marchas, doble disco con ABS y 13.199.000 pesos. Es la moto que elige quien quiere salir
  de la categoría 150 sin pagar precios de marca premium. Es para ti si buscas potencia
  real para carretera, con equipo completo y mantenimiento contenido. No es para ti si
  haces trayectos cortos de ciudad: 200 cc en tráfico denso consumen y calientan más de lo
  que aportan, y la posición deportiva cansa en recorridos de cinco minutos.
uso_diario: >-
  El motor de 199,5 cc con triple bujía DTS-i tiene una virtud poco común: empuja desde
  abajo y sigue empujando arriba. Eso significa que en ciudad se puede rodar en tercera
  sin tirones y en carretera mantener 110 km/h con reserva para adelantar. Las seis
  marchas están bien escalonadas y la quinta y sexta permiten cruceros cómodos a bajas
  revoluciones. La posición de manejo es la de una naked deportiva: estriberas retrasadas,
  torso inclinado y asiento a 807 mm, cómoda para una hora, exigente para tres. En tráfico
  lento el motor calienta y el ventilador trabaja seguido, algo normal en 200 cc
  refrigeradas por aceite. El chasis es estable y la horquilla telescópica convencional
  cumple, aunque no tiene la precisión de una invertida. El ABS de doble canal es un plus
  real en una moto de este precio. El consumo de 32 km/l es el costo de tener 24 caballos:
  con 12 litros de tanque la autonomía ronda los 350 km.
