costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Dos detalles importantes: como tiene 199,5 cc, sigue
  pagando la categoría de 100 a 200 cc en el SOAT, lo que la hace notablemente más barata
  de poseer que una 250. Y el motor de triple bujía pide tres bujías por cambio, un costo
  pequeño que muchos comparativos ignoran.
comparativa: >-
  Frente a la KTM 200 Duke, la NS200 cuesta 5,7 millones menos y entrega casi la misma
  potencia, aunque pierde 20 kilos de diferencia a favor de la austriaca, la horquilla
  invertida y la garantía extendida. Contra la Yamaha FZ25, la Bajaj gana 3,2 caballos y
  cuesta 2,1 millones menos, pero la Yamaha tiene mejor acabado y una red de servicio más
  amplia. Y si el presupuesto lo permite, la Pulsar NS400Z ofrece 39 caballos por cinco
  millones más.
faq:
  - pregunta: "¿Cuánto consume realmente la NS200?"
    respuesta: >-
      El homologado es 32 km/l. En ciudad con tráfico el registro está entre 26 y 29; en
      carretera a 90 km/h sube a 35-37. Con 12 litros de tanque la autonomía práctica va de
      320 a 420 km según el uso. Es el precio de tener 24 caballos.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es una de sus mejores virtudes. Mantiene 110-120 km/h sin esfuerzo y tiene reserva
      para adelantar con seguridad. El asiento y la posición empiezan a cansar después de dos
      horas, pero la moto en sí está hecha para viajar.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es la opción más eficiente: el consumo es alto y el mantenimiento cuesta más que el
      de una 125. Sirve para trabajo si valoras velocidad y capacidad de carga en trayectos
      largos, pero para reparto urbano intenso una 125 o 150 sale más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la NS200?"
    respuesta: >-
      Con 199,5 cc se queda justo por debajo del límite, así que sigue pagando la categoría de
      100 a 200 cc: alrededor de 343.000 pesos anuales. Es una ventaja enorme frente a una
      250, que paga 761.000 pesos, más del doble.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 24 caballos y 155 kilos, perdona menos que una 150. La entrega es lineal y
      predecible, así que un novato con criterio puede manejarla, pero lo sensato es aprender
      en una 125 o 150 y pasar a esta después de un año de experiencia.
veredicto: >-
  La NS200 es la moto que rompe la barrera entre "económica" y "deportiva": 24 caballos,
  seis marchas y ABS por 13 millones no los ofrece nadie más. Si tu uso incluye carretera
  y no te asusta un consumo de 28 km/l, es una de las compras más inteligentes del
  mercado.
