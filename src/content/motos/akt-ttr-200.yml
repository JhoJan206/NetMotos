costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. El motor carburado exige aceite cada 3.000 km en lugar
  de 4.000, y eso encarece el mantenimiento anual frente a la TT200 con inyección. Es el
  precio de una mecánica más simple y más fácil de reparar en cualquier taller de pueblo.
comparativa: >-
  Frente a la AKT TT200 ABS, la TTR gana la sexta marcha y 15 mm de altura al piso, y
  pierde inyección y ABS delantero, por 600.000 pesos menos. Contra la Yamaha XTZ250, la
  AKT cuesta 16,8 millones menos y ofrece 4 caballos menos, sin la red de servicio ni la
  reventa de la japonesa. Y si el uso es de trabajo pesado con carga, la Bajaj Boxer 150X
  ofrece un tanque mayor y un enfoque más utilitario por menos dinero.
faq:
  - pregunta: "¿Cuánto consume realmente la TTR 200?"
    respuesta: >-
      El homologado es 33 km/l. En trocha con pendientes y carga baja a 26-28; en carretera a
      85 km/h sube a 37. Con 11 litros de tanque la autonomía práctica va de 290 a 410 km, la
      más corta del segmento por el tanque pequeño.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, y la sexta marcha ayuda mucho: mantiene 95 km/h con menos vibración que su hermana
      TT200. Para trayectos de 150 km en vías secundarias es una moto válida, siempre que
      aceptes el comportamiento de las llantas de tacos en asfalto.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zona rural, sí: aguanta carga, maltrato y caminos en mal estado. El tanque de 11
      litros y el consumo de 28 km/l en trocha exigen tanquear con frecuencia. Para ciudad
      pavimentada, una 150 de calle es más eficiente y más barata.
  - pregunta: "¿Cuánto cuesta el SOAT de la TTR 200?"
    respuesta: >-
      Con 197 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 150, lo que hace que la TTR 200 tenga un
      costo fijo sorprendentemente bajo para su cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha, sí; en ciudad, no. El asiento de 840 mm es el más alto del catálogo y la moto
      pesa 129 kilos. Se necesita estatura y experiencia para manejarla con confianza en
      tráfico. Como primera moto rural, en cambio, es muy tolerante.
veredicto: >-
  La TTR 200 es la AKT para quien de verdad usa la trocha: seis marchas, doble disco y 225
  mm al piso por menos de diez millones. Le falta la inyección y el ABS de su hermana,
  pero en un camino rural la caja de seis velocidades vale más que cualquiera de las dos.
