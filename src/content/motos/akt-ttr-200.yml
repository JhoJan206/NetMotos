descripcion: >-
  La AKT TTR 200 es la doble propósito de 200 cc con caja de seis marchas: 197 cc, 16,5
  HP, 225 mm al piso y doble disco lobulado, por 9.190.000 pesos. Es la versión más
  campera del catálogo AKT y la única de la marca con seis velocidades en este cilindraje.
  Es para ti si haces trocha con frecuencia y necesitas relaciones de caja que te permitan
  subir despacio con carga sin sacrificar crucero. No es para ti si haces solo asfalto o
  si quieres inyección: aquí el motor es carburado.
uso_diario: >-
  La sexta marcha es la diferencia que más se siente frente a la TT200. En trocha empinada
  se puede subir en primera o segunda sin que el motor se quede, y en carretera la sexta
  permite cruceros de 95 km/h a menos revoluciones, con menos vibración y menos consumo.
  El motor carburado de 197 cc entrega 16,5 HP con un torque que aparece temprano, útil
  para salir cargado en terreno suelto. Los 225 mm de distancia al piso son suficientes
  para pasar troncos y zanjas moderadas, y el asiento a 840 mm es el más alto de esta
  lista: exige estatura. El doble disco lobulado es una rareza en el segmento y frena con
  contundencia, aunque no hay ABS. La suspensión convencional cumple bien en trocha, con
  la limitación de no ser invertida. En asfalto, las llantas de tacos y la altura hacen
  que la moto se sienta menos plantada que una naked.
