descripcion: >-
  La Yamaha MT-09 es la naked de referencia de la gama media-alta: motor tricilíndrico CP3
  de 890 cc, 117,4 HP, 93 Nm, quickshifter, modos de manejo y control de tracción por
  63.000.000 de pesos. Es una moto que combina potencia de superbike con una posición
  erguida y un peso contenido. Es para ti si ya tienes experiencia y quieres una naked con
  prestaciones serias y electrónica completa. No es para ti si buscas tu primera moto
  grande o si tu presupuesto de mantenimiento es limitado.
uso_diario: >-
  El tricilíndrico CP3 es un motor con personalidad propia: entrega 117,4 HP con un sonido
  que no se parece a ningún bicilíndrico ni a un cuatro en línea, y un torque de 93 Nm que
  permite adelantar en cualquier marcha sin pensarlo. La electrónica es completa: modos de
  manejo, control de tracción, quickshifter y una respuesta de acelerador que cambia según
  el modo seleccionado. Con 188 kilos, la MT-09 es sorprendentemente ágil para su
  potencia, gracias a un chasis bien logrado y a un centro de gravedad bajo. La posición
  es erguida y el manubrio ancho, aunque la suspensión de fábrica es firme y se siente en
  vías rotas. El ABS de doble canal frena sobre discos de 298 mm con pinzas radiales. El
  consumo de 20 km/l con 14 litros da apenas 280 km de autonomía, el punto débil de la
  moto.
