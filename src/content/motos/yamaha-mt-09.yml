costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Yamaha. El
  SOAT y la técnico-mecánica van aparte. Es la ficha más cara de mantener del catálogo,
  después de la R9: tres bujías de iridio, casi seis litros de aceite sintético, llantas
  deportivas que duran 8.000 km y pastillas de gama alta. Es el costo real de tener 117
  caballos.
comparativa: >-
  Frente a la Yamaha MT-07, la MT-09 cuesta 6 millones más y ofrece 44 caballos
  adicionales, un motor tricilíndrico, quickshifter y electrónica completa: es otro nivel
  de moto. Contra la Yamaha YZF-R9, la MT-09 cuesta 13 millones menos y ofrece 1,6
  caballos menos con la misma base mecánica, aunque pierde el carenado y las suspensiones
  de pista. Y si el objetivo es una naked de 400 para uso diario, la Kawasaki Z400 cuesta
  la mitad y hace el 80 % del trabajo urbano.
faq:
  - pregunta: "¿Cuánto consume realmente la MT-09?"
    respuesta: >-
      El homologado es 20 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      15 y 18; en carretera a 120 km/h sube a 22-24. Con 14 litros de tanque la autonomía
      práctica va de 210 a 330 km, la más corta del catálogo.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con una soltura que impresiona: mantiene 150 km/h sin esfuerzo y tiene reserva hasta
      más de 220. El problema no es la moto, es la autonomía y la falta de protección
      aerodinámica. Para trayectos de 250 km es viable; para más, hay que planear las paradas.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Consume 16 km/l en ciudad, pesa 188 kilos y su mantenimiento supera los tres
      millones al año. Es una moto de disfrute puro. Para trabajo, una 125 cuesta seis veces
      menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la MT-09?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 250, lo que en una moto de 63 millones
      representa menos del 2 % del valor: el SOAT no es el problema.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No, en absoluto. Con 117 caballos, 93 Nm y un motor que levanta la rueda delantera con
      facilidad, es una moto para pilotos con experiencia consolidada. La electrónica ayuda,
      pero no reemplaza el criterio.
veredicto: >-
  La MT-09 es una de las naked más divertidas que se pueden comprar y una de las más
  exigentes de mantener. Su motor tricilíndrico y su chasis justifican el precio; su
  autonomía y su costo de operación son la letra pequeña.
