descripcion: >-
  La AKT Dynamic RX Fi es el scooter de 150 cc de AKT: 12 HP, inyección electrónica,
  transmisión CVT, piso plano y un tanque de 6,5 litros. Con 9.490.000 pesos se ubica en
  la franja media del segmento de scooters automáticos. Es para ti si quieres comodidad
  urbana, algo más de motor que un 125 y no te importa que el freno trasero sea de tambor.
  No es para ti si buscas carretera, si necesitas ABS o si el diseño te importa tanto como
  la mecánica: aquí el equipamiento es correcto, no destacado.
uso_diario: >-
  El motor de 149,4 cc con inyección entrega 12 HP de forma muy suave, sin el tirón que a
  veces tienen los CVT económicos. En ciudad eso se traduce en salidas limpias de semáforo
  y una conducción relajada. El piso plano es el gran argumento práctico: se puede llevar
  una caja o un mercado entre los pies sin colgarlo del manubrio, algo que los scooters
  con túnel central no permiten. Pesa 118 kilos, el asiento a 770 mm permite apoyar bien
  los pies y la posición es cómoda y erguida. El baúl bajo el asiento acepta un casco
  abierto, no uno integral. La suspensión es firme atrás y algo seca en vías rotas. El
  punto débil es el freno trasero de tambor: en un scooter que rueda a 80 km/h en vía
  rápida, un disco trasero sería deseable. El consumo de 35 km/l con 6,5 litros da unos
  230 km de autonomía, lo que obliga a tanquear cada semana.
