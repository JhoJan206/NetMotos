costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento del CVT —correa y rodillos— es el costo
  que no existe en una moto con cadena y que muchos compradores de scooter desconocen. En
  este caso son unos 230.000 pesos cada 18.000 km, un gasto previsible que conviene
  presupuestar.
comparativa: >-
  Frente a la AKT Dynamic Pro CBS, la RX Fi ofrece 2,8 caballos más y un tanque un litro
  mayor por 1,4 millones adicionales: es el salto lógico dentro de la marca. Contra la
  Yamaha NMAX 155, la RX cuesta 7,3 millones menos y pierde ABS de doble canal, control de
  tracción y 3 caballos. Y si el presupuesto llega a 12,5 millones, la AKT Jet Evo ofrece
  ABS de doble canal, control de tracción y 14 caballos: es otro nivel.
faq:
  - pregunta: "¿Cuánto consume realmente la Dynamic RX Fi?"
    respuesta: >-
      El homologado es 35 km/l. En ciudad con tráfico y arranques constantes baja a 31-33; en
      vías rápidas a 70 km/h sube a 38. Con 6,5 litros de tanque la autonomía práctica es de
      200 a 250 km, lo que en uso intensivo significa tanquear dos veces por semana.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos sí: mantiene 90 km/h y llega a 105 en plano. Para trayectos de más de 80
      km, la posición y la falta de protección aerodinámica cansan, y el tanque pequeño obliga
      a parar. Es un scooter urbano con capacidad de vía rápida ocasional.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y el piso plano es una ventaja real para llevar pedidos. Sin embargo, el consumo y
      el tanque pequeño implican más tanqueadas, y el mantenimiento del CVT cuesta más que el
      de una moto con cadena. Para reparto intenso, una 125 con cadena es más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la Dynamic RX Fi?"
    respuesta: >-
      Con 149,4 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la revisión técnico-mecánica. Es el mismo valor que una moto de 125, aunque el scooter
      cueste casi 10 millones.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las formas más fáciles de empezar: no hay embrague ni cambios, el peso es
      contenido y la posición es cómoda. La advertencia es el tambor trasero: en lluvia hay
      que frenar antes y con más suavidad que en una moto con ABS.
veredicto: >-
  La Dynamic RX Fi es un scooter correcto, cómodo y bien motorizado para su precio. Su
  problema es la competencia interna: por 3 millones más, la Jet Evo ofrece ABS de doble
  canal y control de tracción, dos cosas que en un vehículo de dos ruedas no deberían ser
  opcionales.
