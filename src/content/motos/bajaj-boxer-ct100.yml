costos_nota: >-
  Estimación para Colombia en 2026 con 12.000 km al año y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte porque son pagos anuales fijos, no dependen del uso. Lo
  importante de la CT100 es que casi todo se consigue en tiendas de barrio: cadena, bujía,
  zapata y aceite existen en cualquier municipio, y un mantenimiento básico no pasa de
  60.000 pesos. Ese es el ahorro que ningún comparativo de fichas técnicas muestra.
comparativa: >-
  Contra la AKT NKD 125, la CT100 pierde 2 caballos y el freno de disco delantero, pero
  gana unos 1,3 millones en el precio de entrada y baja de categoría de SOAT, que es un
  ahorro anual real. Frente a la Honda CB125F, la diferencia es de tecnología: la Honda
  tiene inyección y mejor acabado, la Bajaj tiene repuestos más baratos y una tolerancia
  al maltrato que pocas motos igualan. Si necesitas un poco más de motor sin salir del
  segmento económico, la Bajaj CT 125 o la AKT CHR 125 son el siguiente escalón natural.
faq:
  - pregunta: "¿Cuánto consume realmente la Boxer CT100?"
    respuesta: >-
      El dato de ficha ronda los 45 km/l. En uso de trabajo urbano, con carga y arranques
      constantes, lo normal es 38 a 42 km/l; en carretera plana a 60 km/h se llega a 50. Con
      8,5 litros de tanque la autonomía práctica es de 330 a 380 km, suficiente para dos o
      tres días de domicilios sin tanquear.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos entre municipios, sí. Viajes largos, no. A 70 km/h va en su límite cómodo
      y cualquier subida la obliga a bajar de marcha. Sirve para ir al pueblo vecino por una
      vía secundaria; no sirve para una autopista ni para sostener 80 km/h durante una hora.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Es literalmente para eso. Su razón de existir es el reparto y el trabajo de carga.
      Aguanta peso, se arregla en cualquier taller, el mantenimiento es el más barato del
      mercado y el SOAT está en la categoría más baja. Por eso es la moto más vista en plazas
      de mercado y obras del país.
  - pregunta: "¿Cuánto cuesta el SOAT de la CT100?"
    respuesta: >-
      Al tener 100 cc exactos entra en la categoría de menos de 100 cc, la más económica:
      alrededor de 256.000 pesos al año. Es la mitad de lo que paga una moto de más de 200 cc,
      y eso se nota en el presupuesto de quien la usa para trabajar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, aunque con matices. Es liviana, baja y muy dócil, pero sus frenos de tambor y su
      falta de ABS obligan a aprender a frenar con anticipación. Si el principiante va a rodar
      en ciudad con lluvia, conviene una moto con disco delantero; si es para trocha y trabajo
      tranquilo, la CT100 perdona mucho.
veredicto: >-
  La CT100 no compite por diseño ni por tecnología: compite por cuenta de cobro. Si la
  pregunta es cuánto cuesta moverte y trabajar todos los días con el menor gasto posible,
  esta sigue siendo una de las respuestas más sólidas del mercado colombiano, incluso con
  una década de diseño encima.
