descripcion: >-
  La Bajaj Boxer CT100 es la moto de trabajo por definición en Colombia: 100 cc, 8,2 HP y
  112 kilos para cargar lo que sea por donde sea. Está pensada para quien la usa como
  herramienta — domicilios, mercado, herramienta de obra, vereda — y necesita que arranque
  todos los días sin pedir nada a cambio. Es para ti si tu prioridad es el costo por
  kilómetro y no te importa que la moto sea espartana. No es para ti si haces carretera,
  si viajas con parrillero con frecuencia o si vives en una ciudad con pendientes fuertes:
  con 8 caballos y caja de cuatro marchas, ahí se queda corta.
uso_diario: >-
  En plano y a poca velocidad es donde la CT100 se siente en casa. La primera y la segunda
  son cortísimas, pensadas para arrancar cargada, y la cuarta es tan larga que funciona
  casi como sobremarcha: en ciudad se maneja prácticamente entre segunda y tercera. El
  motor de 100 cc vibra, es cierto, y a 70 km/h ya va trabajando, pero no se queja. El
  asiento a 765 mm es el más bajo del segmento de trabajo, así que cualquier persona la
  domina desde el primer día. Donde brilla de verdad es en el destapado suave: la altura
  al piso de 165 mm y las llantas de perfil alto aguantan huecos que una moto de calle
  sufriría. Con parrillero y mercado en pendiente larga hay que ayudarse con primera y
  tener paciencia, porque el torque máximo llega a 5.000 rpm y arriba de ahí no hay mucho
  más. Los frenos de tambor en las dos ruedas exigen distancia de frenado; no son
  peligrosos, pero no perdonan el descuido en mojado.
