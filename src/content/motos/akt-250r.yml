descripcion: >-
  La AKT 250 R es la naked de mayor cilindraje del portafolio de AKT y, con 11.590.000
  pesos, una de las 250 más económicas del país. Entrega 20,8 HP, 19,6 Nm, inyección
  electrónica y ABS delantero de un canal en una moto de 145 kilos. Es para ti si quieres
  dar el salto a 250 con presupuesto contenido y no te importa que la marca no tenga el
  prestigio de Bajaj o Yamaha. No es para ti si te importa la reventa, si quieres ABS de
  doble canal o si esperas acabados de gama alta: aquí el dinero se gastó en el motor y en
  el ABS, no en los plásticos.
uso_diario: >-
  Los 20,8 HP mueven 145 kilos con soltura suficiente para ciudad y carretera: en tráfico
  se puede rodar en tercera sin tirones, y en vía abierta mantiene 100-110 km/h con
  reserva. La caja de cinco marchas es la limitación frente a rivales de seis: la última
  es larga y deja un hueco entre cuarta y quinta que se nota en ascensos. La posición de
  manejo es erguida, con manubrio relativamente alto, cómoda para trayectos de una hora.
  El asiento a 800 mm queda en el promedio del segmento. El ABS de un solo canal actúa
  sobre el disco delantero de 280 mm, que es lo que evita la mayoría de las caídas por
  frenada brusca; el trasero es disco sin ABS, suficiente pero sin asistencia. El motor
  refrigerado por aceite calienta en tráfico denso y el ventilador se activa seguido, algo
  normal en este cilindraje. El consumo de 28 km/l con tanque de 14 litros da unos 390 km
  de autonomía, una cifra correcta para 250.
