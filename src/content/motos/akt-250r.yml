costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El dato que más pesa es el salto de categoría del SOAT:
  pasar de 200 cc duplica ese costo fijo, de 343.000 a 761.000 pesos al año. Quien viene
  de una 200 debe tenerlo claro antes de subir de cilindraje, porque es dinero que se paga
  incluso si la moto no se mueve.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la AKT 250 R entrega 3 caballos menos, pierde la sexta
  marcha y cuesta 1,6 millones menos, pero paga el doble de SOAT. Contra la Yamaha FZ25,
  la diferencia es de marca y de acabado: la Yamaha cuesta 3,7 millones más y ofrece una
  red de servicio que la AKT no tiene. Y si lo que buscas es cilindraje con equipo
  completo, la Bajaj Dominar 250 es el siguiente escalón natural.
faq:
  - pregunta: "¿Cuánto consume realmente la AKT 250 R?"
    respuesta: >-
      El homologado es 28 km/l. En ciudad con tráfico denso baja a 23-25; en carretera a 90
      km/h sube a 31-33. Con 14 litros de tanque la autonomía práctica está entre 330 y 450 km
      según el uso.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es su terreno natural. Mantiene 110 km/h con comodidad y llega a 135 en plano. La
      quinta marcha larga y el asiento firme permiten trayectos de 200 km sin drama. Es la AKT
      con la que sí se puede viajar.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es lo más eficiente: consumo de 25 km/l en ciudad, SOAT de categoría alta y llantas
      más caras. Sirve si el trabajo exige velocidad o recorridos largos, pero para reparto
      urbano una 125 o 150 cuesta la mitad de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la AKT 250 R?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Son 418.000 pesos más al año que una 200 cc, un dato que casi nunca
      aparece en los comparativos de precio de compra.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No como primera moto. Con 20,8 HP y 145 kilos exige criterio, y su ABS de un solo canal
      protege solo la rueda delantera. Es una buena segunda moto para quien ya tiene un año de
      experiencia en 125 o 150.
veredicto: >-
  La 250 R demuestra que se puede tener cilindraje y ABS por menos de doce millones. Sus
  debilidades son de marca, de acabado y de una caja de cinco marchas que se queda corta;
  sus fortalezas son el motor, el precio y la red de repuestos AKT. Una compra racional,
  no emocional.
