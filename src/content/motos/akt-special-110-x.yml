descripcion: >-
  La AKT Special 110 X es la moto más liviana y barata de este catálogo: 107 cc, 7,21 HP,
  98 kilos y caja semiautomática de cuatro marchas por 4.990.000 pesos. No hay embrague,
  no hay quinta, no hay ABS: hay una moto mínima para moverse en ciudad con el menor gasto
  posible. Es para ti si nunca has manejado moto, si tu recorrido diario es corto y plano,
  o si necesitas un vehículo auxiliar económico. No es para ti si hay pendientes en tu
  ruta, si llevas parrillero o si sales a carretera: con 7,2 caballos y 3,78 litros de
  tanque, el alcance es muy limitado.
uso_diario: >-
  Los 98 kilos son la clave: la Special se mueve con una facilidad que sorprende, incluso
  para alguien que nunca ha manejado moto. La caja semiautomática de cuatro marchas se
  opera con el pie y no exige modular embrague, así que el tráfico deja de ser un problema
  para la mano izquierda. En plano y a velocidades de hasta 60 km/h es una moto
  perfectamente funcional. El problema aparece en pendiente: con 7,2 HP, una loma larga
  obliga a bajar a segunda y, con parrillero, a primera. En Bogotá o Medellín, eso se
  convierte en una limitación diaria. Los 140 mm de distancia al piso son los más bajos
  del catálogo, así que los resaltos hay que pasarlos despacio. El freno delantero de
  disco lobulado funciona bien, pero el tambor trasero y la ausencia de ABS exigen
  distancia. El consumo de 50 km/l es excelente, aunque el tanque de 3,78 litros obliga a
  tanquear cada 150-180 km.
