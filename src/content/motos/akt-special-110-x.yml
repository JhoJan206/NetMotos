costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Es la moto más barata de mantener de todo el catálogo, con
  una advertencia: al tener 107 cc cae en la categoría de 100 a 200 cc del SOAT y paga
  343.000 pesos, apenas 3.000 menos que una 125. La ventaja fiscal de las motos pequeñas
  solo existe por debajo de los 100 cc.
comparativa: >-
  Frente a la AKT Flex 125, la Special cuesta 900.000 pesos menos y ofrece 1,4 caballos
  menos y un tanque igual de pequeño: la Flex es mejor moto por poco dinero más. Contra la
  Bajaj Boxer CT100, la AKT gana en precio y en peso, y pierde en cilindraje, en torque y
  en capacidad de trabajo. Y si el presupuesto llega a 5,5 millones, la Honda CB125F
  ofrece inyección, 3,6 caballos más y una red de servicio incomparablemente mayor.
faq:
  - pregunta: "¿Cuánto consume realmente la Special 110 X?"
    respuesta: >-
      El homologado es 50 km/l. En ciudad con paradas constantes el registro está entre 44 y
      48; en tramos planos y largos se acerca a 52. Con 3,78 litros de tanque la autonomía
      práctica es de 165 a 195 km, la más corta de esta lista.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Muy poco. A 60 km/h va cómoda; a 70 ya va al límite y por encima de eso la moto se
      siente insegura por peso y por frenos. No es una moto para salir del perímetro urbano de
      forma habitual.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Solo para pedidos muy cortos y livianos. El tanque de 3,78 litros obliga a tanquear casi
      a diario y la falta de potencia con carga la hace lenta en pendientes. Para reparto, una
      125 con tanque de 10 litros cuesta poco más y rinde el doble.
  - pregunta: "¿Cuánto cuesta el SOAT de la Special 110 X?"
    respuesta: >-
      Con 107 cc entra en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es
      importante saberlo porque mucha gente cree que por ser "110" paga la tarifa mínima, y la
      tarifa mínima es solo para motos de menos de 100 cc.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es la más fácil de aprender del mercado: 98 kilos, sin embrague, asiento a 770 mm y una
      potencia que no asusta. Como escuela urbana es ideal. El riesgo es que después cuesta
      adaptarse a una moto con embrague y a un peso mayor.
veredicto: >-
  La Special 110 X es una moto de propósito muy específico: ciudad plana, trayectos
  cortos, un solo ocupante. Dentro de ese marco es barata y funcional; fuera de él, se
  queda corta en todo. Quien la compre sabiendo para qué sirve no se va a arrepentir.
