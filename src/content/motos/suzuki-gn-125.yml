costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es de los más baratos del mercado: el
  motor es conocido por todos los talleres, los repuestos se consiguen en cualquier ciudad
  y los intervalos son cortos pero económicos. Su gran ventaja es que no depende de un
  concesionario para funcionar.
comparativa: >-
  Frente a la AKT NKD 125, la GN cuesta 500.000 pesos más y ofrece 0,7 caballos
  adicionales y la confiabilidad Suzuki, aunque pierde el respaldo de una red de talleres
  AKT en municipios pequeños. Contra la Honda CB125F, la Suzuki cuesta 200.000 pesos más y
  pierde inyección, peso y acabado, aunque gana en simplicidad mecánica. Y si el
  presupuesto llega a 6,6 millones, la AKT CR4 125 ofrece doble disco con CBS por un
  millón más.
faq:
  - pregunta: "¿Cuánto consume realmente la GN 125?"
    respuesta: >-
      El homologado es 48 km/l. En ciudad con tráfico el registro está entre 42 y 45; en
      carretera a 70 km/h sube a 50. Con 9,5 litros de tanque la autonomía práctica es de 400
      a 480 km, suficiente para una semana de uso urbano.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos, sí. Mantiene 75-80 km/h con comodidad y llega a 90 en plano, pero por
      encima de 80 el motor va alto y no hay resto para adelantar. Es una moto urbana con
      capacidad de vía secundaria, no de autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y es una de las más rentables: bajo consumo, mantenimiento barato y repuestos en
      cualquier taller. Su desventaja frente a una moto de trabajo moderna es el tanque de 9,5
      litros y la ausencia de freno trasero de disco.
  - pregunta: "¿Cuánto cuesta el SOAT de la GN 125?"
    respuesta: >-
      Con 124 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 5,39 millones representa el 6,4 % del valor, una
      proporción alta que conviene presupuestar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una escuela excelente: liviana, baja, con potencia dócil y una mecánica simple
      que enseña cómo funciona una moto. La advertencia es el tambor trasero y la ausencia de
      ABS, que obligan a aprender a frenar con criterio desde el primer día.
veredicto: >-
  La GN 125 no intenta ser moderna: intenta seguir funcionando. Y lo logra mejor que
  muchas motos más caras, porque su mecánica es simple, conocida y reparable en cualquier
  parte. Para quien compra transporte y no tecnología, sigue siendo una opción válida.
