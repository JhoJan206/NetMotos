descripcion: >-
  La Suzuki GN 125 es una de las motos más antiguas que siguen en el catálogo colombiano,
  y eso es exactamente su argumento: 124 cc, 11,2 HP, carburador Mikuni y una mecánica que
  cualquier taller del país conoce, por 5.390.000 pesos. Es una 125 de concepto clásico,
  con tanque de 9,5 litros, asiento a 760 mm y 115 kilos. Es para ti si quieres una moto
  sencilla, confiable y barata de reparar. No es para ti si buscas inyección, ABS o
  diseño: aquí nada de eso existe.
uso_diario: >-
  La GN 125 es una moto que se maneja sin pensar. Pesa 115 kilos, el asiento a 760 mm
  permite apoyar los pies completos y el motor de 11,2 HP entrega de forma lineal, con una
  caja de cinco marchas bien escalonada para ciudad. En tráfico se mueve con soltura y en
  carretera mantiene 75-80 km/h con comodidad, llegando a 90 en plano. El carburador
  Mikuni es el punto débil en frío: pide starter y unos segundos de calentamiento, y en
  altura el ralentí puede volverse irregular. El freno delantero de disco de 275 mm
  funciona bien; el tambor trasero de 130 mm es el punto flojo y no hay ABS. La posición
  es erguida y cómoda, con un manubrio relativamente alto. El consumo de 48 km/l con 9,5
  litros da unos 450 km de autonomía. La suspensión es suave y absorbe bien el asfalto
  roto, aunque se hunde con dos personas.
