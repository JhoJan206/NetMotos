descripcion: >-
  La Royal Enfield Classic 350 es una moto que no se compra con la cabeza: se compra con
  el oído. Motor monocilíndrico de 349 cc, 20,2 HP, 27 Nm a solo 4.000 rpm y un sonido que
  ninguna moto moderna replica, por 19.900.000 pesos. Está ensamblada en Antioquia, con
  componentes de origen nacional en pintura y detalles, y eso explica parte de su precio
  tras el ajuste del impoconsumo de 2026. Es para ti si valoras el carácter, la estética
  clásica y una conducción relajada. No es para ti si buscas prestaciones, ligereza o una
  moto para carretera rápida.
uso_diario: >-
  La Classic 350 es una moto de torque, no de potencia. Los 27 Nm llegan a 4.000 rpm, así
  que se puede rodar en quinta a 50 km/h sin que el motor proteste y salir de un semáforo
  sin tocar el cambio. Ese es el placer de esta moto: no hay que trabajarla, solo
  acompañarla. La posición es erguida, con el manubrio alto y las estriberas centradas,
  cómoda para trayectos largos a velocidad moderada. El asiento a 805 mm es accesible. El
  peso es el punto crítico: 195 kilos son muchos para 20 caballos, y se sienten en
  maniobras lentas, en parqueadero y en pendientes a baja velocidad. La suspensión es
  suave y absorbe bien el asfalto roto, aunque en vías destapadas se queda corta. Los
  frenos son disco de 300 mm adelante y 270 mm atrás, ambos con ABS de doble canal, y
  funcionan bien para el ritmo de la moto. En carretera mantiene 100 km/h con comodidad,
  aunque por encima de 110 el motor vibra y no hay mucho más.
