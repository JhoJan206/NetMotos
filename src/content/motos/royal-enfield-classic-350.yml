costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Royal Enfield.
  El SOAT y la técnico-mecánica van aparte. Los intervalos de servicio son largos (5.000
  km para aceite), lo que compensa en parte el precio de los repuestos. El punto a vigilar
  es la red de servicio: aunque la marca creció mucho en Colombia, sigue teniendo menos
  puntos de atención que Honda o Yamaha.
comparativa: >-
  Frente a la Royal Enfield Hunter 350, la Classic cuesta 4 millones más y ofrece el mismo
  motor, con una postura más clásica y un peso 14 kilos mayor: es una decisión estética y
  de confort, no mecánica. Contra la Royal Enfield Meteor 350, la Classic es más barata
  por 2 millones y pierde la posición de crucero y dos litros de tanque. Y si el
  presupuesto aprieta pero quieres una moto con carácter, la Hunter 350 hace lo mismo por
  15,9 millones.
faq:
  - pregunta: "¿Cuánto consume realmente la Classic 350?"
    respuesta: >-
      El homologado es 28 km/l. En ciudad con tráfico el registro está entre 25 y 27; en
      carretera a 90 km/h sube a 31-33. Con 13 litros de tanque la autonomía práctica es de
      320 a 430 km, suficiente para una semana de uso mixto.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, a ritmo tranquilo. Mantiene 100 km/h sin esfuerzo y llega a 120 en plano, pero por
      encima de 110 el motor vibra y la moto se siente forzada. Es una moto para rutas de 200
      km a 90 km/h, no para autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Pesa 195 kilos, cuesta 19,9 millones y su mantenimiento supera el millón y medio
      anual. Es una moto de disfrute y de imagen. Para trabajo, una 125 cuesta una fracción de
      lo que cuesta operar esta.
  - pregunta: "¿Cuánto cuesta el SOAT de la Classic 350?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 19,9 millones representa el 3,8 % del valor, una
      proporción manejable frente a motos más económicas.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con matices. El motor es dócil y el torque bajo perdona los errores de cambio, pero 195
      kilos son muchos para alguien sin experiencia, sobre todo en maniobras lentas y en
      pendiente. Es una buena primera moto para quien tenga contextura y criterio.
veredicto: >-
  La Classic 350 no es rápida, no es liviana y no es barata. Es, en cambio, una de las
  pocas motos que se disfruta a 60 km/h, y eso no aparece en ninguna ficha técnica. Quien
  busca emociones medidas en caballos no la va a entender; quien busca carácter, sí.
