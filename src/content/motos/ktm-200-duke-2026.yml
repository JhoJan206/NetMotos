costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario KTM. El SOAT y
  la técnico-mecánica van aparte. Con 199,5 cc se queda por debajo del umbral de 200 y
  paga la categoría intermedia del SOAT: 343.000 pesos en lugar de 761.000, una ventaja
  real. Lo que sí cuesta como una moto grande es el mantenimiento: aceite sintético,
  llantas deportivas y pastillas en las dos ruedas.
comparativa: >-
  Frente a la Bajaj Pulsar NS200, la KTM cuesta 5,8 millones más y ofrece 0,6 caballos
  adicionales, 15 kilos menos, horquilla invertida, pinza radial y cuatro años de
  garantía: la diferencia no está en el motor sino en todo lo demás. Contra la Bajaj
  Pulsar NS400Z, la KTM cuesta 700.000 pesos menos y pierde 14,7 caballos, aunque gana en
  ciclística y en acabado. Y si el objetivo es una 200 con ABS por menos de trece
  millones, la NS200 sigue siendo la compra racional.
faq:
  - pregunta: "¿Cuánto consume realmente la 200 Duke?"
    respuesta: >-
      El homologado es 30 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      24 y 27; en carretera a 90 km/h sube a 32-34. Con 13,5 litros de tanque la autonomía
      práctica va de 320 a 460 km según el puño derecho.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, y muy bien. Mantiene 110-120 km/h sin esfuerzo y llega a 140 en plano. La posición
      es de naked deportiva, no de turística, así que trayectos de 200 km son viables pero
      exigentes para el cuerpo. La moto, en cambio, no sufre.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es su propósito. Consume 25 km/l en ciudad, el mantenimiento supera el millón y medio
      anual y el asiento firme castiga trayectos largos. Es una moto de disfrute. Para
      trabajo, una 125 cuesta una cuarta parte de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la 200 Duke?"
    respuesta: >-
      Con 199,5 cc se queda por debajo de los 200, así que paga la categoría de 100 a 200 cc:
      alrededor de 343.000 pesos al año. Es la mitad de lo que paga una 250 o una 390, un
      detalle que mucha gente pasa por alto al comparar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No es la mejor primera moto. Los 24,7 caballos en 140 kilos hacen que la moto responda
      con una contundencia que un novato puede subestimar, y la suspensión firme transmite
      cada imperfección. Es una excelente segunda moto para quien ya domina una 150.
veredicto: >-
  La 200 Duke es la moto que demuestra que la diversión no depende del cilindraje: 140
  kilos, componentes de gama alta y un chasis que perdona menos pero enseña más. Cuesta
  como una 250 y rinde como una 300 en sensaciones; quien la compra por ficha técnica se
  equivoca, quien la compra por comportamiento no.
