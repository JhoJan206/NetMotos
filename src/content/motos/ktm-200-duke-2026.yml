descripcion: >-
  La KTM 200 Duke 2026 es la naked de entrada de la marca austriaca en Colombia: 199,5 cc,
  24,7 HP, 140 kilos y una relación peso-potencia que ninguna otra moto de 200 puede
  igualar. Cuesta 18.990.000 pesos, casi el doble que una Bajaj NS200 con potencia
  similar, y esa diferencia se paga en chasis, suspensiones, frenos y garantía: cuatro
  años sin límite de kilometraje desde 2026. Es para ti si quieres el comportamiento de
  una moto europea y no te importa pagarlo. No es para ti si buscas el mejor precio por
  caballo: en ese terreno la Bajaj gana por goleada.
uso_diario: >-
  Los 140 kilos son el dato que cambia todo. Con 24,7 HP, la 200 Duke tiene una relación
  peso-potencia de 5,7 kilos por caballo, mejor que muchas 250 y que algunas 300. Eso se
  traduce en una moto que se siente ligera en todas partes: entra a curva con un
  pensamiento, cambia de dirección con un movimiento de cadera y frena con una
  contundencia que sorprende. El motor entrega lo mejor arriba de 7.000 rpm, con un
  carácter vivo que invita a subirlo de vueltas; por debajo de 4.000 es dócil pero no
  perezoso. La horquilla invertida y el basculante trasero son componentes de moto
  superior, y el disco delantero de 320 mm con pinza radial ByBre frena como el de una
  moto de pista. En ciudad, el asiento a 815 mm y la suspensión firme se sienten: es
  cómoda por tramos de 30 minutos, no para una hora de tráfico. El consumo de 30 km/l con
  13,5 litros da unos 400 km de autonomía.
