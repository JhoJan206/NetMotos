descripcion: >-
  La AKT TT200 con ABS es la doble propósito de 200 cc que AKT vende por 9.790.000 pesos:
  197,6 cc, 16,8 HP, inyección electrónica, ABS delantero y 210 mm de distancia al piso.
  Es la opción más económica del mercado para quien quiere una moto con capacidad real de
  trocha y freno ABS. Es para ti si vives en zona rural o periurbana con vías destapadas y
  necesitas algo más que una 125. No es para ti si solo haces asfalto: estarías pagando
  suspensión larga, llantas de tacos y altura que no vas a usar.
uso_diario: >-
  La TT200 comparte el motor de la CR4 200 Pro, pero cambia por completo el chasis y la
  postura. Los 210 mm al piso y la suspensión de recorrido largo absorben piedra, barro y
  rieles sin transmitir el golpe, y esa es la diferencia práctica con una naked. El motor
  de 16,8 HP con inyección se mueve bien sola y con carga moderada, aunque en subida larga
  con parrillero pide bajar a tercera. La caja de cinco marchas es el punto débil frente a
  la TTR 200, que tiene seis. El asiento a 830 mm es alto: pilotos de menos de 1,70 m van
  a estirarse al detenerse. El ABS delantero es un diferencial real en ripio, donde el
  bloqueo de la rueda delantera es la causa más común de caída. En carretera sostiene
  90-95 km/h, con vibración y sin resto para adelantar. El consumo de 33 km/l con 13
  litros de tanque da unos 400 km.
