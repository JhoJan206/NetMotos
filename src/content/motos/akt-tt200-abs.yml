costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. Las llantas de doble propósito y el kit de arrastre son
  los rubros que encarecen el mantenimiento frente a una naked: el polvo y el barro
  aceleran el desgaste de la cadena y los tacos se gastan antes en asfalto.
comparativa: >-
  Frente a la AKT TTR 200, la TT200 gana ABS delantero e inyección, y pierde la sexta
  marcha y 300.000 pesos en precio. Contra la Honda XR150L 2.0 ABS, la AKT ofrece 5
  caballos más y un motor más moderno por 1,2 millones menos, aunque pierde red de
  servicio y reventa. Y si el uso es más de carretera que de trocha, la Bajaj Pulsar NS200
  ofrece 24 caballos por 3,4 millones más, sin capacidad todoterreno.
faq:
  - pregunta: "¿Cuánto consume realmente la TT200?"
    respuesta: >-
      El homologado es 33 km/l. En trocha, con primera y segunda constantes, baja a 26-29; en
      asfalto a 80 km/h sube a 36. Con 13 litros de tanque la autonomía práctica va de 340 a
      470 km según el terreno y la carga.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, mejor que una 125 de doble propósito. Mantiene 95 km/h sin esfuerzo y tiene reserva
      para adelantar. Las llantas de tacos y la altura generan algo de inestabilidad por
      encima de 100 km/h, así que no es una moto de autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zonas rurales con vías destapadas, sí: aguanta peso, maltrato y huecos. En ciudad
      pavimentada no tiene sentido: gastas llantas de tacos y pierdes agilidad frente a una
      naked de 150 que cuesta menos.
  - pregunta: "¿Cuánto cuesta el SOAT de la TT200?"
    respuesta: >-
      Con 197,6 cc se queda por debajo de los 200, así que paga la categoría de 100 a 200 cc:
      alrededor de 343.000 pesos al año. Es un ahorro de 418.000 pesos frente a una 250, y una
      de las razones por las que las "casi 200" son tan populares.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha sí, porque el ABS delantero y la suspensión larga perdonan. En ciudad es
      exigente: el asiento a 830 mm y los 138 kilos hacen que los primeros días cuesten. Un
      principiante urbano debería empezar en una 125 de calle.
veredicto: >-
  La TT200 con ABS es la doble propósito más sensata del mercado por debajo de los diez
  millones: motor moderno, inyección y ABS delantero en un paquete que aguanta trocha de
  verdad. Su rival no es otra marca, es su propia hermana TTR 200 con seis marchas.
