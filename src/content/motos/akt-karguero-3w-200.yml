descripcion: >-
  El AKT Karguero 3W 200 es un motocarro de tres ruedas con capacidad de carga útil de 410
  kilos, motor de 197 cc, caja de cinco marchas y suspensión trasera de ballestas de cinco
  hojas, por 15.090.000 pesos. No es una moto: es una herramienta de trabajo con la que se
  puede reemplazar una camioneta pequeña en la última milla. Es para ti si tienes un
  negocio, haces reparto pesado o trabajas en una zona donde una moto de dos ruedas no
  alcanza. No es para ti si lo que buscas es moverte tú solo: para eso hay opciones diez
  millones más baratas.
uso_diario: >-
  El Karguero 3W se maneja como un motocarro, no como una moto: la dirección es más
  pesada, el ancho de trocha obliga a calcular las maniobras y los 377 kilos de peso se
  sienten en cada arranque. A cambio, ofrece algo que ninguna moto de dos ruedas puede:
  una plataforma de carga que aguanta 410 kilos y que en la práctica permite llevar
  mercado, herramientas o pedidos de e-commerce sin colgar nada del manubrio. El motor de
  197 cc con 12,07 HP y 13,9 Nm a 5.500 rpm está pensado para torque, no para velocidad:
  con carga completa sostiene 50-60 km/h y en pendiente larga exige primera. La suspensión
  trasera de ballestas de cinco hojas es lo que hace posible la capacidad de carga, y la
  delantera reforzada absorbe el peso extra. La distancia al piso de 305 mm es enorme y
  ayuda en vías destapadas y en resaltos. El freno delantero es de disco hidráulico y el
  trasero de tambor hidráulico; no hay ABS.
