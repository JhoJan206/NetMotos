costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Hay tres cosas que encarecen este mantenimiento frente a
  una moto: el aceite se cambia en mayor cantidad, el kit de arrastre sufre con la carga y
  las llantas traseras son dos y se gastan más rápido. Aun así, el costo por kilo
  transportado es el más bajo del mercado de vehículos de carga.
comparativa: >-
  Frente a una moto de trabajo como la Bajaj Boxer 150X, el Karguero cuesta 7,6 millones
  más y ofrece 29 veces más capacidad de carga útil, con la desventaja de la velocidad y
  el ancho. Contra una camioneta pequeña usada, el motocarro cuesta menos de la mitad,
  consume una fracción y se parquea en cualquier parte. Y si la carga no supera los 100
  kilos, una moto con parrilla cuesta la mitad y es mucho más ágil.
faq:
  - pregunta: "¿Cuánto consume el Karguero 3W 200?"
    respuesta: >-
      El consumo no está homologado para este vehículo y depende directamente de la carga. Con
      410 kilos y recorrido urbano, el rango real está entre 18 y 24 km por galón equivalente;
      con carga ligera en plano puede acercarse a 30. Es un dato que conviene medir con la
      carga habitual antes de calcular la rentabilidad.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos intermunicipales cortos, sí, a 50-60 km/h. No es un vehículo para autopista: su
      velocidad máxima y su estabilidad con carga no están pensadas para eso. Su terreno es la
      ciudad y la vía secundaria en buen estado.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Es su razón de existir. Con 410 kilos de capacidad útil reemplaza varios viajes de moto
      en uno solo, y eso se traduce en menos combustible, menos tiempo y menos personal. Para
      reparto de última milla con paquetes voluminosos es la opción más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT del Karguero?"
    respuesta: >-
      Entra en la categoría de motocarro, con una tarifa cercana a los 387.000 pesos anuales,
      más la revisión técnico-mecánica, que para este tipo de vehículo suele costar más que la
      de una moto. Es un costo fijo bajo para la capacidad de carga que ofrece.
  - pregunta: "¿Es difícil de manejar?"
    respuesta: >-
      Al principio sí. La dirección es más pesada que la de una moto, el ancho obliga a
      calcular los espacios y hay que acostumbrarse a frenar con más distancia por el peso. En
      dos o tres días de práctica urbana se vuelve natural, pero no es un vehículo para
      alguien que nunca ha manejado nada con tres ruedas.
veredicto: >-
  El Karguero 3W 200 no compite con motos: compite con camionetas y con tres viajes de
  moto convertidos en uno. Si tu negocio mueve carga, es una de las mejores inversiones
  posibles; si solo necesitas moverte tú, es un gasto innecesario.
