costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es el típico de una 125 carburada china:
  aceite cada 3.000 km, cadena cada 15.000 y repuestos que se encuentran en cualquier
  taller AKT. Es de las motos más baratas de operar del mercado, aunque el consumo no es
  tan bajo como el de una 100.
comparativa: >-
  Frente a la AKT NKD 125, que comparte marca y concepto, la CHR pierde 2,3 caballos y
  cuesta 600.000 pesos menos: para uso urbano tranquilo es suficiente, pero en carretera o
  con parrillero la diferencia se siente. Contra la Bajaj CT 125, la CHR gana 1,4 millones
  en precio pero pierde en consumo y en torque a bajas vueltas. Y si el presupuesto llega
  a 6,5 millones, la AKT CR4 125 ofrece CBS y un equipo claramente superior por 1,1
  millones más.
faq:
  - pregunta: "¿Cuánto consume realmente la CHR 125?"
    respuesta: >-
      El dato de ficha es 42 km/l. En ciudad con tráfico el registro está entre 38 y 41; en
      carretera a 70 km/h se acerca a 46. Con 12 litros de tanque da entre 450 y 550 km de
      autonomía, una de las mejores cifras de su categoría.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos, con paciencia. A 70-75 km/h va cómoda; por encima de 80 el motor de 8,2
      HP ya no tiene respuesta para adelantar. No es una moto para trayectos interurbanos
      largos ni para autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, sobre todo por el tanque grande y el bajo costo de mantenimiento. Lo que juega en
      contra es la potencia: con el morral lleno y en lomitas, la moto pide primera
      constantemente. Para reparto en terreno plano es una opción sensata.
  - pregunta: "¿Cuánto cuesta el SOAT de la CHR 125?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la revisión técnico-mecánica. Es el 6,2 % del valor de la moto nueva, una proporción
      alta que conviene tener en el presupuesto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es muy dócil: poco peso, asiento bajo y una potencia que no sorprende. El carburador
      exige aprender a usar el starter en frío, y el tambor trasero obliga a frenar con
      anticipación. Para aprender en ciudad es una opción válida y barata.
veredicto: >-
  La CHR 125 es la opción "sin sorpresas" del catálogo AKT: barata, sencilla y con un
  tanque enorme. Su problema no es la calidad sino la competencia interna: por 600.000
  pesos más, la NKD 125 ofrece 2,3 caballos adicionales que en Colombia se agradecen todos
  los días.
