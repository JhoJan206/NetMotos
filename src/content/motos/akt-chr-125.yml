descripcion: >-
  La AKT CHR 125 es la 125 económica de AKT que compite directamente con la NKD, con una
  diferencia de 600.000 pesos a favor de la NKD y un motor algo menos potente: 8,2 HP
  frente a 10,5. A cambio ofrece un tanque de 12 litros y una postura ligeramente más
  alta. Es para ti si el precio es el criterio absoluto y necesitas una moto urbana con
  freno de disco delantero. No es para ti si haces carretera con frecuencia o llevas
  parrillero en pendientes: 8,2 caballos son pocos para este país, y la diferencia con la
  NKD se siente.
uso_diario: >-
  En ciudad cumple sin quejas. Pesa 118 kilos, el asiento está a 780 mm y la posición de
  manejo es neutra, así que se maneja con soltura entre carros. El motor a carburador
  arranca bien en clima cálido, aunque en frío y en altura pide un poco de starter y unos
  segundos de calentamiento antes de salir. La entrega de potencia es muy lineal y la caja
  de cinco marchas está escalonada para ciudad: primera y segunda cortas, tercera y cuarta
  de transición, quinta larga. El freno de disco delantero de 220 mm agradece en tráfico,
  aunque el tambor trasero de 130 mm es el eslabón débil. En carretera la moto se queda
  corta: a 75 km/h el motor va alto y adelantar requiere planearlo con tiempo. El tanque
  de 12 litros es su mejor argumento: a 42 km/l da unos 500 km de autonomía, más de lo que
  su motor invita a recorrer. La suspensión es blanda y cómoda en huecos, aunque se hunde
  con dos personas a bordo.
