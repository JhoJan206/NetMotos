descripcion: >-
  La AKT CR4 150 es la misma plataforma de la CR4 125 con 25 cc más y 3,2 caballos
  adicionales: 149,5 cc, 12,5 HP y frenos de disco con CBS en las dos ruedas, por
  6.990.000 pesos. Es la respuesta de AKT a quien necesita un poco más de motor sin salir
  del segmento económico. Es para ti si la 125 te queda corta, haces trayectos con
  parrillero o carretera corta, y quieres mantener el doble disco. No es para ti si
  esperas un salto grande de prestaciones: 400.000 pesos compran 3,2 caballos, no una moto
  nueva.
uso_diario: >-
  La diferencia frente a la 125 se siente sobre todo con carga y en subida. Donde la 125
  pedía primera, la 150 sube en segunda sin quejarse, y eso cambia la experiencia en
  ciudades con pendiente como Medellín, Manizales o Bucaramanga. En plano y solo, las dos
  motos se parecen mucho; con parrillero, la 150 es claramente superior. La caja de cinco
  marchas está bien escalonada y la quinta permite cruceros de 85 km/h sin que el motor
  sufra. El motor a carburador arranca sin drama en clima cálido, aunque en frío pide
  starter. Los frenos con CBS siguen siendo el punto fuerte: disco de 240 delante y 200
  atrás. Pesa 124 kilos, cuatro más que la 125, sin que eso afecte la agilidad. El consumo
  baja a 36 km/l, con lo que el tanque de 12,5 litros da unos 430 km de autonomía: hay que
  tanquear con algo más de frecuencia que en la 125, pero el uso es más relajado.
