costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. La CR4 150 cuesta unos 30.000 pesos más al año de mantener
  que la 125, por aceite ligeramente más caro y mayor desgaste de arrastre. La diferencia
  de consumo —36 frente a 40 km/l— es el costo real de los 3,2 caballos adicionales.
comparativa: >-
  Frente a la CR4 125, la 150 cuesta 400.000 pesos más y entrega 3,2 caballos y bastante
  más torque: es la mejora más rentable del catálogo AKT. Contra la Honda CB125F, la CR4
  150 gana en cilindraje y en doble disco, y pierde en inyección y en red de servicio. Y
  si el uso incluye destapado, la AKT TTR 125 o la TT200 ABS ofrecen suspensión y altura
  que la CR4 no tiene.
faq:
  - pregunta: "¿Cuánto consume realmente la CR4 150?"
    respuesta: >-
      El homologado es 36 km/l. En ciudad con tráfico y parrillero baja a 31-34; en carretera
      a 80 km/h sube a 39-41. Con 12,5 litros de tanque la autonomía práctica es de 390 a 500
      km según el uso.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Mejor que la 125: mantiene 85 km/h sin esfuerzo y llega a 100 en plano. Para trayectos
      de 100 a 120 km con parrillero es una moto válida. Por encima de eso, el motor carburado
      y el asiento terminan cansando.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, y es mejor que la 125 en zonas con pendiente porque no se queda en las lomas con el
      morral lleno. El consumo es 4 km/l mayor, así que para reparto plano intenso la 125
      sigue siendo más rentable. Es cuestión de geografía.
  - pregunta: "¿Cuánto cuesta el SOAT de la CR4 150?"
    respuesta: >-
      Con 149,5 cc sigue en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año.
      Es la misma tarifa de la 125, lo que significa que los 3,2 caballos adicionales no
      cuestan nada en SOAT, solo en gasolina.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, y con ventaja sobre una 200: la potencia es suficiente para aprender sin sustos y el
      CBS da margen en las frenadas. Pesa 124 kilos, que es manejable, y la entrega de
      potencia es muy predecible. Es un buen primer paso antes de una 200.
veredicto: >-
  Por 400.000 pesos, la CR4 150 corrige la única debilidad real de la CR4 125: la falta de
  motor con carga. Sigue siendo una moto económica, con doble disco y un consumo
  razonable. Probablemente sea la compra más equilibrada del catálogo AKT.
