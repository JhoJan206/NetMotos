costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento de la Flex es barato en repuestos, pero
  tiene un costo escondido: el tanque pequeño obliga a más visitas a la bomba, y eso, en
  tiempo de trabajo, se paga. Si el uso es de domicilios, vale la pena calcular cuántas
  tanqueadas extra implica frente a una 125 con tanque de 10 litros.
comparativa: >-
  Frente a la Honda Navi, la Flex ofrece el mismo concepto de conducción sin embrague pero
  con ruedas grandes de 18 pulgadas y postura de moto, lo que la hace más estable en vías
  irregulares; la Navi gana en imagen y en red de servicio. Contra la AKT Dynamic Pro CBS,
  que es scooter puro, la Flex es más barata y más liviana, pero pierde el baúl bajo el
  asiento y la comodidad de un piso plano. Y si puedes estirar el presupuesto, la TVS
  Raider 125 cuesta casi lo mismo y ofrece inyección, doble disco y cinco marchas.
faq:
  - pregunta: "¿Cuánto consume realmente la AKT Flex 125?"
    respuesta: >-
      El homologado es 48 km/l. En ciudad, con paradas constantes, el registro baja a 42-45
      km/l. La autonomía real es de 155 a 175 km por tanque, así que un domiciliario puede
      estar tanqueando cada dos días o incluso a diario si hace muchos kilómetros.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Poco. Con 8,6 HP y cuatro marchas, a 70 km/h ya va al límite y el tanque de 3,8 litros
      da para menos de dos horas de viaje. Sirve para trayectos urbanos y periurbanos cortos;
      para carretera hace falta una 150 o más.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Es una de las favoritas para eso precisamente por la caja semiautomática: menos fatiga
      en el tráfico. Sin embargo, el tanque pequeño juega en contra. Si haces más de 150 km al
      día, una 125 con tanque de 10 litros termina siendo más rentable en tiempo.
  - pregunta: "¿Cuánto cuesta el SOAT de la Flex 125?"
    respuesta: >-
      Con 123,7 cc entra en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año.
      Es el mismo valor que paga cualquier 125, y representa casi el 6 % del precio de la moto
      nueva, un dato que muchos compradores no calculan al comparar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es probablemente la más amable del mercado para empezar: sin embrague, liviana, baja y
      con potencia muy contenida. El riesgo es el opuesto al habitual: como es tan fácil, se
      subestima la frenada. El tambor trasero y la ausencia de ABS exigen aprender a frenar
      bien desde el principio.
veredicto: >-
  La Flex 125 resuelve el problema de moverse barato y sin complicaciones mecánicas, y lo
  hace por menos de seis millones. Su límite no es la potencia: es el tanque. Quien la
  compre sabiendo eso tendrá una moto cumplidora; quien espere viajar o hacer 200 km
  diarios se va a cansar de la bomba.
