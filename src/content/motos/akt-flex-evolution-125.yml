descripcion: >-
  La AKT Flex 125 es la puerta de entrada más barata al mundo de las motos "sin clutch" en
  Colombia: 123,7 cc, 8,6 HP y una caja semiautomática de cuatro marchas que se opera con
  el pie, sin manigueta de embrague. Está pensada para quien nunca ha manejado moto, para
  repartidores que hacen decenas de paradas al día y para quien quiere lo más económico de
  operar. Es para ti si tu recorrido es urbano, corto y con muchas detenciones. No es para
  ti si haces carretera, si llevas parrillero con frecuencia o si necesitas tanquear poco:
  su tanque de 3,8 litros es el más pequeño de esta lista.
uso_diario: >-
  La gracia de la Flex está en la caja semiautomática: no hay embrague que modular, así
  que el tráfico pesado deja de ser una tortura para la mano izquierda. Se conduce como
  una moto pero se siente casi como un scooter, y eso explica por qué es una de las motos
  más vendidas entre domiciliarios de ciudad. Pesa 103 kilos, es bajísima de maniobra y el
  asiento a 780 mm permite apoyar bien los pies. La contraparte es la potencia: 8,6 HP
  mueven con soltura a una persona, pero con parrillero en una lomita toca bajar a segunda
  y esperar. La distancia al piso de 130 mm es la más baja del catálogo, así que los
  resaltos y los huecos hay que pasarlos con cuidado si no quieres golpear el cárter. El
  consumo de 48 km/l es bueno, pero el tanque de 3,8 litros obliga a tanquear cada 150-170
  km, es decir, dos o tres veces por semana si trabajas con ella. Esa es la molestia real
  de esta moto, más que su potencia.
