descripcion: >-
  La Hero Hunk 125R es una 125 deportiva con frenos de disco en las dos ruedas, motor de
  11 HP y monoamortiguador trasero, por 4.590.000 pesos. Es una propuesta poco habitual:
  doble disco en una 125 de precio de entrada, algo que en el mercado colombiano solo
  ofrecen contadas excepciones. Es para ti si quieres seguridad de frenada y no quieres
  pasar de cinco millones. No es para ti si te importa la red de servicio: Hero tiene
  menos concesionarios en Colombia que Honda, Yamaha o AKT, y eso es una limitación real.
uso_diario: >-
  El motor de 124,7 cc con carburador entrega 11 HP a 7.500 rpm, una cifra correcta para
  el segmento. En ciudad se mueve con soltura gracias a sus 124 kilos y a una caja de
  cinco marchas bien escalonada. El doble disco es el argumento más fuerte: 276 mm
  adelante y 220 mm atrás, dimensiones que en una 125 son generosas y que dan una frenada
  consistente incluso con pasajero. El monoamortiguador trasero es un plus frente a los
  dobles amortiguadores convencionales, con mejor control en curva. La posición es
  ligeramente deportiva, con el torso inclinado, cómoda para trayectos de 40 minutos. En
  carretera mantiene 85 km/h y llega a 95 en plano. El consumo de 48 km/l con 10,5 litros
  de tanque da unos 500 km de autonomía. La debilidad es el carburador: en frío y en
  altura pide starter y calentamiento. El monoamortiguador trasero, además, mantiene la moto
  más plantada con parrillero que las de doble amortiguador, aunque su recorrido es corto y
  en vías rotas se siente seco.
