costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El mantenimiento es económico en repuestos, pero la
  disponibilidad es el factor limitante: fuera de las ciudades principales, conseguir
  piezas específicas de Hero puede tomar días. Ese tiempo también es un costo.
comparativa: >-
  Frente a la TVS Raider 125, la Hero cuesta 300.000 pesos menos y ofrece doble disco
  igual, aunque pierde inyección y red de servicio. Contra la AKT CR4 125, la Hero gana en
  precio y en tamaño de disco delantero, y pierde en respaldo de marca y en disponibilidad
  de repuestos. Y si el presupuesto llega a 5,5 millones, la Honda CB125F ofrece inyección
  y una red de servicio incomparablemente mayor.
faq:
  - pregunta: "¿Cuánto consume realmente la Hunk 125R?"
    respuesta: >-
      El homologado es 48 km/l. En ciudad con tráfico el registro está entre 42 y 45; en
      carretera a 70 km/h sube a 50. Con 10,5 litros de tanque la autonomía práctica es de 450
      a 530 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos de 80 a 100 km a 80 km/h, sí. Con 11 HP tiene algo más de reserva que una 125
      básica, aunque el carburador y el asiento limitan los trayectos largos. No es una moto
      de viaje.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve por precio y por frenos, pero la red de servicio es el problema: si trabajas en
      una ciudad intermedia sin concesionario Hero, un repuesto específico puede dejarte
      parado varios días. Para reparto de alto volumen eso es un riesgo real.
  - pregunta: "¿Cuánto cuesta el SOAT de la Hunk 125R?"
    respuesta: >-
      Con 124,7 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      la técnico-mecánica. Sobre una moto de 4,59 millones, el SOAT representa el 7,5 % del
      valor: una proporción alta que conviene presupuestar.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, sobre todo por la frenada: el doble disco perdona errores que en una moto con tambor
      trasero terminan en caída. El carburador exige aprender a usar el starter, y la posición
      deportiva puede incomodar los primeros días.
veredicto: >-
  La Hunk 125R ofrece doble disco por menos de cinco millones, algo que muy pocas 125
  pueden igualar. Su techo no es la moto: es la red de posventa de Hero en Colombia, que
  conviene verificar antes de comprar.
