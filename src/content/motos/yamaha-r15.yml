costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Yamaha. El
  SOAT y la técnico-mecánica van aparte. Con 155 cc se mantiene en la categoría intermedia
  del SOAT, una ventaja frente a una 250. Pero el mantenimiento es de deportiva: aceite
  sintético, refrigerante, llantas de 17 pulgadas y pastillas en las dos ruedas. A eso se
  suma el costo de los plásticos en caso de caída.
comparativa: >-
  Frente a la Yamaha MT-15, la R15 cuesta 600.000 pesos más y ofrece el mismo motor con
  carenado y una posición más agresiva: es la misma moto con otra ergonomía. Contra la
  Suzuki Gixxer SF 250, la Yamaha cuesta un millón menos y pierde 7,7 caballos y 90 cc,
  aunque gana en ciclo y en red de servicio. Y si el objetivo es una deportiva de 400, la
  Kawasaki Ninja 400 ofrece 29,9 caballos más por 19,9 millones adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la R15 V4?"
    respuesta: >-
      El homologado es 33 km/l. En ciudad con tráfico y uso deportivo el registro está entre
      27 y 30; en carretera a 100 km/h sube a 35-37. Con 11 litros de tanque la autonomía
      práctica va de 300 a 400 km, justa para su vocación deportiva.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, es su terreno. Mantiene 110 km/h sin esfuerzo y llega a 130 en plano, con un chasis
      que da confianza en curva. La posición deportiva cansa después de 150 km y el tanque
      obliga a parar, pero la moto está hecha para vía rápida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. La posición agachada, el calor del motor en tráfico, el consumo de 28 km/l en ciudad
      y el costo de reparar plásticos la hacen inviable para trabajo. Es una moto de disfrute
      y de carretera.
  - pregunta: "¿Cuánto cuesta el SOAT de la R15 V4?"
    respuesta: >-
      Con 155 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más la
      técnico-mecánica. Es la misma tarifa de una 125, aunque su precio de lista sea el de una
      moto superior.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No la recomendaría como primera moto. La posición deportiva, el asiento alto y un motor
      que entrega lo mejor arriba exigen experiencia. Es una excelente segunda moto para quien
      ya maneja una 150 de posición neutra.
veredicto: >-
  La R15 V4 es la deportiva de 150 con mejor parte ciclo del mercado: horquilla invertida,
  ABS doble y un chasis que perdona menos pero enseña más. Su precio y su ergonomía la
  limitan al uso deportivo, y ahí es difícil de superar.
