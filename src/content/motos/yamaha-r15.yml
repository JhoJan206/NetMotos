descripcion: >-
  La Yamaha R15 V4 es la deportiva carenada de 155 cc más vendida del país: motor con
  refrigeración líquida, 18,4 HP, seis marchas, horquilla invertida y ABS de doble canal
  por 16.100.000 pesos. Es una moto que se compra con los ojos y se justifica con el
  chasis: su parte ciclo está más cerca de una deportiva de 300 que de una 150. Es para ti
  si quieres una deportiva carenada para carretera y curvas, y aceptas una posición
  exigente. No es para ti si haces ciudad a diario o si necesitas llevar parrillero con
  frecuencia.
uso_diario: >-
  El motor de 155 cc con refrigeración líquida entrega 18,4 HP a 10.000 rpm, lo que
  significa que hay que subirlo de vueltas para encontrar la potencia: por debajo de 7.000
  rpm es una moto dócil, y arriba se transforma en una deportiva que llega a 130 km/h. La
  caja de seis marchas permite mantenerlo en la zona buena sin esfuerzo, y el chasis, con
  horquilla invertida y basculante reforzado, da una precisión en curva que ninguna otra
  150 del mercado iguala. La posición es de deportiva: estriberas retrasadas, torso
  inclinado sobre el tanque y muñecas cargadas. En trayectos de 30 minutos es tolerable;
  en tráfico de una hora, incómoda. El asiento a 815 mm exige estatura y el del parrillero
  es simbólico. Los frenos con ABS de doble canal son un equipo serio. El consumo de 33
  km/l con 11 litros da unos 360 km de autonomía, corta para su vocación.
