descripcion: >-
  La Yamaha Ténéré 700 es la adventure de referencia de la gama media: motor bicilíndrico
  CP2 de 689 cc, 72,4 HP, 67 Nm, 240 mm de distancia al piso, 204 kilos y un precio de
  73.000.000 de pesos. Es una moto de concepto rally: chasis angosto, suspensión de largo
  recorrido y una postura pensada para pilotar de pie. Es para ti si haces trocha de
  verdad y quieres una adventure que no se quede corta fuera del asfalto. No es para ti si
  tu uso es urbano o si esperas comodidad de turismo puro.
uso_diario: >-
  La Ténéré 700 está construida alrededor de una idea: que puedas ir de pie sobre la moto
  durante kilómetros. El chasis angosto, las estriberas anchas y el manubrio alto lo
  permiten, y los 240 mm de distancia al piso y la suspensión de largo recorrido absorben
  piedra, arena y barro con una soltura que ninguna adventure de asfalto iguala. El motor
  CP2 de 72,4 HP entrega 67 Nm con un torque que aparece desde muy abajo, ideal para salir
  de un obstáculo sin patinar el embrague. En carretera mantiene 130 km/h con el motor
  relajado, aunque la falta de carenado completo deja el torso expuesto al viento. El
  asiento a 875 mm es el más alto del catálogo y exige estatura. Los frenos de disco con
  ABS, desconectable en la rueda trasera, funcionan bien en ambas superficies. El consumo
  de 21 km/l con 16 litros da unos 330 km de autonomía.
