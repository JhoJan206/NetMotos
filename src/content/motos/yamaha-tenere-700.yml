costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra de concesionario
  Yamaha. El SOAT y la técnico-mecánica van aparte. Es una de las fichas más caras de
  mantener: llantas de doble propósito que se gastan rápido, kit de arrastre reforzado,
  aceite sintético en cantidad de bicilíndrico y frenos de gama alta. Es el costo real de
  una adventure de 700 cc.
comparativa: >-
  Frente a la Yamaha MT-07, la Ténéré cuesta 16 millones más y ofrece 1 caballo menos, con
  20 kilos más y capacidad de trocha real: es la misma base mecánica con otro propósito.
  Contra la Honda NX500, la Ténéré cuesta unos 18 millones más y ofrece 24,9 caballos
  adicionales y 50 mm más de distancia al piso. Y si el objetivo es una adventure de 300
  para uso mixto, la Kawasaki Versys-X 300 cuesta la mitad y hace el 70 % del trabajo.
faq:
  - pregunta: "¿Cuánto consume realmente la Ténéré 700?"
    respuesta: >-
      El homologado es 21 km/l. En trocha con primera y segunda constantes baja a 16-18; en
      carretera a 110 km/h sube a 23-25. Con 16 litros de tanque la autonomía práctica va de
      260 a 400 km, muy dependiente del terreno.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, y con soltura: mantiene 140 km/h con el motor relajado y tiene reserva hasta 190. El
      problema no es la mecánica sino la protección aerodinámica y el asiento alto, que cansan
      en trayectos largos de autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Cuesta 73 millones, pesa 204 kilos y su mantenimiento supera los tres millones al
      año. Es una moto de aventura y viaje. Para trabajo, una 125 cuesta siete veces menos de
      operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Ténéré 700?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 73 millones, el SOAT representa apenas el 1 % del
      valor: el costo fijo no es el problema.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 875 mm de asiento, 204 kilos y 72 caballos, es una moto que exige estatura y
      experiencia. En trocha perdona por la suspensión, pero en ciudad y en parqueadero
      castiga. Es una moto para pilotos con recorrido.
veredicto: >-
  La Ténéré 700 es la adventure que de verdad va fuera del asfalto, y eso se paga: 73
  millones y más de tres millones al año de mantenimiento. Quien la usa para lo que fue
  hecha no encuentra nada mejor; quien la quiere para ir a la oficina está pagando de más.
