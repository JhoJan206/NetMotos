descripcion: >-
  La Yamaha YZF-R9 es la deportiva de 890 cc que Yamaha creó para llenar el hueco entre la
  R7 y la R1: motor tricilíndrico CP3 con 119 HP, 93 Nm, suspensiones KYB totalmente
  ajustables, quickshifter, control de tracción y ABS por 76.000.000 de pesos. Es una
  deportiva de pista con lo mínimo para circular, y eso define todo lo demás. Es para ti
  si haces track days y quieres una moto de circuito con registro legal. No es para ti si
  tu uso es urbano o si no tienes experiencia con motos de alta potencia.
uso_diario: >-
  El motor CP3 de 890 cc entrega 119 HP con una amplitud de respuesta que sorprende: se
  puede rodar a 50 km/h en segunda sin tirones y en circuito mantener el acelerador
  abierto hasta más de 200 km/h. La entrega es lineal y contundente, sin el pico violento
  de un cuatro en línea, y el sonido del tricilíndrico es uno de los grandes atractivos.
  El chasis, con suspensión KYB totalmente ajustable y pinzas radiales, está pensado para
  circuito: la moto entra a curva con una precisión que exige confianza y devuelve
  información constantemente. La posición es de pista, con estriberas muy retrasadas y el
  torso sobre el tanque; en ciudad resulta incómoda después de 20 minutos. Pesa 200 kilos,
  que desaparecen en movimiento. La electrónica incluye modos de manejo, control de
  tracción y quickshifter. El consumo de 19 km/l con 16 litros da unos 300 km de
  autonomía.
