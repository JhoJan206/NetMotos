costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Yamaha. El
  SOAT y la técnico-mecánica van aparte. Es la ficha más cara de mantener del catálogo, y
  con razón: tres bujías de iridio, casi cuatro litros de aceite sintético, llantas
  deportivas que en uso de circuito duran menos de 5.000 km y frenos de gama alta. En uso
  de pista, el costo real puede duplicarse.
comparativa: >-
  Frente a la Yamaha MT-09, la R9 cuesta 13 millones más y ofrece 1,6 caballos adicionales
  con la misma base mecánica, más carenado, suspensiones de pista y una posición agresiva:
  la diferencia es de propósito, no de potencia. Contra la Yamaha Ténéré 700, la R9 cuesta
  3 millones más y ofrece 46,6 caballos adicionales, aunque pierde toda capacidad fuera
  del asfalto. Y si el objetivo es una deportiva de 400 para iniciarse en circuito, la
  Kawasaki Ninja 400 cuesta la mitad y perdona mucho más.
faq:
  - pregunta: "¿Cuánto consume realmente la YZF-R9?"
    respuesta: >-
      El homologado es 19 km/l. En uso urbano el registro está entre 14 y 17; en carretera a
      120 km/h sube a 21-23. Con 16 litros de tanque la autonomía práctica va de 220 a 370 km,
      y en circuito baja a menos de 150 km por tanque.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con mucha soltura: mantiene 150 km/h con el motor relajado y supera los 240. El
      carenado protege bien, pero la posición de pista castiga la espalda y las muñecas
      después de 150 km. Es una moto para trayectos deportivos y circuito, no para turismo.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Consume 15 km/l en ciudad, cuesta 76 millones y su mantenimiento supera los tres
      millones al año. Es una moto de pista con registro legal. Para trabajo, una 125 cuesta
      quince veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la YZF-R9?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 76 millones representa el 1 % del valor: el SOAT es
      irrelevante frente al costo de llantas y frenos.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No, en ningún sentido. Con 119 caballos, 93 Nm y una posición de pista, es una moto que
      exige experiencia consolidada y, preferiblemente, formación en circuito. La electrónica
      ayuda, pero no reemplaza años de rodaje.
veredicto: >-
  La YZF-R9 es la deportiva de pista más accesible de Yamaha y una de las motos más
  exigentes del catálogo. Su motor tricilíndrico y su chasis justifican cada peso de los
  76 millones; su costo de operación la reserva a quien de verdad la va a usar.
