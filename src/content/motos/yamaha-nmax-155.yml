descripcion: >-
  La Yamaha NMAX 155 es el scooter que redefinió el segmento premium en Colombia: motor de
  155 cc con VVA, ABS en las dos ruedas, control de tracción y una posición de manejo que
  se siente más de moto que de scooter. Cuesta 16.800.000 pesos, casi el triple que un
  scooter de entrada, y aun así se vende: eso dice mucho de lo que ofrece. Es para ti si
  haces trayectos urbanos largos, quieres comodidad sin renunciar a prestaciones y valoras
  la seguridad activa. No es para ti si tu presupuesto es limitado, si necesitas cargar
  bultos grandes o si haces carretera abierta con frecuencia.
uso_diario: >-
  El motor de 155 cc con VVA entrega 15 HP y permite algo que ningún scooter de 125 puede:
  adelantar con seguridad en una vía rápida y mantener 100 km/h sin ahogarse. La
  transmisión CVT es suave y no tiene el tirón brusco de algunos scooters económicos. La
  altura del asiento, 765 mm, es amable, y el piso plano con túnel central bajo permite
  llevar una mochila entre las piernas. El ABS de doble canal y el control de tracción son
  la diferencia real frente a la competencia: en pavimento mojado, o sobre las líneas
  blancas de un semáforo, la moto no se va. Pesa 130 kilos y eso se siente en maniobras a
  baja velocidad y al parquear, aunque en movimiento es muy estable. La suspensión trasera
  es de doble amortiguador y trabaja bien en vías irregulares. Su límite es el tanque: 6,6
  litros dan para unos 280-300 km, poco para quien rueda mucho. Y en carretera abierta,
  por encima de 110 km/h, la falta de protección aerodinámica se hace notar.
