costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Yamaha. El
  SOAT y la técnico-mecánica van aparte. El costo es notablemente más alto que el de un
  scooter de 125 por tres razones: aceite sintético, llantas de mayor medida y el
  mantenimiento del sistema CVT, que no existe en una moto con cadena. Aun así, sigue
  siendo más barato de operar que un carro pequeño.
comparativa: >-
  Frente a la AKT Dynamic RX Fi, la NMAX cuesta 7 millones más y ofrece 3 HP adicionales,
  ABS de doble canal y control de tracción: la diferencia no es de equipamiento, es de
  categoría. Contra la Yamaha XMAX 300, la NMAX es más liviana, más barata y más ágil en
  ciudad, aunque pierde el baúl para dos cascos y la estabilidad en carretera. Y frente a
  una moto naked de 150 cc como la Yamaha FZ 3.0, la NMAX gana en comodidad y protección,
  pero pierde en precio y en facilidad de mantenimiento.
faq:
  - pregunta: "¿Cuánto consume realmente la NMAX 155?"
    respuesta: >-
      El homologado es 45 km/l. En ciudad, con tráfico y uso del modo de arranque y parada, el
      registro real está entre 38 y 42 km/l; en carretera a 80 km/h se acerca a 48. Con 6,6
      litros de tanque la autonomía práctica es de 260 a 300 km.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Mejor que cualquier scooter de 125: mantiene 100-110 km/h y adelanta con soltura. Para
      trayectos de 100 a 200 km es viable. Por encima de eso, la posición y la falta de
      parabrisas cansan, y el tanque pequeño obliga a parar seguido.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, pero es cara para ese uso: el mantenimiento del CVT y las llantas de 13 pulgadas
      cuestan más que los de una moto de trabajo. Quien reparte con NMAX lo hace por comodidad
      y por imagen, no por economía. Para volumen puro, una 125 con cadena sale más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la NMAX 155?"
    respuesta: >-
      Con 155 cc queda en la categoría de 100 a 200 cc, así que paga alrededor de 343.000
      pesos anuales, no la tarifa alta. Mucha gente asume que un scooter de este precio paga
      más, pero el criterio es el cilindraje, no el valor del vehículo.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, con una advertencia. No hay embrague que aprender y la moto es estable, pero pesa
      130 kilos y tiene 15 HP: no es un juguete. La ventaja es que el ABS y el control de
      tracción están ahí desde el primer día para cubrir los errores iniciales.
veredicto: >-
  La NMAX 155 es el scooter que hace que valga la pena pagar el doble: prestaciones
  reales, seguridad activa que funciona y una conducción que no aburre. Es cara y su
  tanque es pequeño, pero para quien la usa a diario en ciudad, cada uno de esos millones
  extra se justifica.
