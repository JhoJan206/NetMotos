costos_nota: >-
  Estimación para 2026 con 12.000 km al año, mano de obra de taller autorizado y aceite
  sintético, que es lo que recomienda Yamaha para este motor. El SOAT y la
  técnico-mecánica van aparte. Los repuestos de la familia FZ tienen amplia
  disponibilidad, incluso fuera de las ciudades principales, y eso reduce el riesgo de que
  la moto se quede parada esperando una pieza.
comparativa: >-
  Frente a la Honda CB190R 2.0, la FZ pierde 4 caballos y gana economía: consume cerca de
  7 km/l más y cuesta casi un millón menos. Contra la Yamaha MT-15, que comparte marca y
  cilindraje similar, la FZ es 3,7 millones más barata y mucho más cómoda, aunque la MT-15
  la supera en potencia, suspensión y equipo. Y si el presupuesto es el límite, la TVS
  Raider 125 ofrece doble disco por menos de cinco millones, con 2 caballos menos y sin el
  respaldo de la red Yamaha.
faq:
  - pregunta: "¿Cuánto consume realmente la FZ 3.0?"
    respuesta: >-
      Yamaha declara 44 km/l. En ciudad con tráfico denso el registro está entre 38 y 41; en
      carretera a 80 km/h sube a 48. Con el tanque de 13 litros la autonomía real supera los
      480 km, una de las mejores del segmento de 150 cc.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 90 km/h. Es una moto estable y bien plantada, apta para
      trayectos de 150 a 200 km sin fatiga. Por encima de 100 km/h el motor va al límite y el
      consumo sube, pero no se siente insegura.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, aunque su costo de mantenimiento es mayor que el de una 125 de trabajo. A cambio
      ofrece algo que un repartidor agradece: la moto no se varada y el ABS delantero agrega
      margen en tráfico. Para volúmenes altos de pedidos, una 125 sigue siendo más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la FZ 3.0?"
    respuesta: >-
      Con 149 cc entra en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es
      importante saberlo porque muchas personas creen que por ser 150 paga la tarifa alta, y
      no: el salto de categoría está por encima de los 200 cc.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es una excelente primera moto "en serio". La entrega de potencia es suave, la moto se
      siente estable y el ABS delantero cubre el error más común de los novatos. Pesa 137
      kilos, así que conviene practicar maniobras en parqueadero antes de meterse al tráfico.
veredicto: >-
  La FZ 3.0 no gana ninguna carrera y no lo pretende. Gana en lo que importa a diario:
  arranca, consume poco, se consigue repuesto y no da sorpresas. Después de quince años en
  el mercado colombiano, ese historial sigue siendo su mejor ficha técnica.
