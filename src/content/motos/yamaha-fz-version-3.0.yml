descripcion: >-
  La Yamaha FZ 3.0 es la naked de 150 cc que lleva quince años construyendo una reputación
  de moto confiable y económica en Colombia. Esta versión suma inyección electrónica Blue
  Core, ABS monocanal delantero y una estética más agresiva. Con 13 HP, 137 kilos y 44
  km/l, no busca ser la más rápida: busca ser la más equilibrada. Es para ti si quieres
  una moto de marca japonesa para uso diario, con consumo bajo y repuestos disponibles en
  todo el país. No es para ti si vienes de una 200 o buscas emociones fuertes: 13 caballos
  en una moto de 137 kilos son suficientes, pero no emocionantes.
uso_diario: >-
  La FZ 3.0 se siente sólida desde el arranque. El motor Blue Core de 149 cc entrega la
  potencia de forma muy lineal, sin picos, y eso la hace fácil de manejar en tráfico y
  predecible en carretera. La inyección mantiene el ralentí estable en altura y en frío,
  algo que en Bogotá o Tunja marca diferencia. Con 137 kilos no es una pluma, pero el
  centro de gravedad bajo la hace sentir más liviana de lo que es. El asiento a 790 mm
  queda en el promedio del segmento, y la posición de manejo, ligeramente inclinada, cansa
  menos de lo esperado en trayectos de una hora. En carretera mantiene 90 km/h con
  comodidad y llega a 105 en plano; por encima de ahí el motor pide más de lo que tiene.
  El ABS monocanal delantero es un plus real, aunque no cubre la rueda trasera. El consumo
  de 44 km/l es alcanzable: en uso mixto real se mueve entre 38 y 42. El tanque de 13
  litros da más de 450 km de autonomía.
