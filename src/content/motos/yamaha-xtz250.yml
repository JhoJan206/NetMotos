costos_nota: >-
  Estimación para 2026 con 12.000 km al año, uso mixto y mano de obra incluida. El SOAT y
  la técnico-mecánica van aparte. El salto de categoría del SOAT es el rubro que más pesa:
  pasar de 200 cc duplica ese costo fijo, de 343.000 a 761.000 pesos al año. A eso se
  suman llantas de doble propósito y un kit de arrastre que sufre con el polvo.
comparativa: >-
  Frente a la Yamaha XTZ150, la XTZ250 cuesta 11,4 millones más y ofrece 7,4 caballos
  adicionales, disco trasero, 20 mm más de altura al piso y seis litros más de tanque: es
  un salto de categoría. Contra la Honda XRE 300, la Yamaha cuesta 7,6 millones menos y
  pierde 5,5 caballos y ABS, aunque gana en autonomía. Y si el objetivo es una doble
  propósito con ABS y precio contenido, la AKT TT200 ABS cuesta 16 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la XTZ250?"
    respuesta: >-
      El homologado es 31 km/l. En trocha con pendientes y carga baja a 25-28; en carretera a
      85 km/h sube a 33-35. Con 16 litros de tanque la autonomía práctica va de 400 a 560 km,
      la mejor del segmento.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 100 km/h y capacidad de llegar a 115. Es una doble propósito con
      enlace asfáltico competente, apta para trayectos de 200 km en vías secundarias. Por
      encima de 100 el motor va alto y las llantas de tacos restan estabilidad.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      En zona rural, sí, y es de las mejores herramientas por autonomía y capacidad de carga.
      Su limitación es el precio: 25,9 millones es mucho para reparto. Para trabajo puro, la
      XTZ150 o la Boxer 150X cuestan la mitad.
  - pregunta: "¿Cuánto cuesta el SOAT de la XTZ250?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, y una de las razones por las que
      muchos compradores rurales prefieren quedarse en ese cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      En trocha sí, porque la suspensión y el peso contenido perdonan. En ciudad es exigente
      por el asiento de 830 mm y la falta de ABS. Como primera moto rural es razonable; como
      primera moto urbana, no.
veredicto: >-
  La XTZ250 es la doble propósito de 250 con más autonomía del mercado: 16 litros y casi
  500 km teóricos. Le falta ABS y algo de motor en carretera, pero para el trabajo rural
  colombiano sigue siendo una de las opciones más sensatas.
