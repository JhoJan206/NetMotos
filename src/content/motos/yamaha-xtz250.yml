descripcion: >-
  La Yamaha XTZ250 es la doble propósito de 250 de Yamaha: 20,5 HP, 21,5 Nm, 225 mm de
  distancia al piso, discos de freno en las dos ruedas y un tanque de 16 litros por
  25.900.000 pesos. Es la moto que elige quien necesita más motor que una 150 para trocha
  y carretera, sin llegar a una adventure de 300. Es para ti si haces recorridos rurales
  largos y quieres autonomía. No es para ti si esperas ABS o si tu presupuesto está por
  debajo de los 25 millones.
uso_diario: >-
  Los 20,5 HP y 21,5 Nm mueven 148 kilos con soltura suficiente para trocha y carretera:
  en caminos empinados se sube en segunda sin exigir el embrague, y en asfalto mantiene
  95-100 km/h con comodidad. Los 225 mm de distancia al piso y la suspensión de largo
  recorrido absorben terreno roto con más autoridad que una 150, aunque sin llegar a la
  capacidad de una enduro pura. Los discos de freno en las dos ruedas son una ventaja
  frente a la XTZ150, que todavía usa tambor trasero. El asiento a 830 mm exige cierta
  estatura. El tanque de 16 litros con un consumo de 31 km/l da casi 500 km de autonomía
  teórica, la mejor del segmento de doble propósito de 250. Pesa 148 kilos, un peso
  contenido. El motor se siente algo justo frente a una XRE 300 en carretera, y la
  ausencia de ABS es su deuda pendiente en seguridad.
