costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de taller autorizado Suzuki. El
  SOAT y la técnico-mecánica van aparte. El bicilíndrico exige más aceite y dos bujías, y
  las llantas de medida grande cuestan más que las de una 150. A cambio, los intervalos de
  servicio son largos y la moto está pensada para durar: es el tipo de mantenimiento que
  se paga con la tranquilidad de no quedar varado en una carretera.
comparativa: >-
  Frente a la Bajaj Dominar 250, la V-Strom cuesta 8,1 millones más y ofrece 2,6 caballos
  menos, aunque gana en autonomía, en suavidad de motor y en capacidad de trocha liviana.
  Contra la Kawasaki Versys-X 300, la Suzuki cuesta 7 millones menos y pierde 15 caballos
  y un motor más revolucionado, aunque gana en torque a bajas vueltas. Y si el presupuesto
  aprieta, la Honda XRE 300 ofrece más capacidad de trocha real por 9,6 millones más.
faq:
  - pregunta: "¿Cuánto consume realmente la V-Strom 250?"
    respuesta: >-
      El homologado es 30 km/l. En ciudad con tráfico el registro está entre 25 y 28; en
      carretera a 100 km/h sube a 32-34. Con 17,3 litros de tanque la autonomía práctica va de
      420 a 580 km, la mejor de su segmento.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su terreno. Mantiene 110 km/h sin vibraciones y llega a 135 en plano. La posición
      erguida y el tanque grande permiten trayectos de 300 km sin fatiga ni paradas
      frecuentes. Con parrillero y equipaje pierde brío en subida, pero no se queda.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Pesa 188 kilos, cuesta 23,9 millones y su mantenimiento supera el millón y medio
      anual. Es una moto de viaje. Para trabajo, una 125 cuesta una fracción de lo que cuesta
      operar esta.
  - pregunta: "¿Cuánto cuesta el SOAT de la V-Strom 250?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, un costo fijo que conviene sumar
      antes de decidir el salto de cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las adventure más amables para empezar: 24 caballos, entrega suave,
      asiento de 800 mm y ABS de doble canal. El peso de 188 kilos es lo único que exige
      práctica en maniobras lentas y en parqueadero.
veredicto: >-
  La V-Strom 250 SX es una moto de concepto claro: viajar cómodo y sin prisa, con
  autonomía y confiabilidad por encima de las prestaciones. Quien la compre esperando
  emoción se va a aburrir; quien la compre para cruzar el país a 100 km/h va a ser feliz.
