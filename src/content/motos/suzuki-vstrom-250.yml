descripcion: >-
  La Suzuki V-Strom 250 SX es la adventure de entrada de Suzuki: motor bicilíndrico de 249
  cc, 24 HP, ABS de doble canal y un tanque de 17,3 litros por 23.900.000 pesos. Es, en
  concepto, una moto de trail asfáltico: capacidad de trocha liviana, posición cómoda y
  autonomía de turística. Es para ti si quieres viajar por carretera y caminos destapados
  suaves con una moto confiable y de marca japonesa. No es para ti si esperas
  prestaciones: 24 caballos para 188 kilos es una relación modesta, y eso se siente con
  parrillero y equipaje en pendiente.
uso_diario: >-
  El bicilíndrico de 249 cc es lo más interesante de esta moto: entrega 24 HP con una
  suavidad que ningún monocilíndrico de su precio iguala, y vibra mucho menos a 100 km/h.
  Ese refinamiento es lo que se paga en la factura. El tanque de 17,3 litros, con un
  consumo de 30 km/l, da más de 480 km de autonomía teórica y unos 420 reales, una cifra
  de turística. La posición es erguida, con manubrio alto y estriberas centradas, cómoda
  durante dos horas. El asiento a 800 mm es accesible y la protección aerodinámica
  suficiente para viajar a 100 km/h. Los frenos con ABS de doble canal funcionan bien
  sobre disco de 290 mm adelante. La limitación es la potencia: 24 caballos para 188 kilos
  significan que adelantar requiere planearlo y que una subida larga con dos personas
  obliga a bajar dos marchas. La suspensión está enfocada en asfalto, así que en trocha
  exigente se queda corta.
