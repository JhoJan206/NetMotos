descripcion: >-
  La Kawasaki Z400 es la versión naked de la Ninja 400: mismo motor bicilíndrico de 399 cc
  con 45 HP y 37 Nm, pero con una posición erguida y un precio de 33.990.000 pesos. Es una
  de las naked de 400 más equilibradas del mercado y la alternativa lógica para quien
  quiere las prestaciones de la Ninja sin la posición deportiva. Es para ti si haces uso
  mixto entre ciudad y carretera y quieres prestaciones con comodidad. No es para ti si
  buscas una moto de diseño llamativo o si tu presupuesto está por debajo de los 30
  millones.
uso_diario: >-
  El motor de 399 cc entrega 45 HP con una suavidad que se agradece en ciudad: se puede
  rodar en tercera a 40 km/h sin tirones y en carretera mantener 130 km/h con reserva
  hasta 170. La diferencia con la Ninja es la ergonomía: el manubrio es más alto y las
  estriberas están centradas, así que el torso va erguido y las muñecas no cargan. Eso
  convierte a la Z400 en una moto usable todos los días, no solo los fines de semana. Con
  167 kilos, es ágil en tráfico y estable en curva. El ABS de doble canal frena sobre
  disco de 310 mm. El asiento a 785 mm es accesible y el del parrillero, aunque pequeño,
  es más usable que el de la Ninja. El consumo de 26 km/l con 14 litros da unos 360 km de
  autonomía, su punto débil para viajar.
