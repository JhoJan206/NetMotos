costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Kawasaki. El
  SOAT y la técnico-mecánica van aparte. El mantenimiento es prácticamente el de la Ninja
  400: misma base mecánica, mismas llantas, mismos intervalos. La única diferencia es que
  una caída sin carenado cuesta mucho menos de reparar.
comparativa: >-
  Frente a la Kawasaki Ninja 400, la Z400 cuesta 2 millones menos y ofrece 3,3 caballos
  menos, con una posición mucho más cómoda para el día a día. Contra la Yamaha MT-03, la
  Kawasaki cuesta 2,1 millones más y ofrece 3 caballos adicionales y 83 cc más, aunque
  pierde el embrague antirrebote y la conectividad. Y si el objetivo es una naked de 400
  al menor precio, la Bajaj Pulsar NS400Z ofrece 39,4 caballos por 15,7 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la Z400?"
    respuesta: >-
      El homologado es 26 km/l. En ciudad con tráfico el registro está entre 21 y 24; en
      carretera a 110 km/h sube a 28-30. Con 14 litros de tanque la autonomía práctica va de
      290 a 420 km, su principal limitación para viajar.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con soltura: mantiene 130 km/h sin vibraciones y llega a 170 en plano. La posición
      erguida permite trayectos de 250 km con menos fatiga que en la Ninja. La autonomía y la
      falta de protección aerodinámica son sus límites.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No es lo más rentable: consume 23 km/l en ciudad y su mantenimiento supera los dos
      millones al año. Sirve para trabajo si valoras prestaciones en trayectos largos, pero
      para reparto urbano una 125 cuesta cinco veces menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la Z400?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el mismo valor que una 250 y representa el 2,2 % del precio de la
      moto.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Con criterio, sí. La entrega es lineal, el peso es contenido y el ABS de doble canal
      cubre errores. Pero 45 caballos exigen respeto. Es una buena segunda moto para quien ya
      maneja una 250 y quiere subir de nivel.
veredicto: >-
  La Z400 es la naked de 400 más equilibrada para uso diario: prestaciones de Ninja con
  ergonomía de moto de todos los días. Su precio y su autonomía son sus dos objeciones, y
  ninguna de las dos es mecánica.
