costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario BMW Motorrad.
  El SOAT y la técnico-mecánica van aparte. El mantenimiento de una BMW no es el de una
  india: mano de obra de concesionario, repuestos importados y aceite sintético. A cambio,
  los intervalos son largos y la moto está construida para durar. La red de servicio es el
  factor a revisar antes de comprar.
comparativa: >-
  Frente a la Yamaha MT-03, la BMW cuesta 3,9 millones menos y ofrece 8 caballos menos,
  con un motor monocilíndrico frente a un bicilíndrico: pierde en suavidad y gana en
  acabado y en precio. Contra la Kawasaki Z400, la G 310 R cuesta 6 millones menos y
  ofrece 11 caballos menos, aunque gana en calidad percibida. Y si el objetivo es una
  naked de 300 con la mejor relación precio-prestaciones, la Bajaj Pulsar NS400Z ofrece
  39,4 caballos por 9,7 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la G 310 R?"
    respuesta: >-
      El homologado es 27 km/l. En ciudad con tráfico el registro está entre 22 y 25; en
      carretera a 100 km/h sube a 29-31. Con 11 litros de tanque la autonomía práctica va de
      250 a 340 km, la más corta del segmento de 300.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con comodidad hasta 120 km/h y capacidad de llegar a 145. El motor no vibra en
      exceso y el chasis es muy estable. La limitación es la autonomía: hay que parar cada 250
      km, algo poco práctico para viajar.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Cuesta 28 millones, el mantenimiento es de concesionario BMW y la autonomía es
      corta. Es una moto de uso personal y disfrute. Para trabajo, una 125 cuesta cinco veces
      menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la G 310 R?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Sobre una moto de 28 millones representa el 2,7 % del valor:
      manejable, pero hay que sumarlo al mantenimiento premium.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es una de las mejores opciones para empezar en el mundo de las motos de marca
      premium: 34 caballos, entrega lineal, peso contenido y ABS de doble canal. La autonomía
      corta es su única limitación práctica.
veredicto: >-
  La G 310 R es la BMW que se compra con la razón y se defiende con los acabados: chasis
  equilibrado, frenos sólidos y una calidad de construcción que se siente. Su tanque de 11
  litros es su gran debilidad, y la red de servicio, su condición.
