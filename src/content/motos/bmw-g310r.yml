descripcion: >-
  La BMW G 310 R es la naked de entrada de BMW Motorrad: motor monocilíndrico de 313 cc
  con cilindro invertido, 34 HP, 28 Nm, ABS de doble canal y acabados propios de la marca
  alemana por 27.990.000 pesos. Es la BMW más accesible del mercado colombiano y una moto
  que se compra tanto por lo que ofrece como por lo que representa. Es para ti si quieres
  una naked de 300 con calidad de construcción y comportamiento equilibrado. No es para ti
  si priorizas precio por caballo o si vives lejos de un concesionario BMW.
uso_diario: >-
  El motor de 313 cc con cilindro invertido —culata hacia atrás— baja el centro de
  gravedad y permite un chasis más compacto, y eso se siente en la conducción: la moto
  entra a curva con una facilidad que no corresponde a su cilindraje y se mantiene muy
  estable en frenadas fuertes. Los 34 HP permiten mantener 120 km/h en carretera y llegar
  a 145 en plano, con una entrega lineal que no sorprende pero tampoco se queda. La
  posición es erguida, con el asiento a 785 mm accesible y un manubrio ancho que da
  control. El ABS de doble canal frena sobre disco de 300 mm adelante. Pesa 158 kilos, un
  peso contenido que la hace ágil en ciudad. El punto débil es el tanque: 11 litros con un
  consumo de 27 km/l dan apenas 300 km de autonomía, poco para una moto de 300. Los
  acabados y la tornillería están claramente por encima de la media del segmento.
