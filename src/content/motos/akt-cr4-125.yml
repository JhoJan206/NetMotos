costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. El doble disco encarece el mantenimiento frente a una 125
  con tambor trasero, pero la diferencia anual ronda los 40.000 pesos: poco dinero por un
  margen de seguridad que se nota en cada frenada. El resto es costo típico de 125
  carburada.
comparativa: >-
  Frente a la AKT NKD 125, la CR4 cuesta 1,7 millones más y ofrece doble disco con CBS y
  un diseño completamente distinto, aunque pierde 1,2 caballos. Contra la TVS Raider 125,
  la CR4 es 1,7 millones más cara y ofrece lo mismo en frenos, pero la TVS suma inyección
  y cinco marchas mejor escalonadas. Y si el presupuesto llega a siete millones, la CR4
  150 entrega 3,2 caballos más por solo 400.000 pesos adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la CR4 125?"
    respuesta: >-
      El homologado es 40 km/l. En ciudad con tráfico denso baja a 35-38; en carretera a 70
      km/h sube a 44. Con el tanque de 12,5 litros la autonomía práctica está entre 420 y 550
      km, suficiente para dos semanas de uso urbano.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos cortos sí, con límites. Mantiene 75-80 km/h y llega a 90 en plano, pero por
      encima de 80 el motor va revolucionado y el consumo se dispara. Para viajes de más de
      100 km conviene subir a la CR4 150 o a una 200.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sirve, aunque su precio y sus llantas la hacen menos rentable que una 125 básica. Su
      ventaja es la frenada: en tráfico denso con frenadas constantes, el CBS da margen. Para
      reparto de alto volumen, una NKD o una CT 125 cuestan menos de operar.
  - pregunta: "¿Cuánto cuesta el SOAT de la CR4 125?"
    respuesta: >-
      Con 124,6 cc paga la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año. Es el
      mismo valor de cualquier 125, aunque el precio de la moto sea 1,7 millones mayor que el
      de la versión básica; el SOAT depende del cilindraje, no del equipamiento.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es una de las mejores 125 para empezar por la frenada: el CBS y el doble disco perdonan
      errores que en una moto con tambor terminan en caída. El motor es dócil y el peso
      contenido. La postura algo deportiva es lo único que puede incomodar los primeros días.
veredicto: >-
  La CR4 125 es la 125 que demuestra que la seguridad no tiene que costar un millón más:
  doble disco con CBS por 6,6 millones es una propuesta seria. Su techo es el motor; su
  argumento, la frenada. Quien priorice seguridad sobre prestaciones la va a valorar.
