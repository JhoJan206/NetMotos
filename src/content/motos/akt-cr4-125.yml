descripcion: >-
  La AKT CR4 125 es la 125 más equipada de AKT: frenos de disco en las dos ruedas con
  sistema CBS, horquilla de estilo invertido, diseño deportivo y 9,3 HP. Con 6.590.000
  pesos se ubica 1,1 millones por encima de la CR4 básica y 1,7 millones por encima de la
  NKD, y a cambio ofrece un paquete de seguridad y presencia que ninguna otra 125
  económica iguala. Es para ti si quieres una 125 con frenos serios y una moto que se vea
  actual. No es para ti si buscas prestaciones: 9,3 caballos siguen siendo 9,3 caballos,
  por más que el carenado sugiera otra cosa.
uso_diario: >-
  La CR4 125 tiene la particularidad de frenar mejor que casi cualquier 125 de su precio:
  disco de 240 mm adelante y 200 mm atrás, ambos con CBS, que reparte la fuerza entre las
  dos ruedas al accionar el freno trasero. En lluvia y en frenadas de emergencia, esa
  combinación marca una diferencia real frente al tambor trasero de sus rivales. El motor
  de 124,6 cc entrega 9,3 HP con una entrega suave y predecible, suficiente para ciudad y
  para trayectos cortos de carretera. La horquilla de aspecto invertido es más estética
  que funcional en este rango de precio, pero aporta rigidez y se ve bien. Pesa 120 kilos,
  el asiento a 785 mm queda en el promedio y la posición es ligeramente deportiva, con el
  torso inclinado. El consumo de 40 km/l con tanque de 12,5 litros da unos 450 km de
  autonomía. En carretera se defiende hasta 80 km/h; por encima, el motor pide más de lo
  que puede dar.
