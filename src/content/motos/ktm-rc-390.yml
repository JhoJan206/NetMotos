costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario KTM. El SOAT y
  la técnico-mecánica van aparte. Es una de las fichas más caras de mantener: llantas
  deportivas de 17 pulgadas que duran 9.000 km, pastillas en las dos ruedas, aceite
  sintético y SOAT de categoría alta. A eso hay que sumar el costo de los plásticos si la
  moto se cae, que en una carenada nunca es barato.
comparativa: >-
  Frente a la Bajaj Pulsar RS200, la RC 390 cuesta 15 millones más y ofrece 19,9 caballos
  adicionales, ABS en curva, suspensiones WP y un chasis de otro nivel: son motos de
  categorías distintas. Contra la Yamaha YZF-R9, la KTM cuesta unos 40 millones menos y
  pierde 73 caballos y un motor tricilíndrico, aunque gana en peso y en costo de
  mantenimiento. Y si el objetivo es una deportiva de 400 para uso mixto, la Kawasaki
  Ninja 400 ofrece 1 caballo menos y un motor bicilíndrico por 3,5 millones menos.
faq:
  - pregunta: "¿Cuánto consume realmente la RC 390?"
    respuesta: >-
      El homologado es 25 km/l. En uso deportivo real el registro baja a 19-22; en carretera a
      100 km/h constante sube a 27-29. Con 13,7 litros de tanque la autonomía práctica va de
      260 a 400 km, muy dependiente de cómo se use el acelerador.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, con la advertencia de la posición. El motor mantiene 130 km/h sin esfuerzo y llega a
      170, y el carenado protege bien. Pero la ergonomía es de pista: después de 200 km la
      espalda y las muñecas pasan factura. Es una moto para trayectos deportivos, no para
      turismo.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No, en absoluto. La posición agachada, el calor del motor en tráfico, el consumo de 21
      km/l y el costo de reparar plásticos la hacen inviable para trabajo. Es una moto de
      disfrute y de circuito.
  - pregunta: "¿Cuánto cuesta el SOAT de la RC 390?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Son 418.000 pesos más que una 200, y hay que sumarlos a un
      mantenimiento anual que ronda los dos millones.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 44 caballos, 172 kilos y una posición extrema, es una moto que castiga los
      errores y que requiere experiencia real. Además, una caída en una carenada deportiva
      puede costar más que un mes de salario. Es una tercera moto, no una primera.
veredicto: >-
  La RC 390 es la deportiva monocilíndrica más seria del mercado colombiano y se paga como
  tal. Si tienes dónde aprovecharla, es una de las motos más divertidas que se pueden
  comprar; si la quieres para ir a la oficina, vas a odiar cada semáforo.
