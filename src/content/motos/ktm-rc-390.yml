descripcion: >-
  La KTM RC 390 es la deportiva monocilíndrica más radical que se vende en Colombia: 399
  cc, 44 HP, 39 Nm, 172 kilos y un chasis de acero enrejado con ABS en curva, por
  30.990.000 pesos. No es una deportiva de imagen: es una moto de pista con espejos y
  luces. Es para ti si haces track days, si disfrutas la conducción agresiva y aceptas una
  posición que castiga en tráfico. No es para ti si tu uso es urbano diario, si llevas
  parrillero con frecuencia o si las vías por donde ruedas están en mal estado.
uso_diario: >-
  El motor de 399 cc entrega 44 HP y 39 Nm con una contundencia que en carretera de
  montaña es adictiva: sale de curva con fuerza desde 5.000 rpm y sigue empujando hasta el
  corte, con una caja de seis marchas de recorrido corto que invita a subir y bajar
  constantemente. El chasis enrejado y la horquilla invertida WP dan una precisión que
  ninguna otra monocilíndrica del mercado iguala, y el ABS en curva permite frenar
  inclinado con un margen que en una moto sin ese sistema sería impensable. Los frenos
  radiales ByBre de 320 mm adelante son de nivel pista. La contraparte es la ergonomía: la
  posición es agresiva, con estriberas muy retrasadas y el torso casi sobre el tanque, y
  en tráfico la espalda y las muñecas lo pagan. La suspensión es rígida: en las vías rotas
  colombianas se siente cada hueco. El consumo de 25 km/l con 13,7 litros da unos 340 km
  de autonomía, corta para una moto con vocación de viaje.
