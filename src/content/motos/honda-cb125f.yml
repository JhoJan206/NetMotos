descripcion: >-
  La Honda CB125F es la 125 urbana que compra quien quiere una moto para diez años y no
  para tres. Con inyección PGM-FI, 10,8 HP, 116 kilos y el asiento más bajo del segmento
  (771 mm), apunta a un público muy concreto: quien la usa a diario, no quiere sorpresas y
  valora el respaldo de la red Honda por encima del precio de lista. Es para ti si buscas
  fiabilidad, reventa y bajo consumo. No es para ti si quieres diseño llamativo, freno
  trasero de disco o prestaciones: la CB125F es deliberadamente conservadora.
uso_diario: >-
  La inyección cambia la experiencia frente a las 125 carburadas: arranca en frío al
  primer toque, no necesita starter y mantiene el ralentí estable con humedad o a 2.800
  metros de altura, algo que en Bogotá se agradece todos los días. La entrega de potencia
  es suave y predecible, ideal para quien nunca ha manejado moto. Pesa 116 kilos, el peso
  más bajo entre las 125 de marca japonesa, y eso se traduce en maniobras fáciles entre
  carros y al parquear. El asiento a 771 mm permite que pilotos de 1,60 m apoyen bien los
  pies. En carretera se defiende hasta 80 km/h con comodidad y llega a 90 en plano, pero
  el motor de dos válvulas está pensado para economía, no para velocidad. El consumo
  declarado de 52 km/l es alcanzable en uso real: entre 45 y 50 en ciudad. La suspensión
  es blanda, cómoda en huecos, aunque se hunde con dos pasajeros.
