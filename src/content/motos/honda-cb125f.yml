costos_nota: >-
  Estimación para Colombia en 2026, 12.000 km al año y mano de obra incluida en taller
  autorizado Honda; en taller independiente baja entre 20 % y 30 %. El SOAT y la
  técnico-mecánica van aparte. La CB125F tiene intervalos de servicio más largos que las
  125 carburadas, y ese es el ahorro silencioso de la inyección: menos visitas al taller
  por año, no necesariamente repuestos más baratos.
comparativa: >-
  Frente a la AKT NKD 125, la CB125F cuesta unos 300.000 pesos más y ofrece inyección,
  mejor acabado y una reventa claramente superior; a cambio, los repuestos son más caros y
  la red de talleres no llega a tantos municipios. Contra la Bajaj CT 125, la Honda gana
  en refinamiento y pierde en precio y en economía de mantenimiento. Y si el presupuesto
  aprieta pero quieres inyección, la TVS Raider 125 o la Bajaj Pulsar N125 FI son las
  alternativas directas a revisar.
faq:
  - pregunta: "¿Cuánto consume realmente la CB125F?"
    respuesta: >-
      Honda declara 52 km/l. En ciudad, con tráfico denso, el registro real ronda 45-48 km/l;
      en carretera a 70 km/h se acerca a 55. Con 11 litros de tanque eso da entre 480 y 580 km
      de autonomía, una de las mejores cifras del segmento.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Tramos de 100 a 150 km sin problema, a 75-80 km/h. Por encima de 85 el motor de dos
      válvulas se queda sin aire y el consumo sube. Es una moto para vías secundarias y
      trayectos urbanos largos, no para autopista sostenida.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      Sí, aunque no es la más barata de operar: sus repuestos cuestan más que los de Bajaj o
      AKT. A cambio ofrece algo que un repartidor valora mucho: la moto no se queda varada. Si
      el volumen de pedidos es alto y el presupuesto ajustado, una CT 125 sale más rentable.
  - pregunta: "¿Cuánto cuesta el SOAT de la CB125F?"
    respuesta: >-
      Con 124 cc entra en la categoría de 100 a 200 cc: alrededor de 343.000 pesos al año, más
      180.000 de revisión técnico-mecánica. Es el costo fijo que hay que tener en cuenta al
      comparar con una 100 cc, que paga unos 87.000 pesos menos.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Es una de las mejores opciones para empezar. Peso bajo, asiento de 771 mm, inyección que
      no se ahoga y una entrega de potencia que no asusta. La única tarea pendiente es el
      freno trasero de tambor, que exige acostumbrarse a frenar con el delantero como eje
      principal.
veredicto: >-
  La CB125F no gana ningún comparativo de ficha técnica y aun así es una de las 125 más
  recomendables del país: arranca siempre, gasta poco, se revende bien y no da guerra.
  Para quien compra moto una vez cada muchos años, eso vale más que dos caballos extra.
