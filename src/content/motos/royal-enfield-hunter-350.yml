costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra de concesionario Royal Enfield.
  El SOAT y la técnico-mecánica van aparte. El mantenimiento de la Hunter es ligeramente
  más económico que el de la Classic por peso y por desgaste de llanta, pero sigue siendo
  el de una moto de 350 con SOAT de categoría alta. Los repuestos de la marca se consiguen
  en los concesionarios, no en talleres de barrio.
comparativa: >-
  Frente a la Royal Enfield Classic 350, la Hunter cuesta 4 millones menos y ofrece el
  mismo motor con 14 kilos menos y una postura más neutra: para uso urbano es la compra
  más lógica de la marca. Contra la Honda CB190R 2.0, la Royal cuesta 3,2 millones más y
  ofrece 3,2 caballos adicionales, más torque y un carácter que la Honda no tiene, aunque
  pierde red de servicio y reventa. Y si el objetivo es una 350 para carretera con
  parrillero, la Meteor 350 es más adecuada por posición y tanque.
faq:
  - pregunta: "¿Cuánto consume realmente la Hunter 350?"
    respuesta: >-
      El homologado es 34 km/l. En ciudad con tráfico el registro está entre 29 y 32; en
      carretera a 90 km/h sube a 37-39. Con 13 litros de tanque la autonomía práctica es de
      380 a 500 km, una de las mejores del segmento de 350.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Sí, a ritmo tranquilo. Mantiene 100 km/h con comodidad y llega a 115 en plano. El motor
      vibra por encima de 105 y la posición erguida expone al viento, así que es una moto para
      rutas de 150 a 200 km a 90 km/h, no para autopista.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Cuesta 16 millones, pesa 181 kilos y su mantenimiento supera el millón cuatrocientos
      mil al año. Es una moto de disfrute. Para trabajo hay opciones que cuestan una fracción
      de eso, tanto de compra como de operación.
  - pregunta: "¿Cuánto cuesta el SOAT de la Hunter 350?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, y el principal costo fijo de tener
      una 350 en Colombia.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      Sí, es la Royal más amable para empezar: 181 kilos, asiento a 790 mm, motor de torque
      bajo y ABS de doble canal. La advertencia es la altura de 150 mm al piso, que obliga a
      pasar resaltos con cuidado, y la suspensión trasera firme.
veredicto: >-
  La Hunter 350 es la Royal Enfield más racional del portafolio: mismo carácter, menos
  peso, menos precio y una postura que sirve para todo. Su límite es la suspensión trasera
  y la falta de potencia con dos personas, no su capacidad de enamorar.
