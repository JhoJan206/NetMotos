descripcion: >-
  La Royal Enfield Hunter 350 es la puerta de entrada a la marca en Colombia: 349 cc, 20,2
  HP, 27 Nm y 181 kilos por 15.990.000 pesos. Es la Royal más liviana y ágil del
  portafolio, con un chasis más corto que el de la Classic y una postura neutra que
  funciona igual en ciudad que en carretera. Es para ti si quieres el carácter de un motor
  clásico con una moto manejable y a precio contenido. No es para ti si necesitas potencia
  para dos personas con equipaje en pendiente o si haces trocha: la suspensión trasera de
  recorrido corto y los 150 mm al piso no están hechos para eso.
uso_diario: >-
  La Hunter se siente inmediatamente más ágil que sus hermanas: 181 kilos y una distancia
  entre ejes corta la hacen manejable en tráfico y fácil de parquear, algo que en una
  Classic de 195 kilos no ocurre. El motor es el mismo de 349 cc con 27 Nm a 4.000 rpm,
  así que se puede rodar en cuarta o quinta a velocidad de ciudad sin tocar el cambio, y
  el sonido de escape sigue siendo el gran atractivo de la marca. La posición es erguida,
  con el manubrio ancho y las estriberas centradas, cómoda para trayectos de una hora. Los
  frenos con ABS de doble canal funcionan bien, aunque el trasero se siente algo esponjoso
  frente a la competencia japonesa. La suspensión trasera de recorrido corto es el punto
  débil: en vías rotas o en resaltos se siente seca y hace tope con pasajero. En carretera
  mantiene 100 km/h con comodidad y llega a 115 en plano, sin resto para adelantar con
  autoridad.
