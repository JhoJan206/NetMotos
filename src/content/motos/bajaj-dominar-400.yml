costos_nota: >-
  Estimación para 2026 con 12.000 km al año y mano de obra incluida. El SOAT y la
  técnico-mecánica van aparte. Es la ficha más cara de mantener de este bloque: llantas de
  17 pulgadas anchas, aceite sintético, refrigerante y SOAT de categoría alta. Quien pasa
  de una 200 a una 400 debe presupuestar entre 600.000 y 700.000 pesos más al año.
comparativa: >-
  Frente a la Bajaj Dominar 250, la 400 cuesta 3,6 millones más y ofrece 12,8 caballos
  adicionales, horquilla invertida y una presencia mucho mayor: es un salto de categoría
  real. Contra la KTM 390 Duke, la Dominar cuesta 11,5 millones menos con un motor
  derivado del mismo bloque, aunque pierde electrónica y acabado. Y si buscas una naked de
  400 más deportiva, la Kawasaki Z400 ofrece 5,6 caballos más por 14,5 millones
  adicionales.
faq:
  - pregunta: "¿Cuánto consume realmente la Dominar 400?"
    respuesta: >-
      El homologado es 28 km/l. En ciudad con tráfico denso baja a 23-25; en carretera a 110
      km/h sube a 31-33. Con 13 litros de tanque la autonomía práctica va de 300 a 430 km, lo
      que en viaje obliga a planear las paradas.
  - pregunta: "¿Aguanta carretera?"
    respuesta: >-
      Es su razón de existir. Mantiene 130 km/h sin esfuerzo y llega a 160. La posición
      erguida, el asiento amplio y la protección contra el viento la hacen una turística
      competente para trayectos de 300 a 400 km por día.
  - pregunta: "¿Sirve para domicilios y trabajo?"
    respuesta: >-
      No. Pesa 193 kilos, paga SOAT de categoría alta y consume 25 km/l en ciudad. Es una moto
      de viaje y disfrute. Para trabajo, una 125 o 150 cuesta una fracción de lo que cuesta
      operar esta.
  - pregunta: "¿Cuánto cuesta el SOAT de la Dominar 400?"
    respuesta: >-
      Por superar los 200 cc paga la tarifa alta: alrededor de 761.000 pesos al año, más la
      técnico-mecánica. Es el doble de lo que paga una 200, un costo que conviene sumar antes
      de decidir el salto de cilindraje.
  - pregunta: "¿Es buena para principiantes?"
    respuesta: >-
      No. Con 39,4 caballos y 193 kilos, es una moto que exige experiencia, sobre todo en
      maniobras lentas y en frenadas de emergencia. Es una excelente segunda o tercera moto
      para quien ya domina una 200 o 250.
veredicto: >-
  La Dominar 400 es la puerta de entrada al turismo de media cilindraje en Colombia: 39
  caballos, ABS de doble canal y suspensión invertida por menos de veinte millones. Su
  única debilidad seria es el tanque, corto para la vocación viajera que propone.
