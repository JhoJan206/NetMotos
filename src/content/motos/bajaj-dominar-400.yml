descripcion: >-
  La Bajaj Dominar 400 es la moto de mayor cilindraje que Bajaj vende en Colombia: 373 cc,
  39,4 HP, 35 Nm, ABS de doble canal y suspensión invertida por 19.399.000 pesos. Es la
  naked de 400 más económica del mercado y una de las pocas opciones de turismo deportivo
  accesible. Es para ti si quieres una moto para viajar con parrillero y equipaje, con
  potencia de sobra y precio contenido. No es para ti si tu uso es exclusivamente urbano:
  193 kilos en tráfico son una carga, y el calor del motor en semáforos se nota.
uso_diario: >-
  Los 39,4 caballos y 35 Nm de torque convierten a la Dominar 400 en una moto que no se
  queda en ningún lado: adelanta en sexta sin bajar marcha, mantiene 130 km/h con el motor
  relajado y tiene reserva hasta 160. En carretera es donde tiene sentido: la posición
  erguida, el asiento amplio y la protección aerodinámica permiten trayectos de 400 km sin
  terminar destruido. La suspensión invertida delantera le da aplomo en curva y el ABS de
  doble canal frena con autoridad. En ciudad, en cambio, los 193 kilos se sienten en cada
  maniobra lenta y en cada parqueadero; el motor calienta y el ventilador trabaja seguido.
  El tablero digital tiene menú poco intuitivo, un detalle menor pero molesto. El consumo
  de 28 km/l con 13 litros de tanque da unos 360 km de autonomía, algo corta para una
  turística: en viaje hay que tanquear cada 300 km.
